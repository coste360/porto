        price_list_id: { type: string }
        total_cents: { $ref: "#/components/schemas/Cents" }
        deposit_cents: { $ref: "#/components/schemas/Cents" }
        engine_version: { type: integer }
        breakdown: { $ref: "#/components/schemas/PriceBreakdown" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        expected_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        expected_departure_time: { $ref: "#/components/schemas/LocalTime" }
