        kind: { $ref: "#/components/schemas/TemplateKind" }
        locale: { $ref: "#/components/schemas/Locale" }
        subject_type: { $ref: "#/components/schemas/DocumentSubjectType" }
        subject_id: { type: string }
        status: { $ref: "#/components/schemas/GeneratedDocumentStatus" }
        sha256: { type: string }
        pages: { type: integer }
        pdfa: { type: boolean }
        signed: { type: boolean }
        signed_from_id: { type: string }
        template_version:
          type: object
          properties:
            template_id: { type: string }
            version: { type: integer }
            builtin_ref: { type: string }
        error_code: { type: string }
        rendered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    GeneratedDocumentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GeneratedDocument" }
        next_cursor: { type: [string, "null"] }

    # ---- signatures ----

    SignatureRequestStatus:
      type: string
      enum: [pending_document, sent, partially_signed, signed, declined, expired, cancelled]

    SignatureSubjectType:
      type: string
      enum: [contract, addendum, right_transfer]

    SignerStatus:
      type: string
      enum: [waiting, invited, signed, declined]

    Signer:
      type: object
      required: [id, seq, role, status]
      properties:
        id: { type: string }
        seq: { type: integer }
        role: { $ref: "#/components/schemas/SignerRole" }
        customer_id: { type: string }
        user_id: { type: string }
        display_name: { type: string, description: Only with customers.read }
        email: { type: string, description: Only with customers.read }
        status: { $ref: "#/components/schemas/SignerStatus" }
        invited_at: { type: string, format: date-time }
        opened_at: { type: string, format: date-time }
        signed_at: { type: string, format: date-time }
        declined_at: { type: string, format: date-time }
        has_paper_scan: { type: boolean }

    SignatureRequest:
      type: object
      required: [id, subject_type, subject_id, document_id, driver, order_mode, status, expires_at, signers, created_at, version]
      properties:
        id: { type: string }
        subject_type: { $ref: "#/components/schemas/SignatureSubjectType" }
        subject_id: { type: string }
        document_id: { type: string }
        driver: { $ref: "#/components/schemas/SignatureDriver" }
        provider_code: { type: string }
        order_mode: { $ref: "#/components/schemas/SignatureOrderMode" }
        status: { $ref: "#/components/schemas/SignatureRequestStatus" }
        expires_at: { type: string, format: date-time }
        last_reminder_at: { type: string, format: date-time }
        signed_document_id: { type: string }
        completed_at: { type: string, format: date-time }
        signers:
          type: array
          items: { $ref: "#/components/schemas/Signer" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    SignatureRequestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SignatureRequest" }
        next_cursor: { type: [string, "null"] }

    PaperScanResult:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string }

    SignatureSettings:
      type: object
      required: [has_credentials, has_webhook_secret, available_providers, version]
      properties:
        provider_code: { type: string }
        has_credentials: { type: boolean }
        has_webhook_secret: { type: boolean }
        available_providers:
          description: Codes of the registered ext.SignatureProvider drivers (none ships with Porto)
          type: array
          items: { type: string }
        webhook_url: { type: string }
        version: { type: integer }

    SignatureSettingsInput:
      type: object
      properties:
        provider_code: { type: [string, "null"], maxLength: 64 }
        credentials:
          description: Write-only provider credentials (stored encrypted)
          type: object
          additionalProperties: { type: string, maxLength: 4096 }
        webhook_secret: { type: string, maxLength: 512, description: Write-only }

    # ---- communications ----

    CommCategory:
      type: string
      enum: [service, promotional]

    CommStatus:
      type: string
      enum: [draft, scheduled, sending, sent, cancelled]

    CommAudience:
      description: A filter, explicit customer ids, or a map selection
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 36 }
        structures:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 36 }
        contract_kinds:
          type: array
          items: { $ref: "#/components/schemas/ContractKind" }
        terms:
          type: array
          items: { $ref: "#/components/schemas/ContractTerm" }
        holders: { type: boolean }
        present_from: { $ref: "#/components/schemas/IsoDate" }
        present_to: { $ref: "#/components/schemas/IsoDate" }
        with_deadlines_within_days: { type: integer, minimum: 1, maximum: 365 }
        customer_ids:
          type: array
          maxItems: 5000
          items: { type: string, maxLength: 36 }
        map_id: { type: string, maxLength: 36 }
        resource_ids:
          type: array
          maxItems: 5000
          items: { type: string, maxLength: 36 }

    CommAttachment:
      type: object
      properties:
        document_id: { type: string, maxLength: 36 }
        file_id: { type: string, maxLength: 36 }

    Communication:
      type: object
      required: [id, name, category, audience, channels, subject, body_md, attachments, status, counts, created_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CommCategory" }
        audience: { $ref: "#/components/schemas/CommAudience" }
        channels:
          type: array
          items: { type: string }
        template_id: { type: string }
        subject: { type: string }
        body_md: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/CommAttachment" }
        scheduled_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CommStatus" }
        counts:
          type: object
          additionalProperties: { type: integer }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    CommunicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Communication" }
        next_cursor: { type: [string, "null"] }

    CommunicationInput:
      type: object
      required: [name, category, audience]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommCategory" }
        audience: { $ref: "#/components/schemas/CommAudience" }
        channels:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 16 }
        template_id: { type: string, maxLength: 36 }
        subject: { type: string, maxLength: 200 }
        body_md: { type: string, maxLength: 65536 }
        attachments:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/CommAttachment" }
        scheduled_at: { type: string, format: date-time }

    CommunicationPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommCategory" }
        audience: { $ref: "#/components/schemas/CommAudience" }
        channels:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 16 }
        template_id: { type: [string, "null"], maxLength: 36 }
        subject: { type: string, maxLength: 200 }
        body_md: { type: string, maxLength: 65536 }
        attachments:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/CommAttachment" }

    CommunicationPreviewInput:
      type: object
      properties:
        customer_id: { type: string, maxLength: 36 }

    CommunicationPreview:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: object
          required: [count, skipped_no_consent, skipped_no_email]
          properties:
            count: { type: integer, description: Recipients in the audience }
            skipped_no_consent: { type: integer }
            skipped_no_email: { type: integer }
        sample:
          type: object
          required: [subject, html, text]
          properties:
            subject: { type: string }
            html: { type: string }
            text: { type: string }

    ScheduleInput:
      type: object
      required: [scheduled_at]
      properties:
        scheduled_at: { type: string, format: date-time }

    CommRecipientStatus:
      type: string
      enum: [pending, queued, skipped_no_consent, skipped_no_email, failed]

    CommRecipient:
      type: object
      required: [customer, status]
      properties:
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        status: { $ref: "#/components/schemas/CommRecipientStatus" }
        delivery_status: { type: string, enum: [queued, sending, sent, failed, cancelled] }
        sent_at: { type: string, format: date-time }

    CommRecipientPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommRecipient" }
        next_cursor: { type: [string, "null"] }

    CustomerMessage:
      type: object
      required: [id, category, template, status, created_at]
      properties:
        id: { type: string }
        category: { type: string, enum: [service, promotional, transactional] }
        template: { type: string }
        source_type: { type: string }
        source_id: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, cancelled] }
        sent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    CustomerMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerMessage" }
        next_cursor: { type: [string, "null"] }

    DeadlineSyncResult:
      type: object
      required: [created, updated, closed]
      properties:
        created: { type: integer }
        updated: { type: integer }
        closed: { type: integer }

    DeadlineChannel:
      type: string
      enum: [panel, customer_email, office_email]

    # ---- imports ----

    ImportEntity:
      type: string
      enum: [customers_vessels, contracts, rights, deadlines]

    ImportStatus:
      type: string
      enum: [dry_run, applied, undone, failed]

    ImportInput:
      type: object
      required: [entity, csv, has_header, mapping, dry_run]
      properties:
        entity: { $ref: "#/components/schemas/ImportEntity" }
        csv: { $ref: "#/components/schemas/CsvText" }
        delimiter: { type: string, enum: [semicolon, comma, tab] }
        has_header: { type: boolean }
        mapping:
          description: Target field → column index (0-based)
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 200 }
        dry_run: { type: boolean }

    ImportRowIssue:
      type: object
      required: [row, code]
      properties:
        row: { type: integer }
        code: { type: string }
        field: { type: string }
        ref: { type: string, description: A code (berth, customer code), never personal data }

    ImportReport:
      type: object
      required: [entity, dry_run, rows, valid, rejected, duplicates]
      properties:
        run_id: { type: string }
        entity: { $ref: "#/components/schemas/ImportEntity" }
        dry_run: { type: boolean }
        rows: { type: integer }
        valid: { type: integer }
        created:
          type: object
          additionalProperties: { type: integer }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/ImportRowIssue" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/ImportRowIssue" }

    ImportRun:
      type: object
      required: [id, entity, status, row_count, report, created_at, version]
      properties:
        id: { type: string }
        entity: { $ref: "#/components/schemas/ImportEntity" }
        status: { $ref: "#/components/schemas/ImportStatus" }
        row_count: { type: integer }
        mapping:
          type: object
          additionalProperties: { type: integer }
        report: { $ref: "#/components/schemas/ImportReport" }
        undoable: { type: boolean }
        applied_at: { type: string, format: date-time }
        undone_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ImportRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportRun" }
        next_cursor: { type: [string, "null"] }

    # ---- public magic-link pages (§7.3.6); only the link's own customer data ----

    LinkPurpose:
      type: string
      enum: [quote, renewal, signature, unsubscribe]

    PublicQuoteOption:
      type: object
      required: [id, seq, label, total_cents, deposit_cents, starts_on, ends_on]
      properties:
        id: { type: string }
        seq: { type: integer }
        label: { type: string }
        resource_codes:
          type: array
          items: { type: string }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        total_cents: { $ref: "#/components/schemas/Cents" }
        deposit_cents: { $ref: "#/components/schemas/Cents" }
        early_payment_total_cents: { $ref: "#/components/schemas/Cents" }

    PublicQuote:
      type: object
      required: [code, status, valid_until, vessel_name, options, required_fields, missing_fields]
      properties:
        code: { type: string }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        valid_until: { $ref: "#/components/schemas/IsoDate" }
        customer_name: { type: string }
        vessel_name: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/PublicQuoteOption" }
        required_fields:
          type: array
          items: { $ref: "#/components/schemas/RequiredField" }
        missing_fields:
          type: array
          items: { $ref: "#/components/schemas/RequiredField" }

    PublicRenewal:
      type: object
      required: [status, deadline_on, old_total_cents, new_total_cents, new_starts_on, new_ends_on, vessel_name]
      properties:
        status: { $ref: "#/components/schemas/RenewalProposalStatus" }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        customer_name: { type: string }
        vessel_name: { type: string }
        resource_codes:
          type: array
          items: { type: string }
        old_total_cents: { $ref: "#/components/schemas/Cents" }
        new_total_cents: { $ref: "#/components/schemas/Cents" }
        early_payment_total_cents: { $ref: "#/components/schemas/Cents" }
        new_starts_on: { $ref: "#/components/schemas/IsoDate" }
        new_ends_on: { $ref: "#/components/schemas/IsoDate" }
        signature_link: { type: string, description: "Reserved: not set in M4 (m4-plan §15 D33). The signer link is emailed when the contract document is rendered and the request is dispatched." }

    PublicSignature:
      type: object
      required: [request_status, signer_status, role, document_title, identity, otp_channel, attempts_left]
      properties:
        request_status: { $ref: "#/components/schemas/SignatureRequestStatus" }
        signer_status: { $ref: "#/components/schemas/SignerStatus" }
        role: { $ref: "#/components/schemas/SignerRole" }
        document_title: { type: string }
        identity:
          description: The stored identity data the signer confirms (name and, for persons, fiscal code)
          type: object
          properties:
            name: { type: string }
            fiscal_code: { type: string }
        otp_channel: { type: string, enum: [email] }
        attempts_left: { type: integer }
        signature_kind: { type: string, enum: [firma_elettronica_semplice] }
        deposit: { $ref: "#/components/schemas/PublicDeposit" }

    PublicUnsubscribe:
      type: object
      required: [subscribed]
      properties:
        subscribed: { type: boolean }

    PublicLink:
      type: object
      required: [purpose, marina, expires_at]
      properties:
        purpose: { $ref: "#/components/schemas/LinkPurpose" }
        marina:
          type: object
          required: [name, default_locale, locales]
          properties:
            name: { type: string }
            default_locale: { $ref: "#/components/schemas/Locale" }
            locales:
              type: array
              items: { $ref: "#/components/schemas/Locale" }
        expires_at: { type: string, format: date-time }
        quote: { $ref: "#/components/schemas/PublicQuote" }
        renewal: { $ref: "#/components/schemas/PublicRenewal" }
        signature: { $ref: "#/components/schemas/PublicSignature" }
        unsubscribe: { $ref: "#/components/schemas/PublicUnsubscribe" }

    PublicDeposit:
      type: object
      required: [amount_cents, due_on]
      properties:
        amount_cents: { $ref: "#/components/schemas/Cents" }
        due_on: { $ref: "#/components/schemas/IsoDate" }
        bank_details: { $ref: "#/components/schemas/BankDetails" }
        reference: { type: string, description: Payment reference to quote in the transfer (contract code) }

    PublicQuoteAccept:
      type: object
      required: [option_id]
      properties:
        option_id: { type: string, maxLength: 36 }
        customer:
          type: object
          additionalProperties: false
          properties:
            address: { $ref: "#/components/schemas/Address" }
            fiscal_code: { type: string, maxLength: 32 }
            birth_date: { $ref: "#/components/schemas/IsoDate" }
        vessel:
          type: object
          additionalProperties: false
          properties:
            registration: { type: string, maxLength: 64 }
            insurance_expires_on: { $ref: "#/components/schemas/IsoDate" }
        plan: { $ref: "#/components/schemas/PlanChoice" }

    PublicAcceptResult:
      type: object
      required: [contract_code]
      properties:
        contract_code: { type: string }
        signature_link: { type: string, description: "Reserved: not set in M4 (m4-plan §15 D33). The signer link is emailed when the contract document is rendered and the request is dispatched." }
        deposit: { $ref: "#/components/schemas/PublicDeposit" }

    PublicRenewalResult:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/RenewalProposalStatus" }
        signature_link: { type: string, description: "Reserved: not set in M4 (m4-plan §15 D33). The signer link is emailed when the contract document is rendered and the request is dispatched." }
        deposit: { $ref: "#/components/schemas/PublicDeposit" }

    PublicDocumentUploaded:
      type: object
      required: [document_id]
      properties:
        document_id: { type: string }

    PublicOtpRequest:
      type: object
      required: [identity_confirmed]
      properties:
        identity_confirmed: { type: boolean, description: Must be true }

    PublicOtpVerify:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }

    PublicSignatureResult:
      type: object
      required: [signer_status, request_status]
      properties:
        signer_status: { $ref: "#/components/schemas/SignerStatus" }
        request_status: { $ref: "#/components/schemas/SignatureRequestStatus" }
        attempts_left: { type: integer }
        deposit: { $ref: "#/components/schemas/PublicDeposit" }

    # ---- M5 charges (m5-plan §3, §7) ----

    ChargeOriginType:
      type: string
      enum: [installment, holder_installment, transit, contract_trueup, counter_sale, termination, deposit_retention,
             manual, adjustment, opening_balance, utility, work_order, rental]

    ChargePaymentStatus:
      type: string
      enum: [open, partially_paid, paid, cancelled]

    ChargeInvoicingStatus:
      type: string
      enum: [to_invoice, exported, invoiced]

    FiscalMode:
      type: string
      enum: [invoice, receipt]

    CorrectionKind:
      type: string
      enum: [delta, replace]

    ChargeLine:
      type: object
      required: [seq, item_code, description, qty_milli, unit_cents, discount_cents, net_cents, vat_cents, gross_cents, vat_rate_bp, price_includes_vat]
      properties:
        seq: { type: integer }
        item_id: { type: string }
        item_code: { type: string }
        description: { type: string }
        qty_milli: { $ref: "#/components/schemas/QtyMilli" }
        unit_cents: { $ref: "#/components/schemas/Cents" }
        discount_cents: { $ref: "#/components/schemas/Cents" }
        net_cents: { $ref: "#/components/schemas/Cents" }
        vat_cents: { $ref: "#/components/schemas/Cents" }
        gross_cents: { $ref: "#/components/schemas/Cents" }
        vat_rate_bp: { $ref: "#/components/schemas/BasisPoints" }
        vat_nature: { $ref: "#/components/schemas/VatNature" }
        price_includes_vat: { type: boolean }
        revenue_class: { type: string }
        external_code: { type: string }
        service_from: { $ref: "#/components/schemas/IsoDate" }
        service_to: { $ref: "#/components/schemas/IsoDate" }

    ChargeLineInput:
      type: object
      required: [item_id, qty_milli]
      properties:
        item_id: { type: string, maxLength: 36 }
        qty_milli: { $ref: "#/components/schemas/QtyMilli" }
        unit_cents: { description: Staff unit price (charges.manage); default from the active price list, $ref: "#/components/schemas/Cents" }
        discount_cents: { $ref: "#/components/schemas/Cents" }
        description: { type: string, maxLength: 300 }
        service_from: { $ref: "#/components/schemas/IsoDate" }
        service_to: { $ref: "#/components/schemas/IsoDate" }

    ChargeMatchRef:
      type: object
      required: [id, payment_id, payment_number, amount_cents, created_at]
      properties:
        id: { type: string }
        payment_id: { type: string }
        payment_number: { type: string }
        amount_cents: { $ref: "#/components/schemas/Cents" }
        reverses_match_id: { type: string }
        created_at: { type: string, format: date-time }

    ChargeOffsetRef:
      type: object
      required: [negative_charge_id, target_charge_id, amount_cents]
      properties:
        negative_charge_id: { type: string }
        target_charge_id: { type: string }
        amount_cents: { $ref: "#/components/schemas/Cents" }

    ChargeRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string }
        number: { type: string }
        total_cents: { $ref: "#/components/schemas/Cents" }
        payment_status: { $ref: "#/components/schemas/ChargePaymentStatus" }

    ChargeExportRef:
      type: object
      required: [export_id, number, first]
      properties:
        export_id: { type: string }
        number: { type: string }
        first: { type: boolean }
        created_at: { type: string, format: date-time }

    ChargeReminderRef:
      type: object
      required: [level, status, created_at]
      properties:
        level: { $ref: "#/components/schemas/ReminderLevel" }
        status: { $ref: "#/components/schemas/ReminderItemStatus" }
        created_at: { type: string, format: date-time }

    Charge:
      type: object
      required: [id, number, origin_type, origin_id, issued_on, due_on, total_cents, net_cents, vat_cents, paid_amount_cents,
                 credited_cents, residual_cents, payment_status, invoicing_status, fiscal_mode, description, version]
      properties:
        id: { type: string }
        number: { type: string, description: "A{yyyy}-{n:06}, an internal reference (not a fiscal number)" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        origin_type: { $ref: "#/components/schemas/ChargeOriginType" }
        origin_id: { type: string }
        contract_id: { type: string }
        contract_code: { type: string }
        vessel_id: { type: string }
        right_id: { type: string }
        issued_on: { $ref: "#/components/schemas/IsoDate" }
        due_on: { $ref: "#/components/schemas/IsoDate" }
        service_from: { $ref: "#/components/schemas/IsoDate" }
        service_to: { $ref: "#/components/schemas/IsoDate" }
        total_cents: { $ref: "#/components/schemas/Cents" }
        net_cents: { $ref: "#/components/schemas/Cents" }
        vat_cents: { $ref: "#/components/schemas/Cents" }
        paid_amount_cents: { $ref: "#/components/schemas/Cents" }
        credited_cents: { $ref: "#/components/schemas/Cents" }
