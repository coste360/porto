        - { name: arrival_to, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: on, in: query, required: false, description: Transits whose stay covers this night, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: q, in: query, required: false, description: Code or vessel name, schema: { type: string, maxLength: 64 } }
