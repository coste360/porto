        term: { $ref: "#/components/schemas/ContractTerm" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
