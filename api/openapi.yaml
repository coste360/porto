      operationId: getPriceCoverage
      summary: >-
        Combinations without a price and elements without a valid category (pricing.read)
      security: *readSecurity
      parameters:
        - { name: quoted_on, in: query, required: false, description: Default today in the marina timezone, schema: { type: string, format: date, x-go-type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceCoverage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/pricing/simulate:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [pricing]
      operationId: simulatePrice
