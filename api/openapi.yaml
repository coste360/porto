      tags: [vessels]
      operationId: recordVesselMeasurement
      summary: Record measured dimensions (customers.write or presence.write)
      security: *writeSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VesselMeasurementInput" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/vessels/{vesselId}/archive:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/VesselId"
    post:
      tags: [vessels]
      operationId: archiveVessel
      summary: Archive a vessel (customers.write)
      security: *writeSecurity
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/vessels/{vesselId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/VesselId"
    post:
      tags: [vessels]
      operationId: unarchiveVessel
      summary: Restore an archived vessel (customers.write)
      security: *writeSecurity
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/documents:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents of customers and vessels (customers.read)
      security: *readSecurity
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: customer_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: vessel_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/DocumentType" } }
        - { name: expires_before, in: query, required: false, schema: { type: string, format: date, x-go-type: string } }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [documents]
      operationId: createDocument
      summary: Create a document (metadata); an expiry creates its deadline in the same transaction (customers.write)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [documents]
      operationId: getDocument
      summary: A document (customers.read)
      security: *readSecurity
      responses:
        "200":
          description: Document
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Update a document; its deadline follows the expiry (customers.write)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentPatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document with its file and deadline (customers.write)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [documents]
      operationId: getDocumentFile
      summary: >-
        Download the document file through a signed link from createDocumentFileUrl (exp and sig are checked in
        the service; served inline, no-store, sandbox CSP, nosniff) (customers.read)
      security: *readSecurity
      parameters:
        - { name: exp, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: File bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [documents]
      operationId: uploadDocumentFile
      summary: >-
        Upload or replace the document file (PDF, PNG or JPEG, at most 15 MiB, raw body), encrypted at rest
        (customers.write)
      security: *writeSecurity
      x-porto-max-body-bytes: 16777216
      parameters:
        - name: X-File-Name
          in: header
          required: false
          description: Original file name (sanitised, at most 120 characters kept)
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      tags: [documents]
      operationId: deleteDocumentFile
      summary: Remove the document file (customers.write)
      security: *writeSecurity
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/documents/{documentId}/file-url:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [documents]
      operationId: createDocumentFileURL
      summary: A short-lived (5 minutes) signed download link bound to the calling user (customers.read)
      security: *writeSecurity
      responses:
        "200":
          description: Signed link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFileUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/deadlines:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [deadlines]
      operationId: listDeadlines
      summary: Deadlines by due date (customers.read)
      security: *readSecurity
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: status, in: query, required: false, description: Default open, schema: { $ref: "#/components/schemas/DeadlineStatus" } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/DeadlineKind" } }
        - { name: urgency, in: query, required: false, schema: { $ref: "#/components/schemas/DeadlineUrgency" } }
        - { name: due_before, in: query, required: false, schema: { type: string, format: date, x-go-type: string } }
        - { name: due_after, in: query, required: false, schema: { type: string, format: date, x-go-type: string } }
        - { name: customer_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: vessel_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: Deadlines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlinePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/deadlines/{deadlineId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/DeadlineId"
    patch:
      tags: [deadlines]
      operationId: updateDeadline
      summary: Mark a deadline done or dismissed, or change its note (customers.write)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeadlinePatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deadline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/deadline-policies:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [deadlines]
      operationId: listDeadlinePolicies
      summary: Lead days per deadline kind, defaults included (customers.read)
      security: *readSecurity
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlinePolicyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [deadlines]
      operationId: replaceDeadlinePolicies
      summary: Replace the lead days of the given kinds (marina.configure)
      security: *writeSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeadlinePolicyList" }
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlinePolicyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: porto_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with cookieAuth on unsafe methods; equal to the porto_csrf cookie.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: po_live_<prefix>_<secret>
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: po_dev_<prefix>_<secret>

  headers:
    ETag:
      description: Version of the resource, quoted ("3")
      schema: { type: string }

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
    MarinaId:
      name: marinaId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 8 to 128 characters of [A-Za-z0-9_-:.]; the response is replayed for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_\\-:.]+$" }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the version being changed. Missing is 428, stale is 412.
      schema: { type: string }
    MapId:
      name: mapId
      in: path
      required: true
      schema: { type: string }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    VesselId:
      name: vesselId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Value of the porto_csrf cookie; required on cookie-authenticated unsafe requests.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request or validation failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Not authenticated, or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (or not visible to the principal)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: If-Match does not match the current version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (see Retry-After)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Request body above the operation's limit, or file above 15 MiB (file_too_large)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content type not accepted by the operation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MapInvalid:
      description: The map document breaks a blocking validation rule (map_invalid, with issues), or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Not ready
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ProblemType:
      type: string
      enum:
        - bad_request
        - validation_failed
        - weak_password
        - invalid_reset_token
        - invalid_totp
        - pairing_code_invalid
        - invalid_scope
        - invalid_webhook_url
        - unknown_event_type
        - unauthorized
        - invalid_credentials
        - totp_required
        - forbidden
        - csrf_failed
        - totp_enrolment_required
        - totp_required_by_policy
        - not_found
        - method_not_allowed
        - conflict
        - slug_taken
        - already_member
        - last_owner
        - totp_already_enabled
        - totp_not_enrolled
        - endpoint_disabled
        - idempotency_in_progress
        - version_conflict
        - unsupported_media_type
        - idempotency_key_reused
        - precondition_required
        - rate_limited
        - internal_error
        - not_ready
        - map_invalid
        - map_not_empty
        - map_not_georeferenced
        - invalid_file
        - file_too_large
        - csv_invalid
        - customer_anonymized
        - customer_merged
        - download_link_expired

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        retry_after_seconds: { type: integer }
        issues:
          description: Map validation issues (map_invalid)
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, enum: [ok] }
        schema_version: { type: integer, format: int64 }

    Meta:
      type: object
      required: [version, api_version, edition, capabilities, demo_pairing]
      properties:
        version: { type: string }
        api_version: { type: string }
        edition: { type: string, enum: [server] }
        capabilities:
          type: array
          items: { type: string }
        demo_pairing: { type: boolean }

    Role:
      type: string
      enum: [owner, director, office, accounting, dock, yard_mgr, yard, rental, viewer]

    Permission:
      type: string
      enum:
        - organization.manage
        - marina.configure
        - marina.read
        - users.manage
        - devices.manage
        - devices.pair_self
        - audit.read
        - customers.write
        - customers.read
        - contracts.write
        - transits.desk
        - occupancy.move
        - presence.write
        - occupancy.override_fit
        - rights.manage
        - charges.manage
        - charges.export
        - payments.collect
        - payments.collect_cash
        - refunds.issue
        - storage.manage
        - storage.read
        - yard.manage
        - yard.read
        - yard.timesheets
        - rental.manage
        - maintenance.manage
        - maintenance.report
        - reports.all
        - reports.operational
        - reports.yard
        - reports.rental
        - map.view
        - harbor.configure

    Locale:
      type: string
      enum: [it, en]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
        totp_code: { type: string, maxLength: 16 }
        recovery_code: { type: string, maxLength: 32 }

    MeUser:
      type: object
      required: [id, email, name, locale, totp_enabled]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        totp_enabled: { type: boolean }

    MeOrganization:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    MeMarina:
      type: object
      required: [id, organization_id, slug, name, roles, permissions]
      properties:
        id: { type: string }
        organization_id: { type: string }
        slug: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    Me:
      type: object
      required: [user, auth_method, totp_enrolment_required, organizations, marinas]
      properties:
        user: { $ref: "#/components/schemas/MeUser" }
        auth_method: { type: string, enum: [session, api_key, device] }
        totp_enrolment_required: { type: boolean }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/MeOrganization" }
        marinas:
          type: array
          items: { $ref: "#/components/schemas/MeMarina" }

    MePatch:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, maxLength: 1024 }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
