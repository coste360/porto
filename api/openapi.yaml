        amount_cents: { $ref: "#/components/schemas/Cents" }
        lines: { type: array, items: { $ref: "#/components/schemas/ReceiptDataLine" } }
        vat: { type: array, items: { $ref: "#/components/schemas/ReceiptDataVat" } }
        fiscal_number: { type: string, description: Number of the fiscal document, empty when none }
        footer: { type: string }
        not_fiscal: { type: boolean, description: Always true (courtesy receipt) }

