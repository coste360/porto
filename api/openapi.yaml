          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/price-lists/{priceListId}/renewal:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PriceListId"
    post:
      tags: [price-lists]
      operationId: renewPriceList
      summary: >-
        New draft list from this one (spec 12.6): date shift, ISTAT, adjustments, rounding. dry_run returns the preview with the matrix diff; otherwise the draft is created (pricing.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewalRequest" }
      responses:
        "200":
          description: Dry run preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewalPreview" }
        "201":
          description: Draft created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PricingUnprocessable" }

  /api/admin/v1/marinas/{marinaId}/price-lists/{priceListId}/matrix:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PriceListId"
    get:
      tags: [price-lists]
      operationId: getPriceMatrix
      summary: >-
        Price matrix computed by the engine through probes; every cell equals a simulation of its probe (INV-23) (pricing.read)
      security: *readSecurity
      parameters:
        - { name: contract_type, in: query, required: false, description: Default the first contract type served, schema: { $ref: "#/components/schemas/ContractType" } }
        - { name: item_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: rows, in: query, required: false, schema: { type: string, enum: [bands, categories] } }
        - { name: channel, in: query, required: false, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: customer_category, in: query, required: false, schema: { $ref: "#/components/schemas/CustomerCategory" } }
        - { name: quoted_on, in: query, required: false, description: Default today in the marina timezone, schema: { type: string, format: date, x-go-type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceMatrix" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

