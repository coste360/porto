openapi: 3.1.0
info:
  title: Porto API
  version: 0.1.0
  summary: Marina and boatyard management system (Coste360 SRL).
  description: |
    Single spec-first contract of Porto's REST API (spec 27). M0 covers the platform foundations; M1 adds the
    harbour map (maps, elements, generators, berth groups, harbour settings) and the registry (customers,
    vessels, documents, deadlines). M2 adds items, classifications, price lists and the pricing tools
    (simulator, matrix, coverage, renewal).

    - `/api/admin/v1` — admin panel API (session cookie, API key or device token).
    - `/api/device/v1` — paired devices (device token, spec 29).
    - `/api/public/v1` — public marina pages (no authentication).

    Conventions:
    - errors are `application/problem+json` (RFC 9457) with a stable `type` slug;
    - collections use cursor pagination (`?cursor=&limit=`, default 50, max 200);
    - `Idempotency-Key` is accepted on creating `POST`s (24 h, per principal);
    - cookie-authenticated unsafe requests send `X-CSRF-Token`, equal to the `porto_csrf` cookie;
    - versioned resources return `ETag: "<version>"` and `PATCH` requires `If-Match`;
    - calendar dates are `YYYY-MM-DD`, instants RFC 3339 UTC, ids UUID strings; JSON names are snake_case;
    - lengths are integer centimetres (`*_cm`), angles `rotation_dd` in tenths of a degree, masses kg;
    - money is integer cents (`*_cents`), percentages integer basis points (`*_bp`, 1 % = 100), fractional
      quantities integer thousandths (`*_milli`); no `number` type is used anywhere;
    - `x-porto-max-body-bytes` on an operation sets its request body limit (default 1 MiB, hard cap 16 MiB);
      upload operations take a raw binary body with the declared content types.
  contact:
    name: Coste360 SRL
servers:
  - url: /
    description: Same origin as the Porto instance
tags:
  - name: ops
    description: Process health
  - name: meta
    description: Version and capabilities
  - name: auth
    description: Login, session and account security
  - name: organizations
    description: Organizations and their owners
  - name: marinas
    description: Marinas
  - name: team
    description: Members and roles
  - name: api-keys
    description: API keys
  - name: devices
    description: Device pairing and management
  - name: webhooks
    description: Outgoing webhooks
  - name: audit
    description: Audit log
  - name: realtime
    description: Server-sent events
  - name: device
    description: API of paired devices
  - name: public
    description: Public marina pages
  - name: maps
    description: Harbour maps, map documents, generators, import and export
  - name: harbor
    description: Berths, berth groups and harbour settings
  - name: customers
    description: Customers, consents, merge, GDPR export and anonymisation
  - name: vessels
    description: Vessels, parties and measurements
  - name: documents
    description: Customer and vessel documents with encrypted files
  - name: deadlines
    description: Deadlines from document expiries and their policies
  - name: pricing
    description: Pricing settings, revenue classes, items, berth categories and the price simulator
  - name: price-lists
    description: Price lists (periods, bands, rules), activation, renewal, matrix and coverage
  - name: occupancy
    description: Occupancy engine, day view, search, moves, layout sessions, blocks, releases and closures
  - name: contracts
    description: Quotes with options, mooring contracts, transits and inquiries
  - name: presences
    description: Arrivals, departures, unexpected arrivals and movements of the day

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness probe (database reachable, migrations applied)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/admin/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Version, edition and capabilities of this instance
      security: []
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /api/admin/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password (plus the second factor when enrolled)
      description: Sets the `porto_session` (HttpOnly) and `porto_csrf` cookies. A new session is always created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204": { description: Logged out, cookies cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The current user, organizations and marinas with roles and permissions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change the name or locale of the current user
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password (other sessions are revoked)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Send a password reset email (always 204, no account enumeration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset or invitation token (single use; every session is revoked)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: Start TOTP enrolment (new secret, QR code)
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Pending enrolment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: Confirm TOTP enrolment with a code; returns the recovery codes and rotates the session
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: TOTP enabled
          headers:
            Set-Cookie:
              description: rotated porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/auth/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: Disable TOTP (password and current code required)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableRequest" }
      responses:
        "204": { description: TOTP disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes (current TOTP code required)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: Organizations of the principal
      security: &readSecurity
        - cookieAuth: []
        - apiKeyAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [organizations]
      operationId: updateOrganization
      summary: Update the organization (organization.manage)
      security: &writeSecurity
        - cookieAuth: []
          csrfToken: []
        - apiKeyAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/organizations/{organizationId}/marinas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [marinas]
      operationId: listMarinas
      summary: Marinas of the organization visible to the principal
      security: *readSecurity
      responses:
        "200":
          description: Marinas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarinaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [marinas]
      operationId: createMarina
      summary: Create a marina (organization.manage)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarinaCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/organizations/{organizationId}/owners:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [organizations]
      operationId: listOrgOwners
      summary: Organization-wide owners (organization.manage)
      security: *readSecurity
      responses:
        "200":
          description: Owners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [organizations]
      operationId: addOrgOwner
      summary: Add an organization-wide owner (the role in the body is ignored)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/organizations/{organizationId}/owners/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [organizations]
      operationId: removeOrgOwner
      summary: Remove an organization-wide owner (the last one cannot be removed)
      security: *writeSecurity
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [marinas]
      operationId: getMarina
      summary: A marina (marina.read)
      security: *readSecurity
      responses:
        "200":
          description: Marina
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [marinas]
      operationId: updateMarina
      summary: Update marina settings (marina.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarinaPatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/archive:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [marinas]
      operationId: archiveMarina
      summary: Archive a marina (organization.manage)
      security: *writeSecurity
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/members:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [team]
      operationId: listMembers
      summary: Members of the marina, organization-wide and marina-level (users.manage)
      security: *readSecurity
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [team]
      operationId: addMember
      summary: Add a member to the marina (users.manage); a new user receives an invitation email
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [team]
      operationId: updateMember
      summary: Change the marina-level role of a member (users.manage)
      security: *writeSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [team]
      operationId: removeMember
      summary: Remove the marina-level membership of a user (users.manage)
      security: *writeSecurity
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/members/{userId}/password-reset:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [team]
      operationId: sendMemberPasswordReset
      summary: Email a password reset link to a member (users.manage)
      security: *writeSecurity
      responses:
        "202": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: API keys of the marina (users.manage)
      security: *readSecurity
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key; the secret is returned once (users.manage)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/api-keys/{apiKeyId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - name: apiKeyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key (users.manage)
      security: *writeSecurity
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/devices/pairing-codes:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [devices]
      operationId: createPairingCode
      summary: Create a pairing code (devices.pair_self for oneself, devices.manage for another user)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingCodeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
