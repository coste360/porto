components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: porto_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with cookieAuth on unsafe methods; equal to the porto_csrf cookie.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: po_live_<prefix>_<secret>
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: po_dev_<prefix>_<secret>
    instanceToken:
      type: apiKey
      in: header
      name: Porto-Instance-Token
      description: >-
        Token of the running desktop process (M6a), read by a second launch from the data folder; checked by the
        handler, not by the session middleware.
    appPin:
      type: apiKey
      in: header
      name: Porto-App-Pin
      description: >-
        App PIN of a desktop in remote mode (M6b, 6 to 12 digits, Argon2id in desktop.json, 5 failures per 15
        minutes): checked by the app's remote proxy together with the porto_remote cookie, never sent upstream.
    remoteCookie:
      type: apiKey
      in: cookie
      name: porto_remote
      description: >-
        Per-launch cookie of the desktop remote proxy (M6b, HttpOnly, SameSite=Strict), obtained by the app window
        from a secret in the URL fragment; checked by the proxy only.

  headers:
    ETag:
      description: Version of the resource, quoted ("3")
      schema: { type: string }

  parameters:
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string }
    ChargeExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    PaymentMatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string }
    CashRegisterId:
      name: registerId
      in: path
      required: true
      schema: { type: string }
    CashSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    FiscalDocumentId:
      name: fiscalDocumentId
      in: path
      required: true
      schema: { type: string }
    PaymentRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    ReminderRunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    ReminderItemId:
      name: reminderItemId
      in: path
      required: true
      schema: { type: string }
    DunningExclusionId:
      name: exclusionId
      in: path
      required: true
      schema: { type: string }
    SepaMandateId:
      name: sepaMandateId
      in: path
      required: true
      schema: { type: string }
    ChargeImportId:
      name: importId
      in: path
      required: true
      schema: { type: string }
    PayToken:
      name: payToken
      in: path
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    PaymentProviderCode:
      name: providerCode
      in: path
      required: true
      schema: { type: string, maxLength: 64, pattern: "^[a-z0-9_-]+$" }
    WorkSourceType:
      name: sourceType
      in: path
      required: true
      schema: { type: string, maxLength: 40, pattern: "^[a-z0-9_]+$" }
    WorkSourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    BerthId:
      name: berthId
      in: path
      required: true
      schema: { type: string }
    InstallmentId:
      name: installmentId
      in: path
      required: true
      schema: { type: string }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
    AddendumId:
      name: addendumId
      in: path
      required: true
