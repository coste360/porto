      enum: [per_berth, length_band, per_meter, per_m2, per_m2_berth, flat, metered]

    TimeUnit:
      type: string
      enum: [night, week, month, season, year, stay]

    SplitRule:
      type: string
      enum: [pro_rata_daily, whole_months, best_combination]

    DimensionSource:
      type: string
      enum: [vessel, berth, max]

    TotalRounding:
      type: string
      enum: [none, euro, five_euro]

    AmountRounding:
      type: string
      enum: [none, ten_cents, euro]

    DiscountKind:
      type: string
      enum: [customer, promo, automatic]

    PeriodKind:
      type: string
      enum: [season, event]

    PeriodColor:
      type: string
      enum: [chart-1, chart-2, chart-3, chart-4, chart-5]

