openapi: 3.1.0
info:
  title: Porto API
  version: 0.1.0
  summary: Marina and boatyard management system (Coste360 SRL).
  description: |
    Single spec-first contract of Porto's REST API (spec 27). M0 covers the platform foundations; M1 adds the
    harbour map (maps, elements, generators, berth groups, harbour settings) and the registry (customers,
    vessels, documents, deadlines). M2 adds items, classifications, price lists and the pricing tools
    (simulator, matrix, coverage, renewal). M3 adds occupancy, quotes, contracts and transits; M4 adds instalments,
    renewals, charter, rights and common charges, print templates and PDF, signatures, communications, the deadline
    engine, CSV imports and the customer magic-link pages. M5 adds charges from every origin, payments, refunds and
    credits, cash and corrispettivi, payment requests and reminders, optional online payments (Stripe with SEPA),
    the "da fatturare" export with invoice reconciliation, statements and the customer dashboard. M6a adds the
    desktop edition API (`/api/desktop/v1`, loopback only), browser pairing by QR with device sessions and the
    local-mode metadata. M6b adds the offline queue guarantees (`x-porto-offline`, `Porto-Offline-Queued-At`),
    the dock collectibles and the transit QR, the fiscal bridge claims of paired desktops, the desktop remote mode
    (pairing to an online instance, peripherals, kiosk) and the loopback bridge to local peripherals
    (`/api/bridge/v1`).

    - `/api/admin/v1` — admin panel API (session cookie, API key or device token).
    - `/api/device/v1` — paired devices (device token, spec 29).
    - `/api/public/v1` — public marina pages (no authentication).
    - `/api/desktop/v1` — desktop edition launcher (M6a): answers only on the loopback listener of
      `porto-desktop`, 404 everywhere else.
    - `/api/bridge/v1` — local peripherals of the desktop app (M6b): loopback only like `/api/desktop/v1`; in
      remote mode it is served by the app's local proxy, never by the online instance.

    Conventions:
    - errors are `application/problem+json` (RFC 9457) with a stable `type` slug;
    - collections use cursor pagination (`?cursor=&limit=`, default 50, max 200);
    - `Idempotency-Key` is accepted on creating `POST`s (24 h, per principal; 7 days on `x-porto-offline`
      operations);
    - `x-porto-offline: true` marks the only operations the offline queue may replay (M6b, spec 29.2); a replay
      carries `Porto-Offline-Queued-At` (the enqueue instant) and an `Idempotency-Key`; the header on any other
      operation is refused with 422 `offline_not_allowed`;
    - security schemes `appPin` and `remoteCookie` are checked by the desktop app's remote proxy only (M6b): an
      operation whose alternatives are all of them answers 404 on a Porto server;
    - cookie-authenticated unsafe requests send `X-CSRF-Token`, equal to the `porto_csrf` cookie;
    - versioned resources return `ETag: "<version>"` and `PATCH` requires `If-Match`;
    - calendar dates are `YYYY-MM-DD`, instants RFC 3339 UTC, ids UUID strings; JSON names are snake_case;
    - lengths are integer centimetres (`*_cm`), angles `rotation_dd` in tenths of a degree, masses kg;
    - money is integer cents (`*_cents`), percentages integer basis points (`*_bp`, 1 % = 100), fractional
      quantities integer thousandths (`*_milli`); no `number` type is used anywhere;
    - `x-porto-max-body-bytes` on an operation sets its request body limit (default 1 MiB, hard cap 16 MiB);
      upload operations take a raw binary body with the declared content types;
    - `x-porto-max-stream-bytes` replaces it on the few operations that stream a large raw body to disk (desktop
      restore, at most 4 GiB): the 16 MiB hard cap does not apply to them.
  contact:
    name: Coste360 SRL
servers:
  - url: /
    description: Same origin as the Porto instance
tags:
  - name: ops
    description: Process health
  - name: meta
    description: Version and capabilities
  - name: auth
    description: Login, session and account security
  - name: organizations
    description: Organizations and their owners
  - name: marinas
    description: Marinas
  - name: team
    description: Members and roles
  - name: api-keys
    description: API keys
  - name: devices
    description: Device pairing and management
  - name: webhooks
    description: Outgoing webhooks
  - name: audit
    description: Audit log
  - name: realtime
    description: Server-sent events
  - name: device
    description: API of paired devices
  - name: public
    description: Public marina pages
  - name: maps
    description: Harbour maps, map documents, generators, import and export
  - name: harbor
    description: Berths, berth groups and harbour settings
  - name: customers
    description: Customers, consents, merge, GDPR export and anonymisation
  - name: vessels
    description: Vessels, parties and measurements
  - name: documents
    description: Customer and vessel documents with encrypted files
  - name: deadlines
    description: Deadlines from document expiries and their policies
  - name: pricing
    description: Pricing settings, revenue classes, items, berth categories and the price simulator
  - name: price-lists
    description: Price lists (periods, bands, rules), activation, renewal, matrix and coverage
  - name: occupancy
    description: Occupancy engine, day view, search, moves, layout sessions, blocks, releases and closures
  - name: contracts
    description: Quotes with options, mooring contracts, transits and inquiries
  - name: presences
    description: Arrivals, departures, unexpected arrivals and movements of the day
  - name: installments
    description: Instalment plans, scadenzario and manual settlement (M4)
  - name: renewals
    description: Simple renewals, renewal campaigns and proposals (M4)
  - name: charter
    description: Charter fleets, charter contracts and rotation (M4)
  - name: rights
    description: Berth rights, holders, transfers, mandates and management fees (M4)
  - name: common-charges
    description: Millesimal tables, budgets, common charge runs and holder instalments (M4)
  - name: concession
    description: Concession card and obligations (M4)
  - name: templates
    description: Print templates, versions and preview (M4)
  - name: documents-generated
    description: Generated documents and map print (M4)
  - name: signatures
    description: Signature requests (paper, OTP, provider) and provider settings (M4)
  - name: communications
    description: Customer communications and the per-customer message registry (M4)
  - name: imports
    description: CSV imports with dry run and undo (M4)
  - name: customer-links
    description: Public pages of customer magic links (quote, renewal, signature, unsubscribe) (M4)
  - name: charges
    description: Charges from every origin, adjustments, opening balances (M5)
  - name: charge-exports
    description: The "da fatturare" export, re-export and invoice reconciliation (M5)
  - name: payments
    description: Payments, matches and refunds (M5)
  - name: credits
    description: Customer credits and mandate compensation (M5)
  - name: receivables
    description: Scadenzario, ageing, statement, customer dashboard, payment lens (M5)
  - name: cash
    description: Cash registers, sessions, counter sales and receipts (M5)
  - name: fiscal
    description: Fiscal documents and corrispettivi (M5)
  - name: payment-requests
    description: Payment requests and payment links (M5)
  - name: reminders
    description: Reminders and dunning exclusions (M5)
  - name: payment-providers
    description: Payment drivers, provider settings and SEPA mandates (M5)
  - name: billing-settings
    description: Billing settings (M5)
  - name: worklist
    description: Office worklist (M5)
  - name: payments-public
    description: Public payment page of a payment request (M5)
  - name: webhooks-payments
    description: Payment provider callbacks (M5)
  - name: desktop
    description: Desktop edition launcher, loopback only (first run, local network, backups, secret key) (M6a)
  - name: bridge
    description: Local peripherals of the desktop app (receipt and label printers, QR reader, fiscal), loopback only (M6b)
  - name: collectibles
    description: Open charges to collect at the dock (M6b)
  - name: reports
    description: >-
      Read-only reports, manager dashboard and period comparison (M7, spec 21); CSV and Excel exports

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness probe (database reachable, migrations applied)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/admin/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Version, edition and capabilities of this instance
      security: []
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  /api/admin/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password (plus the second factor when enrolled)
      description: Sets the `porto_session` (HttpOnly) and `porto_csrf` cookies. A new session is always created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204": { description: Logged out, cookies cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The current user, organizations and marinas with roles and permissions
      description: >-
        Also answers a device token (deviceAuth): a desktop in remote mode (M6b) starts the panel of the online
        instance with it; grants are narrowed to the device's marina and auth_method is device.
      security:
        - cookieAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change the name or locale of the current user
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password (other sessions are revoked)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Send a password reset email (always 204, no account enumeration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset or invitation token (single use; every session is revoked)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/admin/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: Start TOTP enrolment (new secret, QR code)
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Pending enrolment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: Confirm TOTP enrolment with a code; returns the recovery codes and rotates the session
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: TOTP enabled
          headers:
            Set-Cookie:
              description: rotated porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/auth/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: Disable TOTP (password and current code required)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableRequest" }
      responses:
        "204": { description: TOTP disabled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/auth/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes (current TOTP code required)
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: Organizations of the principal
      security: &readSecurity
        - cookieAuth: []
        - apiKeyAuth: []
        - deviceAuth: []
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [organizations]
      operationId: updateOrganization
      summary: Update the organization (organization.manage)
      security: &writeSecurity
        - cookieAuth: []
          csrfToken: []
        - apiKeyAuth: []
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/organizations/{organizationId}/marinas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [marinas]
      operationId: listMarinas
      summary: Marinas of the organization visible to the principal
      security: *readSecurity
      responses:
        "200":
          description: Marinas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarinaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [marinas]
      operationId: createMarina
      summary: Create a marina (organization.manage)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarinaCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/organizations/{organizationId}/owners:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [organizations]
      operationId: listOrgOwners
      summary: Organization-wide owners (organization.manage)
      security: *readSecurity
      responses:
        "200":
          description: Owners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [organizations]
      operationId: addOrgOwner
      summary: Add an organization-wide owner (the role in the body is ignored)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/organizations/{organizationId}/owners/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [organizations]
      operationId: removeOrgOwner
      summary: Remove an organization-wide owner (the last one cannot be removed)
      security: *writeSecurity
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [marinas]
      operationId: getMarina
      summary: A marina (marina.read)
      security: *readSecurity
      responses:
        "200":
          description: Marina
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [marinas]
      operationId: updateMarina
      summary: Update marina settings (marina.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarinaPatch" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marina" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/archive:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [marinas]
      operationId: archiveMarina
      summary: Archive a marina (organization.manage)
      security: *writeSecurity
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/members:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [team]
      operationId: listMembers
      summary: Members of the marina, organization-wide and marina-level (users.manage)
      security: *readSecurity
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [team]
      operationId: addMember
      summary: Add a member to the marina (users.manage); a new user receives an invitation email
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [team]
      operationId: updateMember
      summary: Change the marina-level role of a member (users.manage)
      security: *writeSecurity
      requestBody:
        required: true
        content:
          application/json:
