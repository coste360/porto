  responses:
    M4Unprocessable:
      description: >-
        A domain rule refused the request (m4-plan §7.4: insurance_required, customer_email_missing,
        paper_scan_required, shares_invalid, table_incomplete, transfer_requirements, template_invalid,
        template_limits, otp_invalid, vessel_not_in_fleet, provider_unknown, fit_blocked, no_price, ...),
        a validation failure, or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Malformed request or validation failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Not authenticated, or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (or not visible to the principal)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: If-Match does not match the current version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (see Retry-After)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Request body above the operation's limit, or file above 15 MiB (file_too_large)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content type not accepted by the operation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MapInvalid:
      description: The map document breaks a blocking validation rule (map_invalid, with issues), or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PricingUnprocessable:
      description: >-
        No price for the input (no_price, with details), promo code not applicable (promo_not_applicable), the
        list breaks a blocking validation rule (price_list_invalid, with price_list_issues), or an idempotency key
        was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    OccupancyUnprocessable:
      description: >-
        The vessel does not fit (fit_blocked, with the FitResult in details), the placement is invalid
        (placement_invalid, details {reason, allocation_id?}), a customer is required (customer_required), no price
        (no_price), a validation failure, or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Not ready
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: The payment provider failed (provider_error, details.code)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    M5Unprocessable:
      description: >-
        A domain rule refused the request (m5-plan §7.4: customer_required, no_price, export_empty,
        export_too_large, charges_not_open, release_not_resold, provider_disabled, provider_refund_unsupported,
        provider_unknown, billing_item_missing, customer_email_missing, ...), a validation failure, or an
        idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ReportUnprocessable:
      description: >-
        The report request is invalid (m7-plan §8: invalid_period, invalid_report_filter, report_too_large,
        unknown_indicator)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
