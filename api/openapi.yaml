    # ---- M2 pricing (spec 12; m2-plan §2.2, §4). Money integer cents, percentages basis points, lengths cm,
    # quantities milli. The JSON shapes mirror internal/domain/pricing. ----

    IsoDate:
      description: Calendar date YYYY-MM-DD in the marina timezone
      type: string
      format: date
      x-go-type: string

    Cents:
      description: Amount in integer cents of the marina currency
      type: integer
      format: int64

    BasisPoints:
      description: Percentage in integer basis points (1 % = 100)
      type: integer
      format: int64

    QtyMilli:
      description: Quantity in thousandths (1.5 = 1500)
      type: integer
      format: int64

    ContractType:
      type: string
      enum: [annual, seasonal, monthly, transit, storage, charter]

    Channel:
      type: string
      enum: [desk, online, api, external]

    ItemType:
      type: string
      enum: [berth_fee, service, utility, product, labour, material, fee, deposit]

    ItemUnit:
      type: string
      enum: [night, month, season, year, m, m2, kwh, m3, hour, piece, lump]

    VatNature:
      description: FatturaPA nature of a 0 % VAT line (m2-plan §12 D9)
      type: string
      enum: [N1, N2.1, N2.2, N3.1, N3.2, N3.3, N3.4, N3.5, N3.6, N4, N5, N6.1, N6.2, N6.3, N6.4, N6.5, N6.6, N6.7, N6.8, N6.9, N7]

