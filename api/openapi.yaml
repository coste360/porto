      name: Porto-First-Run-Token
      in: header
      required: true
      description: Single-use first-run token of the desktop window (never in the URL)
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        8 to 128 characters of [A-Za-z0-9_-:.]; the response is replayed for 24 hours, 7 days for offline
        operations (x-porto-offline).
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_\\-:.]+$" }
    OfflineQueuedAt:
      name: Porto-Offline-Queued-At
      in: header
      required: false
      description: >-
        Enqueue instant of a replay from the offline queue (M6b): RFC 3339, not after now + 10 minutes, together
        with Idempotency-Key (else 422 validation_failed); recorded in the audit rows as offline_queued_at. Refused
        with 422 offline_not_allowed on operations without x-porto-offline.
      schema: { type: string, format: date-time }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the version being changed. Missing is 428, stale is 412.
      schema: { type: string }
