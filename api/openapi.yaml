        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/OccupancyUnprocessable" }

  /api/admin/v1/marinas/{marinaId}/presences/{presenceId}/photo:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PresenceId"
    post:
      tags: [presences]
      operationId: uploadPresencePhoto
      summary: >-
        Attach a photo to a presence (JPEG, PNG or WebP, at most 8 MiB, raw body), encrypted at rest (presence.write)
      security: *writeSecurity
      x-porto-max-body-bytes: 8388608
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresencePhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    get:
      tags: [presences]
      operationId: getPresencePhotoLink
      summary: >-
        A short-lived (5 minutes) signed link to the photo (customers.read)
      security: *readSecurity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/presences/{presenceId}/photo/file:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PresenceId"
    get:
      tags: [presences]
      operationId: getPresencePhotoFile
      summary: >-
        Download the photo through a signed link from getPresencePhotoLink (exp and sig checked in the service) (customers.read)
      security: *readSecurity
      parameters:
        - { name: exp, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

