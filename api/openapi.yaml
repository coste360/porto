  /api/admin/v1/marinas/{marinaId}/price-lists:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [price-lists]
      operationId: listPriceLists
      summary: >-
        Price lists, newest validity first (pricing.read)
      security: *readSecurity
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/PriceListStatus" } }
        - { name: contract_type, in: query, required: false, schema: { $ref: "#/components/schemas/ContractType" } }
        - { name: "on", in: query, required: false, description: Lists valid on this date, schema: { type: string, format: date, x-go-type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListSummaryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [price-lists]
      operationId: createPriceList
      summary: >-
        Create an empty draft price list with default settings (pricing.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceListCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/price-lists/{priceListId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PriceListId"
    get:
      tags: [price-lists]
      operationId: getPriceList
      summary: >-
        The full price list document with its validation issues (pricing.read)
      security: *readSecurity
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [price-lists]
      operationId: savePriceList
      summary: >-
        Replace the draft document (settings, periods, bands, rules) in one transaction; new rows carry a key, saved ones their id. Saved even with validation errors (pricing.configure)
      security: *writeSecurity
      x-porto-max-body-bytes: 4194304
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceListSave" }
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

    delete:
      tags: [price-lists]
      operationId: deletePriceList
      summary: >-
        Delete a draft price list; published lists are immutable (pricing.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/price-lists/{priceListId}/validate:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PriceListId"
    post:
      tags: [price-lists]
      operationId: validatePriceList
      summary: >-
        Dry-run validation of a document, or of the saved one when the body is empty; nothing is written (pricing.read)
      security: *writeSecurity
      x-porto-max-body-bytes: 4194304
      requestBody:
        required: false
