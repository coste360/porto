  /api/admin/v1/marinas/{marinaId}/payments:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [payments]
      operationId: listPayments
      summary: >-
        Payments (payments.collect or charges.manage)
      security: *readSecurity
      parameters:
        - { name: method, in: query, required: false, schema: { $ref: "#/components/schemas/PaymentMethod" } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/PaymentKind" } }
        - { name: source, in: query, required: false, schema: { $ref: "#/components/schemas/PaymentSource" } }
        - { name: customer_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - { name: from, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: to, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: unallocated, in: query, required: false, schema: { type: boolean } }
        - { name: session_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [payments]
      operationId: recordPayment
      summary: >-
        Record a payment with matches or automatic matching; the rest stays as customer credit (payments.collect; payments.collect_cash for cash)
      description: |
        Offline replay (M6b, `Porto-Offline-Queued-At`): only `method: cash`, `kind: payment`, at least one match,
        every match positive and their sum equal to `amount_cents` (no unmatched credit), no `auto_match`, and no
        matched charge with `fiscal_mode: receipt` (else 422 `offline_not_allowed`). The
        open cash session is resolved at replay: none or closed is 409 `cash_session_required` /
        `cash_session_closed`, never a silent move to another session.
      security: *writeSecurity
      x-porto-offline: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OfflineQueuedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPayment" }
      responses:
        "201":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/M5Unprocessable" }

