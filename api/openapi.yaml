      tags: [presences]
      operationId: getMovements
      summary: >-
        Movements of a night (default today): expected arrivals and departures, vessels out, arrivals without booking, arrived, departed (map.view)
      security: *readSecurity
      parameters:
        - { name: date, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: map_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movements" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: porto_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with cookieAuth on unsafe methods; equal to the porto_csrf cookie.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: po_live_<prefix>_<secret>
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: po_dev_<prefix>_<secret>

  headers:
    ETag:
      description: Version of the resource, quoted ("3")
      schema: { type: string }

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
    MarinaId:
      name: marinaId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 8 to 128 characters of [A-Za-z0-9_-:.]; the response is replayed for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_\\-:.]+$" }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the version being changed. Missing is 428, stale is 412.
      schema: { type: string }
    MapId:
      name: mapId
      in: path
      required: true
      schema: { type: string }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    VesselId:
      name: vesselId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    RevenueClassId:
      name: revenueClassId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    PriceListId:
      name: priceListId
      in: path
      required: true
      schema: { type: string }
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema: { type: string }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: string }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    ClosureId:
      name: closureId
      in: path
      required: true
      schema: { type: string }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string }
    PresenceId:
      name: presenceId
      in: path
      required: true
      schema: { type: string }
    UndoId:
      name: undoId
      in: path
      required: true
      schema: { type: string }
    AreaId:
      name: areaId
      in: path
      required: true
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Value of the porto_csrf cookie; required on cookie-authenticated unsafe requests.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request or validation failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Not authenticated, or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (or not visible to the principal)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: If-Match does not match the current version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (see Retry-After)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Request body above the operation's limit, or file above 15 MiB (file_too_large)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content type not accepted by the operation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MapInvalid:
      description: The map document breaks a blocking validation rule (map_invalid, with issues), or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PricingUnprocessable:
      description: >-
        No price for the input (no_price, with details), promo code not applicable (promo_not_applicable), the
        list breaks a blocking validation rule (price_list_invalid, with price_list_issues), or an idempotency key
        was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    OccupancyUnprocessable:
      description: >-
        The vessel does not fit (fit_blocked, with the FitResult in details), the placement is invalid
        (placement_invalid, details {reason, allocation_id?}), a customer is required (customer_required), no price
        (no_price), a validation failure, or an idempotency key was reused
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Not ready
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ProblemType:
      type: string
      enum:
        - bad_request
        - validation_failed
        - weak_password
        - invalid_reset_token
        - invalid_totp
        - pairing_code_invalid
        - invalid_scope
        - invalid_webhook_url
        - unknown_event_type
        - unauthorized
        - invalid_credentials
        - totp_required
        - forbidden
        - csrf_failed
        - totp_enrolment_required
        - totp_required_by_policy
        - not_found
        - method_not_allowed
        - conflict
        - slug_taken
        - already_member
        - last_owner
        - totp_already_enabled
        - totp_not_enrolled
        - endpoint_disabled
        - idempotency_in_progress
        - version_conflict
        - unsupported_media_type
        - idempotency_key_reused
        - precondition_required
        - rate_limited
        - internal_error
        - not_ready
        - map_invalid
        - map_not_empty
        - map_not_georeferenced
        - invalid_file
        - file_too_large
        - csv_invalid
        - customer_anonymized
        - customer_merged
        - download_link_expired
        - no_price
        - promo_not_applicable
        - price_list_invalid
        - price_list_immutable
        - price_list_overlap
        - in_use
        - resource_taken
        - fit_blocked
        - placement_invalid
        - invalid_transition
        - quote_expired
        - hold_expired
        - closure_active
        - undo_unavailable
        - release_invalid
        - customer_required

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        retry_after_seconds: { type: integer }
        issues:
          description: Map validation issues (map_invalid)
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }
        price_list_issues:
          description: Price list validation issues (price_list_invalid)
          type: array
          items: { $ref: "#/components/schemas/PriceListIssue" }
        details:
          description: >-
            Machine-readable details: no_price {item_id, contract_type, night, unit, category, band, reason};
            price_list_overlap {conflicts: [{id, code, valid_from, valid_to}]}; in_use {references};
            resource_taken ConflictDetail; fit_blocked FitResult; placement_invalid {reason, allocation_id?};
            invalid_transition {from, action}; closure_active {closure_id, from_date, to_date}; release_invalid
            {reason}. Ids, codes, dates and integers only.
          type: object
          additionalProperties: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, enum: [ok] }
        schema_version: { type: integer, format: int64 }

    Meta:
      type: object
      required: [version, api_version, edition, capabilities, demo_pairing, pricing_engine_version]
      properties:
        version: { type: string }
        api_version: { type: string }
        edition: { type: string, enum: [server] }
        capabilities:
          type: array
          items: { type: string }
        demo_pairing: { type: boolean }
        pricing_engine_version:
          description: Version of the pricing engine (quotes store it with their price snapshot, INV-20)
          type: integer

    Role:
      type: string
      enum: [owner, director, office, accounting, dock, yard_mgr, yard, rental, viewer]

    Permission:
      type: string
      enum:
        - organization.manage
        - marina.configure
        - marina.read
        - users.manage
        - devices.manage
        - devices.pair_self
        - audit.read
        - customers.write
        - customers.read
        - contracts.write
        - transits.desk
        - occupancy.move
        - presence.write
        - occupancy.override_fit
        - rights.manage
        - charges.manage
        - charges.export
        - payments.collect
        - payments.collect_cash
        - refunds.issue
        - storage.manage
        - storage.read
        - yard.manage
        - yard.read
        - yard.timesheets
        - rental.manage
        - maintenance.manage
        - maintenance.report
        - reports.all
        - reports.operational
        - reports.yard
        - reports.rental
        - map.view
        - harbor.configure
        - pricing.configure
        - pricing.read
        - contracts.read

    Locale:
      type: string
      enum: [it, en]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
        totp_code: { type: string, maxLength: 16 }
        recovery_code: { type: string, maxLength: 32 }

    MeUser:
      type: object
      required: [id, email, name, locale, totp_enabled]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        totp_enabled: { type: boolean }

    MeOrganization:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    MeMarina:
      type: object
      required: [id, organization_id, slug, name, roles, permissions]
      properties:
        id: { type: string }
        organization_id: { type: string }
        slug: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    Me:
      type: object
      required: [user, auth_method, totp_enrolment_required, organizations, marinas]
      properties:
        user: { $ref: "#/components/schemas/MeUser" }
        auth_method: { type: string, enum: [session, api_key, device] }
        totp_enrolment_required: { type: boolean }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/MeOrganization" }
        marinas:
          type: array
          items: { $ref: "#/components/schemas/MeMarina" }

    MePatch:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, maxLength: 1024 }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }

    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, maxLength: 256 }
        new_password: { type: string, maxLength: 1024 }

    TotpEnrollment:
      type: object
      required: [secret, otpauth_url, qr_svg]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }
        qr_svg: { type: string }

    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 16 }

    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, maxLength: 1024 }
        code: { type: string, maxLength: 16 }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }

    Address:
      type: object
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        postal_code: { type: string, maxLength: 16 }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 8 }
        country: { type: string, maxLength: 2, description: ISO 3166-1 alpha-2 }

    Organization:
      type: object
      required: [id, name, vat_number, fiscal_code, billing_address, sdi_code, pec, version, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        vat_number: { type: string }
        fiscal_code: { type: string }
        billing_address: { $ref: "#/components/schemas/Address" }
        sdi_code: { type: string }
        pec: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }

    OrganizationPatch:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        vat_number: { type: string, maxLength: 32 }
        fiscal_code: { type: string, maxLength: 32 }
        billing_address: { $ref: "#/components/schemas/Address" }
        sdi_code: { type: string, maxLength: 7 }
        pec: { type: string, maxLength: 254 }

    MarinaKind:
      type: string
      enum: [marina, yard, both]

    MarinaContacts:
      type: object
      properties:
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        website: { type: string, maxLength: 200 }
        vhf_channel: { type: string, maxLength: 8 }

    GeoPoint:
      type: object
      description: WGS84 position in degrees × 10⁷ (integers)
      required: [lat_e7, lon_e7]
      properties:
        lat_e7: { type: integer, format: int64 }
        lon_e7: { type: integer, format: int64 }

    Marina:
      type: object
      required:
        - id
        - organization_id
        - slug
        - name
        - kind
        - timezone
        - currency
        - default_locale
        - locales
        - contacts
        - address
        - geo
        - concession_ref
        - concession_expires_on
        - settings
        - theme
        - booking_enabled
        - allowed_embed_origins
        - version
        - archived_at
        - created_at
        - updated_at
      properties:
        id: { type: string }
        organization_id: { type: string }
        slug: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MarinaKind" }
        timezone: { type: string }
        currency: { type: string }
        default_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        contacts: { $ref: "#/components/schemas/MarinaContacts" }
        address: { $ref: "#/components/schemas/Address" }
        geo:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        concession_ref: { type: string }
        concession_expires_on: { type: [string, "null"], format: date, x-go-type: string }
        settings: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }
        booking_enabled: { type: boolean }
        allowed_embed_origins:
          type: array
          items: { type: string }
        version: { type: integer }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MarinaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Marina" }

    MarinaCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string, minLength: 3, maxLength: 63 }
        kind: { $ref: "#/components/schemas/MarinaKind" }
        timezone: { type: string, maxLength: 64 }
        currency: { type: string, maxLength: 3 }
        default_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }

    MarinaPatch:
      type: object
      description: Absent fields are unchanged; `geo` and `concession_expires_on` set to null are cleared.
      properties:
        name: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/MarinaKind" }
        timezone: { type: string, maxLength: 64 }
        currency: { type: string, maxLength: 3 }
        default_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        contacts: { $ref: "#/components/schemas/MarinaContacts" }
        address: { $ref: "#/components/schemas/Address" }
        geo:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        concession_ref: { type: string, maxLength: 100 }
        concession_expires_on: { type: [string, "null"], format: date, x-go-type: string }
        settings: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }
        booking_enabled: { type: boolean }
        allowed_embed_origins:
          type: array
          items: { type: string }

    MemberScope:
      type: string
      enum: [organization, marina]

    Member:
      type: object
      required: [user_id, email, name, role, scope, active, totp_enabled, invitation_pending, last_login_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scope: { $ref: "#/components/schemas/MemberScope" }
        active: { type: boolean }
        totp_enabled: { type: boolean }
        invitation_pending: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    MemberCreate:
      type: object
      required: [email, name]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        locale: { $ref: "#/components/schemas/Locale" }

    MemberUpdate:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_by, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "po_live_xxxxxxxx" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        created_by: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }

    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 100 }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        expires_at: { type: string, format: date-time }

    ApiKeyCreated:
      type: object
      required: [api_key, secret]
      properties:
        api_key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: Shown once }

    DeviceKind:
      type: string
      enum: [mobile, desktop]

    DevicePlatform:
      type: string
      enum: [ios, android, windows, macos, linux, other]

    PairingCodeCreate:
      type: object
      properties:
        user_id: { type: string }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        ttl_seconds: { type: integer, minimum: 60, maximum: 3600 }

    PairingCode:
      type: object
      required: [code, expires_at, qr_payload, qr_svg]
      properties:
        code: { type: string, description: XXXX-XXXX }
        expires_at: { type: string, format: date-time }
        qr_payload: { type: string }
        qr_svg: { type: string }

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Device:
      type: object
      required: [id, name, platform, kind, app_version, user, token_prefix, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        app_version: { type: string }
        user: { $ref: "#/components/schemas/UserRef" }
        token_prefix: { type: string }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    EventType:
      type: object
      required: [type, topic, public]
      properties:
        type: { type: string }
        topic: { type: string }
        public: { type: boolean, description: Can be subscribed by webhooks }

    EventTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EventType" }

    WebhookEndpoint:
      type: object
      required:
        - id
        - url
        - description
        - events
        - active
        - consecutive_failures
        - disabled_at
        - disabled_reason
        - has_previous_secret
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string }
        url: { type: string }
        description: { type: string }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        consecutive_failures: { type: integer }
        disabled_at: { type: [string, "null"], format: date-time }
        disabled_reason: { type: [string, "null"] }
        has_previous_secret: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }

    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        events:
          type: array
          items: { type: string }

    WebhookEndpointCreated:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        secret: { type: string, description: Shown once }

    WebhookEndpointPatch:
      type: object
      properties:
        url: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }

    WebhookSecretRotated:
      type: object
      required: [secret, previous_valid_until]
      properties:
        secret: { type: string }
        previous_valid_until: { type: string, format: date-time }

    WebhookTestResult:
      type: object
      required: [delivery_id]
      properties:
        delivery_id: { type: string }

    WebhookDeliveryStatus:
      type: string
      enum: [pending, delivered, failed]

    WebhookDelivery:
      type: object
      required:
        - id
        - event_id
        - event_type
        - status
        - attempts
        - last_status_code
        - last_error
        - response_excerpt
        - next_attempt_at
        - delivered_at
        - failed_at
        - created_at
      properties:
        id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        attempts: { type: integer }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        response_excerpt: { type: [string, "null"] }
        next_attempt_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookDeliveryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_cursor: { type: [string, "null"] }

    AuditActor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, api_key, device, system] }
        id: { type: [string, "null"] }

    AuditEntry:
      type: object
      required: [id, actor, action, entity_type, entity_id, diff, request_id, created_at]
      properties:
        id: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"] }
        diff: {}
        request_id: { type: string }
        created_at: { type: string, format: date-time }

    AuditEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: [string, "null"] }

    PairRequest:
      type: object
      required: [code, name, platform, kind]
      properties:
        code: { type: string, maxLength: 16 }
        name: { type: string, maxLength: 100 }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        app_version: { type: string, maxLength: 32 }

    DemoPairRequest:
      type: object
      required: [name, platform, kind]
      properties:
        name: { type: string, maxLength: 100 }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        app_version: { type: string, maxLength: 32 }

    MarinaRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }

    PairResult:
      type: object
      required: [token, device, marina, user, base_url]
      properties:
        token: { type: string, description: Device token, shown once }
        device: { $ref: "#/components/schemas/Device" }
        marina: { $ref: "#/components/schemas/MarinaRef" }
        user: { $ref: "#/components/schemas/UserRef" }
        base_url: { type: string }

    DeviceSelf:
      type: object
      required: [device, user, marina, permissions]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        user: { $ref: "#/components/schemas/UserRef" }
        marina: { $ref: "#/components/schemas/MarinaRef" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    PublicMarina:
      type: object
      required: [slug, name, default_locale, locales, booking_enabled]
      properties:
        slug: { type: string }
        name: { type: string }
        default_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        booking_enabled: { type: boolean }

    # ---- M1 shared geometry (integer cm, angles in tenths of a degree) ----

    Cm:
      description: Length in integer centimetres
      type: integer
      format: int64

    PositiveCm:
      description: Strictly positive length in integer centimetres
      type: integer
      format: int64
      minimum: 1

    RectSideCm:
      description: Side of a berth or land resource rectangle in integer centimetres, at least 2 (layout.MinRectSide)
      type: integer
      format: int64
      minimum: 2

    RotationDd:
      description: Angle in tenths of a degree, 0 = +x, 900 = +y (y down, clockwise on screen)
      type: integer
      format: int64
      minimum: 0
      maximum: 3599

    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, format: int64 }
        y: { type: integer, format: int64 }

    Polygon:
      description: Simple polygon in map cm (3 to 10 000 vertices, not closed explicitly)
      type: array
      minItems: 3
      maxItems: 10000
      items: { $ref: "#/components/schemas/Point" }

    Rect:
      description: Rotated rectangle; anchor = midpoint of the mooring (or access) side
      type: object
      required: [anchor, width_cm, length_cm, rotation_dd]
      properties:
        anchor: { $ref: "#/components/schemas/Point" }
        width_cm: { $ref: "#/components/schemas/PositiveCm" }
        length_cm: { $ref: "#/components/schemas/PositiveCm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }

    I18nText:
      type: object
      required: [it]
      properties:
        it: { type: string, minLength: 1, maxLength: 200 }
        en: { type: string, maxLength: 200 }

    ElementRef:
      description: >-
        Reference to a map element inside one document: the id of a saved element or the key of a new element of
        the same request
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_:-]+$"

    ElementKey:
      description: Client key of a new element, unique in the request
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_:-]+$"

    Code:
      type: string
      minLength: 1
      maxLength: 32

    # ---- M1 harbour ----

    MapKind:
      type: string
      enum: [water, yard, shed, parking, boxes, other]

    MapCounts:
      type: object
      required: [structures, berths, dynamic_areas, land_resources, pedestals, decorations]
      properties:
        structures: { type: integer }
        berths: { type: integer }
        dynamic_areas: { type: integer }
        land_resources: { type: integer }
        pedestals: { type: integer }
        decorations: { type: integer }

    MapSummary:
      type: object
      required: [id, kind, name, icon, width_cm, height_cm, sort_order, version, counts, georeferenced, has_background, updated_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/MapKind" }
        name: { $ref: "#/components/schemas/I18nText" }
        icon: { type: string }
        width_cm: { $ref: "#/components/schemas/Cm" }
        height_cm: { $ref: "#/components/schemas/Cm" }
        sort_order: { type: integer }
        version: { type: integer }
        counts: { $ref: "#/components/schemas/MapCounts" }
        georeferenced: { type: boolean }
        has_background: { type: boolean }
        updated_at: { type: string, format: date-time }

    MapSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapSummary" }

    MapCreate:
      type: object
      required: [kind, name, width_cm, height_cm]
      properties:
        kind: { $ref: "#/components/schemas/MapKind" }
        name: { $ref: "#/components/schemas/I18nText" }
        icon: { type: string, maxLength: 32 }
        width_cm: { type: integer, format: int64, minimum: 100, maximum: 500000 }
        height_cm: { type: integer, format: int64, minimum: 100, maximum: 500000 }
        grid_cm: { type: integer, format: int64, minimum: 1, maximum: 10000 }

    MapReorder:
      type: object
      required: [map_ids]
      properties:
        map_ids:
          type: array
          maxItems: 200
          items: { type: string }

    MapBackground:
      type: object
      required: [file_id, content_type, width_px, height_px, origin, scale_mcm_per_px, rotation_dd, opacity_pct, visible]
      properties:
        file_id: { type: string }
        content_type: { type: string, enum: [image/png, image/jpeg, image/svg+xml] }
        width_px: { type: integer, format: int64, minimum: 1 }
        height_px: { type: integer, format: int64, minimum: 1 }
        origin: { $ref: "#/components/schemas/Point" }
        scale_mcm_per_px:
          description: Milli-centimetres per image pixel (integer, at least 1)
          type: integer
          format: int64
          minimum: 1
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        opacity_pct: { type: integer, minimum: 0, maximum: 100 }
        visible: { type: boolean }

    ControlPoint:
      type: object
      required: [x, y, lat_e7, lon_e7]
      properties:
        x: { type: integer, format: int64 }
        y: { type: integer, format: int64 }
        lat_e7: { type: integer, format: int64, minimum: -900000000, maximum: 900000000 }
        lon_e7: { type: integer, format: int64, minimum: -1800000000, maximum: 1800000000 }

    Georef:
      description: Affine georeference from three non-collinear control points (WGS84 × 1e7)
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ControlPoint" }

    MapMeta:
      type: object
      required: [kind, name, icon, width_cm, height_cm, grid_cm, sort_order, background, georef, concession_outline, water_polygons, land_polygons]
      properties:
        kind: { $ref: "#/components/schemas/MapKind" }
        name: { $ref: "#/components/schemas/I18nText" }
        icon: { type: string, maxLength: 32 }
        width_cm: { type: integer, format: int64, minimum: 100, maximum: 500000 }
        height_cm: { type: integer, format: int64, minimum: 100, maximum: 500000 }
        grid_cm: { type: integer, format: int64, minimum: 1, maximum: 10000 }
        sort_order: { type: integer }
        background:
          oneOf:
            - $ref: "#/components/schemas/MapBackground"
            - type: "null"
        georef:
          oneOf:
            - $ref: "#/components/schemas/Georef"
            - type: "null"
        concession_outline:
          oneOf:
            - $ref: "#/components/schemas/Polygon"
            - type: "null"
        water_polygons:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Polygon" }
        land_polygons:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Polygon" }

    StructureKind:
      type: string
      enum: [quay, pier, finger, breakwater, channel, walkway]

    Side:
      type: string
      enum: [left, right, head, none]

    DepthSpan:
      description: Depth along the structure axis, from from_cm to to_cm
      type: object
      required: [from_cm, to_cm, depth_cm]
      properties:
        from_cm: { $ref: "#/components/schemas/Cm" }
        to_cm: { $ref: "#/components/schemas/Cm" }
        depth_cm: { $ref: "#/components/schemas/PositiveCm" }

    Structure:
      type: object
      required: [kind, code]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        kind: { $ref: "#/components/schemas/StructureKind" }
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string, maxLength: 100 }
        points:
          description: Polyline (quay, pier, walkway, breakwater line) or polygon (closed = true)
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/Point" }
        closed: { type: boolean }
        rect: { $ref: "#/components/schemas/Rect" }
        width_cm: { $ref: "#/components/schemas/PositiveCm" }
        parent_id: { $ref: "#/components/schemas/ElementRef" }
        sides:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Side" }
        floating: { type: boolean }
        depth_profile:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/DepthSpan" }
        elevation_cm: { $ref: "#/components/schemas/Cm" }
        bollard_spacing_cm: { $ref: "#/components/schemas/PositiveCm" }

    MooringType:
      type: string
      enum: [mooring_line, finger, alongside, piles, buoy]

    PowerPhase:
      type: string
      enum: [single, three]

    Berth:
      type: object
      required: [code, side, position, anchor, rotation_dd, width_cm, length_cm, mooring_type, overhang_allowed, water, wifi, attributes, online_sellable, active, group_ids]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        code: { $ref: "#/components/schemas/Code" }
        structure_id: { $ref: "#/components/schemas/ElementRef" }
        side: { $ref: "#/components/schemas/Side" }
        position: { type: integer, format: int64, description: Order along the structure }
        anchor: { $ref: "#/components/schemas/Point" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        width_cm: { $ref: "#/components/schemas/RectSideCm" }
        length_cm: { $ref: "#/components/schemas/RectSideCm" }
        max_loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        depth_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_air_draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_displacement_kg: { type: integer, format: int64, minimum: 1 }
        mooring_type: { $ref: "#/components/schemas/MooringType" }
        swing_radius_cm: { $ref: "#/components/schemas/PositiveCm" }
        overhang_allowed: { type: boolean }
        pedestal_id: { $ref: "#/components/schemas/ElementRef" }
        pedestal_socket: { type: string, maxLength: 16 }
        power_a: { type: integer, enum: [16, 32, 63, 125] }
        power_phase: { $ref: "#/components/schemas/PowerPhase" }
        water: { type: boolean }
        wifi: { type: boolean }
        price_class: { type: string, maxLength: 16 }
        attributes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        online_sellable: { type: boolean }
        active: { type: boolean }
        group_ids:
          type: array
          maxItems: 50
          items: { type: string }

    AreaKind:
      type: string
      enum: [linear, surface]

    MooringMode:
      type: string
      enum: [stern_to, alongside]

    DynamicArea:
      type: object
      required: [kind, code, blocked_cells, exits, grid_rotation_dd, active, group_ids]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        kind: { $ref: "#/components/schemas/AreaKind" }
        code: { $ref: "#/components/schemas/Code" }
        structure_id: { $ref: "#/components/schemas/ElementRef" }
        side: { $ref: "#/components/schemas/Side" }
        from_cm: { $ref: "#/components/schemas/Cm" }
        to_cm: { $ref: "#/components/schemas/Cm" }
        outline: { $ref: "#/components/schemas/Polygon" }
        mooring_mode: { $ref: "#/components/schemas/MooringMode" }
        cell_cm: { type: integer, format: int64, minimum: 10, maximum: 1000 }
        margin_cm: { type: integer, format: int64, minimum: 0, maximum: 1000 }
        max_loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_height_cm: { $ref: "#/components/schemas/PositiveCm" }
        max_weight_kg: { type: integer, format: int64, minimum: 1 }
        supports:
          type: array
          maxItems: 3
          items: { type: string, enum: [cradle, trailer, rack] }
        depth_profile:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/DepthSpan" }
        blocked_cells:
          type: array
          maxItems: 1000000
          items: { type: integer, minimum: 0 }
        exits:
          type: array
          maxItems: 10000
          items: { type: integer, minimum: 0 }
        grid_rotation_dd: { type: integer, format: int64, enum: [0, 900, 1800, 2700] }
        cell_count: { type: integer, format: int64, readOnly: true, description: Computed at save }
        price_class: { type: string, maxLength: 16 }
        active: { type: boolean }
        group_ids:
          type: array
          maxItems: 50
          items: { type: string }

    LandKind:
      type: string
      enum: [parking, box, storeroom, locker, cradle, trailer_spot, custom]

    LandResource:
      type: object
      required: [kind, code, anchor, rotation_dd, width_cm, length_cm, attributes, active, group_ids]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        kind: { $ref: "#/components/schemas/LandKind" }
        code: { $ref: "#/components/schemas/Code" }
        anchor: { $ref: "#/components/schemas/Point" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        width_cm: { $ref: "#/components/schemas/RectSideCm" }
        length_cm: { $ref: "#/components/schemas/RectSideCm" }
        price_class: { type: string, maxLength: 16 }
        attributes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        active: { type: boolean }
        group_ids:
          type: array
          maxItems: 50
          items: { type: string }

    UtilityKind:
      type: string
      enum: [power, water]

    PedestalSocket:
      type: object
      required: [code, kind]
      properties:
        code: { type: string, minLength: 1, maxLength: 16 }
        kind: { $ref: "#/components/schemas/UtilityKind" }
        amps: { type: integer, enum: [16, 32, 63, 125] }
        phase: { $ref: "#/components/schemas/PowerPhase" }

    PedestalMeter:
      type: object
      required: [kind, serial]
      properties:
        kind: { $ref: "#/components/schemas/UtilityKind" }
        serial: { type: string, minLength: 1, maxLength: 64 }

    Pedestal:
      type: object
      required: [code, position, sockets, meters]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        code: { $ref: "#/components/schemas/Code" }
        position: { $ref: "#/components/schemas/Point" }
        sockets:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/PedestalSocket" }
        meters:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/PedestalMeter" }

    DecorationKind:
      type: string
      enum: [symbol, text, depth_label, north_arrow, scale_bar]

    Decoration:
      type: object
      required: [kind]
      properties:
        id: { type: string, description: Saved element id (omit for a new element) }
        key: { $ref: "#/components/schemas/ElementKey" }
        kind: { $ref: "#/components/schemas/DecorationKind" }
        asset: { type: string, maxLength: 64, description: Illustration kit asset id (kind = symbol) }
        variant: { type: string, maxLength: 32 }
        position: { $ref: "#/components/schemas/Point" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        size_cm: { $ref: "#/components/schemas/PositiveCm" }
        points:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/Point" }
        label: { $ref: "#/components/schemas/I18nText" }
        depth_cm: { $ref: "#/components/schemas/Cm" }

    MapElements:
      type: object
      required: [structures, berths, dynamic_areas, land_resources, pedestals, decorations]
      properties:
        structures:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/Structure" }
        berths:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/Berth" }
        dynamic_areas:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/DynamicArea" }
        land_resources:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/LandResource" }
        pedestals:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/Pedestal" }
        decorations:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/Decoration" }

    MapDocument:
      allOf:
        - $ref: "#/components/schemas/MapMeta"
        - $ref: "#/components/schemas/MapElements"
        - type: object
          required: [id, version, updated_at]
          properties:
            id: { type: string }
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    MapSaveRequest:
      allOf:
        - $ref: "#/components/schemas/MapMeta"
        - $ref: "#/components/schemas/MapElements"

    MapIssueSeverity:
      type: string
      enum: [error, warning]

    MapIssue:
      type: object
      required: [code, severity, element_type, refs]
      properties:
        code:
          description: ValidateMap rule (m1-plan §2.3), e.g. berth_overlap
          type: string
        severity: { $ref: "#/components/schemas/MapIssueSeverity" }
        element_type: { type: string }
        refs:
          type: array
          items: { type: string }
        field: { type: string }
        params:
          description: Numbers only (cm, counts)
          type: object
          additionalProperties: { type: integer, format: int64 }

    MapValidationReport:
      type: object
      required: [errors, warnings]
      properties:
        errors:
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }

    MapSaveResult:
      type: object
      required: [document, id_map, warnings]
      properties:
        document: { $ref: "#/components/schemas/MapDocument" }
        id_map:
          description: Element key of the request → new id
          type: object
          additionalProperties: { type: string }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }

    MapExportGroupMember:
      type: object
      required: [resource_type, code]
      properties:
        resource_type: { $ref: "#/components/schemas/GroupResourceType" }
        code: { $ref: "#/components/schemas/Code" }

    MapExportGroup:
      type: object
      required: [code, name, kind, members]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { $ref: "#/components/schemas/I18nText" }
        kind: { $ref: "#/components/schemas/BerthGroupKind" }
        members:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/MapExportGroupMember" }

    MapExport:
      type: object
      required: [format, exported_at, map, groups]
      properties:
        format: { type: string, enum: [porto-map/1] }
        exported_at: { type: string, format: date-time }
        map: { $ref: "#/components/schemas/MapSaveRequest" }
        groups:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/MapExportGroup" }

    GeneratorType:
      type: string
      enum: [pier, quay_berths, linear_area, buoy_field, land_grid, surface_area]

    Numbering:
      type: object
      required: [scheme]
      properties:
        scheme: { type: string, enum: [continuous, odd_left_even_right, per_side] }
        prefix: { type: string, maxLength: 16 }
        start: { type: integer, format: int64, minimum: 0, default: 1 }
        pad: { type: integer, minimum: 0, maximum: 3 }

    PierGenerator:
      type: object
      required: [type, key_prefix, origin, rotation_dd, length_cm, width_cm, code, sides, berth_width_cm, berth_length_cm, numbering]
      properties:
        type: { type: string, enum: [pier] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        origin: { $ref: "#/components/schemas/Point" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        length_cm: { $ref: "#/components/schemas/PositiveCm" }
        width_cm: { $ref: "#/components/schemas/PositiveCm" }
        floating: { type: boolean }
        code: { $ref: "#/components/schemas/Code" }
        root_id: { $ref: "#/components/schemas/ElementRef" }
        sides:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, enum: [left, right] }
        berths_per_side: { type: integer, minimum: 0, description: 0 = fill the length }
        start_offset_cm: { $ref: "#/components/schemas/Cm" }
        berth_width_cm: { $ref: "#/components/schemas/RectSideCm" }
        berth_length_cm: { $ref: "#/components/schemas/RectSideCm" }
        berth_width_end_cm: { $ref: "#/components/schemas/Cm" }
        berth_length_end_cm: { $ref: "#/components/schemas/Cm" }
        finger_every: { type: integer, minimum: 0 }
        finger_width_cm: { $ref: "#/components/schemas/Cm" }
        finger_length_cm: { $ref: "#/components/schemas/Cm" }
        head_berths: { type: integer, minimum: 0, maximum: 4 }
        mooring_type: { $ref: "#/components/schemas/MooringType" }
        numbering: { $ref: "#/components/schemas/Numbering" }
        depth_cm: { $ref: "#/components/schemas/Cm" }
        group_id: { type: string }

    QuayBerthsGenerator:
      type: object
      required: [type, key_prefix, quay_id, from_cm, to_cm, side, berth_width_cm, berth_length_cm, numbering]
      properties:
        type: { type: string, enum: [quay_berths] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        quay_id: { $ref: "#/components/schemas/ElementRef" }
        from_cm: { $ref: "#/components/schemas/Cm" }
        to_cm: { $ref: "#/components/schemas/Cm" }
        side: { type: string, enum: [left, right] }
        berth_width_cm: { $ref: "#/components/schemas/RectSideCm" }
        count: { type: integer, minimum: 0, description: 0 = fill by width }
        berth_length_cm: { $ref: "#/components/schemas/RectSideCm" }
        mooring_type: { $ref: "#/components/schemas/MooringType" }
        numbering: { $ref: "#/components/schemas/Numbering" }
        group_id: { type: string }

    LinearAreaGenerator:
      type: object
      required: [type, key_prefix, code, structure_id, side, from_cm, to_cm, mode]
      properties:
        type: { type: string, enum: [linear_area] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        code: { $ref: "#/components/schemas/Code" }
        structure_id: { $ref: "#/components/schemas/ElementRef" }
        side: { type: string, enum: [left, right, head] }
        from_cm: { $ref: "#/components/schemas/Cm" }
        to_cm: { $ref: "#/components/schemas/Cm" }
        mode: { $ref: "#/components/schemas/MooringMode" }
        cell_cm: { $ref: "#/components/schemas/Cm" }
        margin_cm: { $ref: "#/components/schemas/Cm" }
        max_loa_cm: { $ref: "#/components/schemas/Cm" }
        max_beam_cm: { $ref: "#/components/schemas/Cm" }
        group_id: { type: string }

    BuoyFieldGenerator:
      type: object
      required: [type, key_prefix, outline, swing_radius_cm, layout, numbering]
      properties:
        type: { type: string, enum: [buoy_field] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        outline: { $ref: "#/components/schemas/Polygon" }
        swing_radius_cm: { $ref: "#/components/schemas/PositiveCm" }
        layout: { type: string, enum: [grid, staggered] }
        spacing_cm: { $ref: "#/components/schemas/Cm" }
        max_loa_cm: { $ref: "#/components/schemas/Cm" }
        numbering: { $ref: "#/components/schemas/Numbering" }
        group_id: { type: string }

    LandGridGenerator:
      type: object
      required: [type, key_prefix, origin, rotation_dd, rows, cols, item_width_cm, item_length_cm, kind, numbering]
      properties:
        type: { type: string, enum: [land_grid] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        origin: { $ref: "#/components/schemas/Point" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        rows: { type: integer, minimum: 1 }
        cols: { type: integer, minimum: 1 }
        item_width_cm: { $ref: "#/components/schemas/RectSideCm" }
        item_length_cm: { $ref: "#/components/schemas/RectSideCm" }
        aisle_cm: { $ref: "#/components/schemas/Cm" }
        aisle_every: { type: integer, minimum: 0 }
        kind: { $ref: "#/components/schemas/LandKind" }
        numbering: { $ref: "#/components/schemas/Numbering" }
        group_id: { type: string }

    SurfaceLane:
      type: object
      required: [from, to, width_cm]
      properties:
        from: { $ref: "#/components/schemas/Point" }
        to: { $ref: "#/components/schemas/Point" }
        width_cm: { $ref: "#/components/schemas/PositiveCm" }

    SurfaceAreaGenerator:
      type: object
      required: [type, key_prefix, code, outline, cell_cm]
      properties:
        type: { type: string, enum: [surface_area] }
        key_prefix: { type: string, minLength: 1, maxLength: 16, pattern: "^[A-Za-z0-9_:-]+$" }
        code: { $ref: "#/components/schemas/Code" }
        outline: { $ref: "#/components/schemas/Polygon" }
        cell_cm: { $ref: "#/components/schemas/PositiveCm" }
        grid_rotation_dd: { type: integer, format: int64, enum: [0, 900, 1800, 2700] }
        exits:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Point" }
        lanes:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SurfaceLane" }
        margin_cm: { $ref: "#/components/schemas/Cm" }
        max_loa_cm: { $ref: "#/components/schemas/Cm" }
        max_height_cm: { $ref: "#/components/schemas/Cm" }
        group_id: { type: string }

    GeneratorParams:
      oneOf:
        - $ref: "#/components/schemas/PierGenerator"
        - $ref: "#/components/schemas/QuayBerthsGenerator"
        - $ref: "#/components/schemas/LinearAreaGenerator"
        - $ref: "#/components/schemas/BuoyFieldGenerator"
        - $ref: "#/components/schemas/LandGridGenerator"
        - $ref: "#/components/schemas/SurfaceAreaGenerator"
      discriminator:
        propertyName: type
        mapping:
          pier: "#/components/schemas/PierGenerator"
          quay_berths: "#/components/schemas/QuayBerthsGenerator"
          linear_area: "#/components/schemas/LinearAreaGenerator"
          buoy_field: "#/components/schemas/BuoyFieldGenerator"
          land_grid: "#/components/schemas/LandGridGenerator"
          surface_area: "#/components/schemas/SurfaceAreaGenerator"

    GenerateRequest:
      type: object
      required: [generator]
      properties:
        generator: { $ref: "#/components/schemas/GeneratorParams" }
        document:
          description: The current unsaved document; when given, the result carries a report of document + elements
          allOf:
            - $ref: "#/components/schemas/MapSaveRequest"

    GenerateResult:
      type: object
      required: [elements, counts]
      properties:
        elements: { $ref: "#/components/schemas/MapElements" }
        report: { $ref: "#/components/schemas/MapValidationReport" }
        counts: { $ref: "#/components/schemas/MapCounts" }

    MapBackgroundFile:
      type: object
      required: [file_id, content_type, width_px, height_px, size_bytes]
      properties:
        file_id: { type: string }
        content_type: { type: string, enum: [image/png, image/jpeg, image/svg+xml] }
        width_px: { type: integer, format: int64 }
        height_px: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }

    ConcessionGeojsonRequest:
      type: object
      required: [geojson]
      properties:
        geojson:
          description: A GeoJSON Polygon, Feature or FeatureCollection with one polygon (WGS84)
          type: object
          additionalProperties: true
        georef: { $ref: "#/components/schemas/Georef" }

    ConcessionGeojsonResult:
      type: object
      required: [outline]
      properties:
        outline: { $ref: "#/components/schemas/Polygon" }

    BerthImportMapping:
      description: Zero-based column index of each field in the CSV
      type: object
      required: [code, pier, length, width]
      properties:
        code: { type: integer, minimum: 0 }
        pier: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 0 }
        depth: { type: integer, minimum: 0 }
        price_class: { type: integer, minimum: 0 }
        side: { type: integer, minimum: 0 }
        mooring_type: { type: integer, minimum: 0 }

    BerthImportPlacement:
      type: object
      required: [start, side_policy]
      properties:
        start: { type: string, enum: [after_existing, root] }
        side_policy: { type: string, enum: [alternate, column, left, right] }

    BerthImportRequest:
      type: object
      required: [csv, has_header, mapping, units, placement, dry_run]
      properties:
        csv: { type: string, maxLength: 4000000 }
        delimiter: { type: string, enum: [comma, semicolon, tab], description: Column separator (default comma) }
        has_header: { type: boolean }
        mapping: { $ref: "#/components/schemas/BerthImportMapping" }
        units: { type: string, enum: [m, cm] }
        placement: { $ref: "#/components/schemas/BerthImportPlacement" }
        dry_run: { type: boolean }

    BerthImportRejected:
      type: object
      required: [row, errors]
      properties:
        row: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    BerthImportDuplicate:
      type: object
      required: [row, code, reason]
      properties:
        row: { type: integer }
        code: { type: string }
        reason: { type: string, enum: [code_in_file, code_on_map] }

    BerthImportPlanned:
      type: object
      required: [row, code, pier, side]
      properties:
        row: { type: integer }
        code: { type: string }
        pier: { type: string }
        side: { $ref: "#/components/schemas/Side" }

    BerthImportReport:
      type: object
      required: [rows_total, valid, rejected, duplicates, planned]
      properties:
        rows_total: { type: integer }
        valid: { type: integer }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/BerthImportRejected" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/BerthImportDuplicate" }
        planned:
          type: array
          items: { $ref: "#/components/schemas/BerthImportPlanned" }
        document: { $ref: "#/components/schemas/MapSaveResult" }

    BerthSummary:
      type: object
      required: [id, map_id, code, structure_code, width_cm, length_cm, max_loa_cm, max_beam_cm, depth_cm, price_class, mooring_type, active]
      properties:
        id: { type: string }
        map_id: { type: string }
        code: { type: string }
        structure_code: { type: [string, "null"] }
        width_cm: { $ref: "#/components/schemas/Cm" }
        length_cm: { $ref: "#/components/schemas/Cm" }
        max_loa_cm: { $ref: "#/components/schemas/Cm" }
        max_beam_cm: { $ref: "#/components/schemas/Cm" }
        depth_cm: { type: [integer, "null"], format: int64 }
        price_class: { type: [string, "null"] }
        mooring_type: { $ref: "#/components/schemas/MooringType" }
        active: { type: boolean }

    BerthPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BerthSummary" }
        next_cursor: { type: [string, "null"] }

    BerthGroupKind:
      type: string
      enum: [structure, transit, area, custom]

    GroupResourceType:
      type: string
      enum: [berth, dynamic_area, land_resource]

    BerthGroupMemberCounts:
      type: object
      required: [berth, dynamic_area, land_resource]
      properties:
        berth: { type: integer }
        dynamic_area: { type: integer }
        land_resource: { type: integer }

    BerthGroup:
      type: object
      required: [id, code, name, kind, sort_order, member_counts, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { $ref: "#/components/schemas/I18nText" }
        kind: { $ref: "#/components/schemas/BerthGroupKind" }
        sort_order: { type: integer }
        member_counts: { $ref: "#/components/schemas/BerthGroupMemberCounts" }
        version: { type: integer }

    BerthGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BerthGroup" }

    BerthGroupCreate:
      type: object
      required: [code, name]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { $ref: "#/components/schemas/I18nText" }
        kind: { $ref: "#/components/schemas/BerthGroupKind" }

    BerthGroupPatch:
      type: object
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { $ref: "#/components/schemas/I18nText" }
        kind: { $ref: "#/components/schemas/BerthGroupKind" }
        sort_order: { type: integer }

    PriceBand:
      type: object
      required: [max_cm, class]
      properties:
        max_cm: { $ref: "#/components/schemas/PositiveCm" }
        class: { type: string, minLength: 1, maxLength: 16 }

    PriceClassRule:
      description: Width bands → price class, sorted by max_cm; fallback above the last band
      type: object
      required: [basis, bands, fallback]
      properties:
        basis: { type: string, enum: [width] }
        bands:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PriceBand" }
        fallback: { type: string, maxLength: 16 }

    HarborSettings:
      type: object
      required: [price_class_rule, loa_tolerance_cm, default_grid_cm, version]
      properties:
        price_class_rule: { $ref: "#/components/schemas/PriceClassRule" }
        loa_tolerance_cm: { type: integer, format: int64, minimum: 0, maximum: 500 }
        default_grid_cm: { type: integer, format: int64, minimum: 1, maximum: 10000 }
        version: { type: integer }

    HarborSettingsPatch:
      type: object
      properties:
        price_class_rule: { $ref: "#/components/schemas/PriceClassRule" }
        loa_tolerance_cm: { type: integer, format: int64, minimum: 0, maximum: 500 }
        default_grid_cm: { type: integer, format: int64, minimum: 1, maximum: 10000 }

    # ---- M1 registry ----

    CustomerKind:
      type: string
      enum: [person, company]

    CustomerCategory:
      type: string
      enum: [member, resident, affiliated, charter, yard]

    ContactEntry:
      type: object
      required: [label, value]
      properties:
        label: { type: string, maxLength: 32 }
        value: { type: string, minLength: 1, maxLength: 254 }

    PaymentTerms:
      type: object
      required: [days, end_of_month]
      properties:
        days: { type: integer, minimum: 0, maximum: 365 }
        end_of_month: { type: boolean }

    Customer:
      type: object
      required:
        - id
        - kind
        - first_name
        - last_name
        - company_name
        - display_name
        - fiscal_code
        - vat_number
        - sdi_code
        - pec
        - billing_address
        - nationality
        - locale
        - emails
        - phones
        - category
        - tags
        - payment_terms
        - iban_masked
        - notes
        - merged_into_id
        - anonymized_at
        - archived_at
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/CustomerKind" }
        first_name: { type: string }
        last_name: { type: string }
        company_name: { type: string }
        display_name: { type: string, description: Empty for an anonymised customer }
        fiscal_code: { type: [string, "null"] }
        vat_number: { type: [string, "null"] }
        sdi_code: { type: [string, "null"] }
        pec: { type: [string, "null"] }
        billing_address: { $ref: "#/components/schemas/Address" }
        nationality: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        emails:
          type: array
          items: { $ref: "#/components/schemas/ContactEntry" }
        phones:
          type: array
          items: { $ref: "#/components/schemas/ContactEntry" }
        category:
          oneOf:
            - $ref: "#/components/schemas/CustomerCategory"
            - type: "null"
        tags:
          type: array
          items: { type: string }
        payment_terms:
          oneOf:
            - $ref: "#/components/schemas/PaymentTerms"
            - type: "null"
        iban_masked: { type: [string, "null"], description: 'Masked, e.g. "IT•• •••• 1234"; the IBAN is never returned' }
        notes: { type: string }
        merged_into_id: { type: [string, "null"] }
        anonymized_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/CustomerKind" }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        company_name: { type: string, maxLength: 200 }
        fiscal_code: { type: string, maxLength: 16 }
        vat_number: { type: string, maxLength: 20 }
        sdi_code: { type: string, maxLength: 7 }
        pec: { type: string, maxLength: 254 }
        billing_address: { $ref: "#/components/schemas/Address" }
        nationality: { type: string, minLength: 2, maxLength: 2 }
        locale: { $ref: "#/components/schemas/Locale" }
        emails:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContactEntry" }
        phones:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContactEntry" }
        category: { $ref: "#/components/schemas/CustomerCategory" }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
        payment_terms: { $ref: "#/components/schemas/PaymentTerms" }
        iban: { type: string, maxLength: 42, writeOnly: true }
        notes: { type: string, maxLength: 4000 }

    CustomerPatch:
      description: Partial update; null clears a nullable field, "" clears the IBAN
      type: object
      properties:
        kind: { $ref: "#/components/schemas/CustomerKind" }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        company_name: { type: string, maxLength: 200 }
        fiscal_code: { type: [string, "null"], maxLength: 16 }
        vat_number: { type: [string, "null"], maxLength: 20 }
        sdi_code: { type: [string, "null"], maxLength: 7 }
        pec: { type: [string, "null"], maxLength: 254 }
        billing_address: { $ref: "#/components/schemas/Address" }
        nationality: { type: [string, "null"], maxLength: 2 }
        locale: { $ref: "#/components/schemas/Locale" }
        emails:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContactEntry" }
        phones:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ContactEntry" }
        category:
          oneOf:
            - $ref: "#/components/schemas/CustomerCategory"
            - type: "null"
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
        payment_terms:
          oneOf:
            - $ref: "#/components/schemas/PaymentTerms"
            - type: "null"
        iban: { type: string, maxLength: 42, writeOnly: true }
        notes: { type: string, maxLength: 4000 }

    CustomerSummary:
      type: object
      required: [id, kind, display_name, fiscal_code, vat_number, category, tags, primary_email, primary_phone, vessel_count, archived_at, anonymized_at, merged_into_id]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/CustomerKind" }
        display_name: { type: string }
        fiscal_code: { type: [string, "null"] }
        vat_number: { type: [string, "null"] }
        category:
          oneOf:
            - $ref: "#/components/schemas/CustomerCategory"
            - type: "null"
        tags:
          type: array
          items: { type: string }
        primary_email: { type: [string, "null"] }
        primary_phone: { type: [string, "null"] }
        vessel_count: { type: integer }
        archived_at: { type: [string, "null"], format: date-time }
        anonymized_at: { type: [string, "null"], format: date-time }
        merged_into_id: { type: [string, "null"] }

    CustomerPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerSummary" }
        next_cursor: { type: [string, "null"] }

    CustomerCreated:
      type: object
      required: [customer, possible_duplicates]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        possible_duplicates:
          type: array
          items: { $ref: "#/components/schemas/CustomerSummary" }

    CustomerVesselLink:
      type: object
      required: [vessel, roles, share_millis]
      properties:
        vessel: { $ref: "#/components/schemas/VesselSummary" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/VesselPartyRole" }
        share_millis: { type: [integer, "null"], format: int64 }

    CustomerOverview:
      type: object
      required: [customer, vessels, documents, deadlines, consents, duplicates]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        vessels:
          type: array
          items: { $ref: "#/components/schemas/CustomerVesselLink" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        deadlines:
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        consents:
          description: The current consent of each kind
          type: array
          items: { $ref: "#/components/schemas/Consent" }
