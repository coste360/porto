    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [reports]
      operationId: getReportComparison
      summary: >-
        R11 an indicator compared with 1 to 5 previous years, aligned by date or weekday (permission of the
        indicator)
      security: *readSecurity
      parameters:
        - name: indicator
          in: query
          required: false
          description: >-
            Required; optional in the contract only so that another marina is 404 first (missing or not comparable:
            422 unknown_indicator)
          schema: { $ref: "#/components/schemas/ComparisonIndicator" }
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - { name: years_back, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5, default: 1 } }
        - $ref: "#/components/parameters/ReportAlignParam"
        - { name: granularity, in: query, required: false, description: "Default: day up to 31 days, week up to 120, else month", schema: { $ref: "#/components/schemas/ReportGranularity" } }
        - $ref: "#/components/parameters/ReportFormatParam"
        - $ref: "#/components/parameters/ReportLang"
        - $ref: "#/components/parameters/ReportMapId"
        - $ref: "#/components/parameters/ReportMapKind"
        - $ref: "#/components/parameters/ReportStructureId"
        - $ref: "#/components/parameters/ReportGroupId"
        - $ref: "#/components/parameters/ReportCategory"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonResult" }
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ReportUnprocessable" }

