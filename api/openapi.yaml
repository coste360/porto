    # ---- M2 pricing (spec 12; m2-plan §2.2, §4). Money integer cents, percentages basis points, lengths cm,
    # quantities milli. The JSON shapes mirror internal/domain/pricing. ----

    IsoDate:
      description: Calendar date YYYY-MM-DD in the marina timezone
      type: string
      format: date
      x-go-type: string

    Cents:
      description: Amount in integer cents of the marina currency
      type: integer
      format: int64

    BasisPoints:
      description: Percentage in integer basis points (1 % = 100)
      type: integer
      format: int64

    QtyMilli:
      description: Quantity in thousandths (1.5 = 1500)
      type: integer
      format: int64

    ContractType:
      type: string
      enum: [annual, seasonal, monthly, transit, storage, charter]

    Channel:
      type: string
      enum: [desk, online, api, external]

    ItemType:
      type: string
      enum: [berth_fee, service, utility, product, labour, material, fee, deposit]

    ItemUnit:
      type: string
      enum: [night, month, season, year, m, m2, kwh, m3, hour, piece, lump]

    VatNature:
      description: FatturaPA nature of a 0 % VAT line (m2-plan §12 D9)
      type: string
      enum: [N1, N2.1, N2.2, N3.1, N3.2, N3.3, N3.4, N3.5, N3.6, N4, N5, N6.1, N6.2, N6.3, N6.4, N6.5, N6.6, N6.7, N6.8, N6.9, N7]

    PricingStage:
      type: string
      enum: [base, modifier, discount]

    PricingBasis:
      type: string
      enum: [per_berth, length_band, per_meter, per_m2, per_m2_berth, flat, metered]

    TimeUnit:
      type: string
      enum: [night, week, month, season, year, stay]

    SplitRule:
      type: string
      enum: [pro_rata_daily, whole_months, best_combination]

    DimensionSource:
      type: string
      enum: [vessel, berth, max]

    TotalRounding:
      type: string
      enum: [none, euro, five_euro]

    AmountRounding:
      type: string
      enum: [none, ten_cents, euro]

    DiscountKind:
      type: string
      enum: [customer, promo, automatic]

    PeriodKind:
      type: string
      enum: [season, event]

    PeriodColor:
      type: string
      enum: [chart-1, chart-2, chart-3, chart-4, chart-5]

    PriceListStatus:
      type: string
      enum: [draft, active, archived]

    CategoryTarget:
      type: string
      enum: [berth, dynamic_area, land_resource]

    PricingSettings:
      type: object
      required: [default_vat_rate_bp, default_price_includes_vat, version]
      properties:
        default_vat_rate_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        default_price_includes_vat: { type: boolean }
        version: { type: integer }

    PricingSettingsUpdate:
      type: object
      required: [default_vat_rate_bp, default_price_includes_vat]
      properties:
        default_vat_rate_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        default_price_includes_vat: { type: boolean }

