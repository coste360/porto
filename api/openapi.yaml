        decided_at: { type: string, format: date-time }
        decline_reason: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuoteOption" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    QuoteSummary:
      type: object
      required: [id, code, status, kind, customer, vessel, starts_on, ends_on, valid_until, options_count, created_at, version]
      properties:
        id: { type: string }
        code: { type: string }
        status: { $ref: "#/components/schemas/QuoteStatus" }
