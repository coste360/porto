      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [presences]
      operationId: listPresences
      summary: >-
        Presence events of a night (default today) or of a vessel; notes only with customers.read (map.view)
      security: *readSecurity
      parameters:
        - { name: date, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: vessel_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresencePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [presences]
      operationId: recordPresence
      summary: >-
        Record an arrival or departure (hauled_out and launched are accepted for M9) (presence.write)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/v1/marinas/{marinaId}/presences/unexpected-arrival:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [presences]
      operationId: recordUnexpectedArrival
      summary: >-
        Unexpected arrival: vessel (new or existing), a held transit on the target and the arrival in one transaction (presence.write and transits.desk)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnexpectedArrival" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceResult" }
