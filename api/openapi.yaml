    # ---- M5 payments, refunds, credits (m5-plan §4) ----

    PaymentKind:
      type: string
      enum: [payment, deposit, credit]

    PaymentMethod:
      type: string
      enum: [cash, card_pos, bank_transfer, cheque, other, card_online, wallet, sepa_debit, credit_note]

    PaymentSource:
      type: string
      enum: [manual, provider, backfill, adjustment, goodwill, release, mandate, opening_balance]

    RefundStatus:
      type: string
      enum: [pending, succeeded, failed]

