        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [presences]
      operationId: recordPresence
      summary: >-
        Record an arrival or departure (hauled_out and launched are accepted for M9) (presence.write)
      description: |
        Offline replay (M6b, `Porto-Offline-Queued-At`): only `arrived` / `departed` with `allocation_id` and
        `expected_resource_id` (else 422 `offline_not_allowed`); `at` defaults to the queued instant. With
        `expected_resource_id` the allocation must still be active, of the vessel and on that resource for the night, else 409
        `allocation_changed` with `details.current_resource_id` / `details.current_resource_code` (null when the
        allocation is gone). A key replayed with the same body returns the same presence, also after the
        idempotency row is gone (domain dedupe).
      security: *writeSecurity
      x-porto-offline: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OfflineQueuedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/presences/unexpected-arrival:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [presences]
      operationId: recordUnexpectedArrival
      summary: >-
        Unexpected arrival: vessel (new or existing), a held transit on the target and the arrival in one transaction (presence.write and transits.desk)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnexpectedArrival" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/OccupancyUnprocessable" }

  /api/admin/v1/marinas/{marinaId}/presences/{presenceId}/photo:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PresenceId"
    post:
      tags: [presences]
      operationId: uploadPresencePhoto
      summary: >-
        Attach a photo to a presence (JPEG, PNG or WebP, at most 8 MiB, raw body), encrypted at rest (presence.write)
      description: >-
        One photo per presence (a new upload replaces it). Queueable offline (M6b). The same bytes as the current
        photo return the current file id without writing again (domain dedupe of replays).
      security: *writeSecurity
      x-porto-max-body-bytes: 8388608
      x-porto-offline: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OfflineQueuedAt"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresencePhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      tags: [presences]
      operationId: getPresencePhotoLink
      summary: >-
        A short-lived (5 minutes) signed link to the photo (customers.read)
      security: *readSecurity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/presences/{presenceId}/photo/file:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PresenceId"
    get:
      tags: [presences]
      operationId: getPresencePhotoFile
      summary: >-
        Download the photo through a signed link from getPresencePhotoLink (exp and sig checked in the service) (customers.read)
      security: *readSecurity
      parameters:
        - { name: exp, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/movements:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [presences]
      operationId: getMovements
      summary: >-
        Movements of a night (default today): expected arrivals and departures, vessels out, arrivals without booking, arrived, departed (map.view)
      security: *readSecurity
      parameters:
        - { name: date, in: query, required: false, schema: { $ref: "#/components/schemas/IsoDate" } }
        - { name: map_id, in: query, required: false, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movements" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

