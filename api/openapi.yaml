    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        retry_after_seconds: { type: integer }
        issues:
          description: Map validation issues (map_invalid)
          type: array
          items: { $ref: "#/components/schemas/MapIssue" }
        price_list_issues:
          description: Price list validation issues (price_list_invalid)
          type: array
          items: { $ref: "#/components/schemas/PriceListIssue" }
        details:
          description: >-
            Machine-readable details: no_price {item_id, contract_type, night, unit, category, band, reason};
            price_list_overlap {conflicts: [{id, code, valid_from, valid_to}]}; in_use {references};
            resource_taken ConflictDetail; fit_blocked FitResult; placement_invalid {reason, allocation_id?};
            invalid_transition {from, action}; closure_active {closure_id, from_date, to_date}; release_invalid
            {reason}; allocation_changed {current_resource_id, current_resource_code} (null when the allocation
            is gone); remote_pin_mismatch {expected_fingerprint, presented_fingerprint}. Ids, codes, dates and
            integers only.
          type: object
          additionalProperties: true

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, enum: [ok] }
        schema_version: { type: integer, format: int64 }

    Meta:
      type: object
      required: [version, api_version, edition, capabilities, demo_pairing, local_mode, pricing_engine_version]
      properties:
        version: { type: string }
        api_version: { type: string }
        edition: { type: string, enum: [server, desktop] }
        capabilities:
          type: array
          items: { type: string }
        demo_pairing: { type: boolean }
        local_mode:
          type: boolean
          description: >-
            Online features (public page, online payments and payment links, remote signature) are unavailable
            because the instance is not reachable from the internet (desktop edition)
        pricing_engine_version:
          description: Version of the pricing engine (quotes store it with their price snapshot, INV-20)
          type: integer

