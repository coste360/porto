      - $ref: "#/components/parameters/PriceListId"
    post:
      tags: [price-lists]
      operationId: activatePriceList
      summary: >-
        Activate a valid draft from effective_from (default valid_from); predecessors serving the same contract types are truncated, other overlaps are 409 price_list_overlap (pricing.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceListActivate" }
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceListActivateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/PricingUnprocessable" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/admin/v1/marinas/{marinaId}/price-lists/{priceListId}/archive:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/PriceListId"
    post:
      tags: [price-lists]
      operationId: archivePriceList
      summary: >-
        Archive an active list (drafts are deleted instead) (pricing.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: OK
