    ItemPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        next_cursor: { type: [string, "null"] }

    ItemCreate:
      description: vat_rate_bp and price_includes_vat default from the pricing settings; vat_nature is required exactly when the rate is 0.
      type: object
      required: [code, name, item_type, unit, revenue_class_id]
      properties:
        code: { $ref: "#/components/schemas/ItemCode" }
        name: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nTextOptional" }
        item_type: { $ref: "#/components/schemas/ItemType" }
        unit: { $ref: "#/components/schemas/ItemUnit" }
        vat_rate_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        vat_nature: { $ref: "#/components/schemas/VatNature" }
        price_includes_vat: { type: boolean }
        revenue_class_id: { type: string, maxLength: 36 }
        external_code: { type: string, maxLength: 64 }
        active: { type: boolean }
        online_visible: { type: boolean }
        sort_order: { type: integer }

    ItemPatch:
      description: Absent fields are unchanged; vat_nature null clears it (with a non-zero rate).
      type: object
      properties:
        code: { $ref: "#/components/schemas/ItemCode" }
        name: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nTextOptional" }
        item_type: { $ref: "#/components/schemas/ItemType" }
        unit: { $ref: "#/components/schemas/ItemUnit" }
        vat_rate_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        vat_nature: { oneOf: [{ $ref: "#/components/schemas/VatNature" }, { type: "null" }] }
        price_includes_vat: { type: boolean }
        revenue_class_id: { type: string, maxLength: 36 }
        external_code: { type: string, maxLength: 64 }
        active: { type: boolean }
        online_visible: { type: boolean }
        sort_order: { type: integer }

    BerthCategoryUsage:
      type: object
      required: [berths, dynamic_areas, land_resources, rules]
      properties:
        berths: { type: integer }
        dynamic_areas: { type: integer }
        land_resources: { type: integer }
        rules: { type: integer }

    BerthCategory:
      type: object
      required: [id, code, name, applies_to, sort_order, archived, usage, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { $ref: "#/components/schemas/I18nText" }
        applies_to:
          type: array
          items: { $ref: "#/components/schemas/CategoryTarget" }
        sort_order: { type: integer }
        archived: { type: boolean }
        usage: { $ref: "#/components/schemas/BerthCategoryUsage" }
        version: { type: integer }

    CodeCount:
      type: object
      required: [code, count]
      properties:
        code: { type: string }
        count: { type: integer }

    CustomerCategoryCountList:
      type: object
      required: [items, uncategorised]
      properties:
        items:
          description: every category of the enum in enum order, with count 0 when unused
          type: array
          items: { $ref: "#/components/schemas/CodeCount" }
        uncategorised:
          description: non-archived customers without a category
          type: integer

    BerthCategoryList:
      type: object
      required: [items, unknown_in_use]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BerthCategory" }
        unknown_in_use:
          description: price_class codes used by elements without a matching category
          type: array
          items: { $ref: "#/components/schemas/CodeCount" }

    BerthCategoryCreate:
      type: object
      required: [code, name, applies_to]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { $ref: "#/components/schemas/I18nText" }
        applies_to:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/CategoryTarget" }
        sort_order: { type: integer }

    BerthCategoryPatch:
      description: Absent fields are unchanged; the code cannot change; archived archives or restores it.
      type: object
      properties:
        name: { $ref: "#/components/schemas/I18nText" }
        applies_to:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/CategoryTarget" }
        sort_order: { type: integer }
        archived: { type: boolean }

    BerthCategorySyncResult:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items: { $ref: "#/components/schemas/BerthCategory" }

    DateRange:
      description: Inclusive range of nights
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }

    DocKey:
      description: Client key of a new row of a price list document, unique in the request
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_:-]+$"

    RatePeriod:
      description: A season or an event of a price list. Saved rows carry id; new rows in a save carry key.
      type: object
      required: [code, name, kind, ranges]
      properties:
        id: { type: string }
        key: { $ref: "#/components/schemas/DocKey" }
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { $ref: "#/components/schemas/I18nText" }
        kind: { $ref: "#/components/schemas/PeriodKind" }
        color: { $ref: "#/components/schemas/PeriodColor" }
        ranges:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/DateRange" }

    Band:
      description: Length band inclusive up to max_cm (absent = open, last band only); order is the array order.
      type: object
      required: [code]
      properties:
        id: { type: string }
        key: { $ref: "#/components/schemas/DocKey" }
        code: { type: string, minLength: 1, maxLength: 32 }
        max_cm: { type: integer, format: int64, minimum: 1, maximum: 20000 }
        category: { type: string, maxLength: 32 }

    LengthRounding:
      type: object
      required: [step_cm, mode]
      properties:
        step_cm: { type: integer, format: int64, enum: [1, 10, 50, 100] }
        mode: { type: string, enum: [up, half_even] }

    Ratio:
      type: object
      required: [num, den]
      properties:
        num: { type: integer, format: int64, minimum: 0, maximum: 100 }
        den: { type: integer, format: int64, minimum: 1, maximum: 100 }

    DepositPolicy:
      description: Percent of the total or a fixed amount capped at the total (at most one)
      type: object
      properties:
        percent_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        amount_cents: { type: integer, format: int64, minimum: 0, maximum: 100000000 }

    PriceListSettings:
      description: Engine settings (m2-plan §2.3). Map keys are contract types or "*" for the others.
      type: object
      required: [dimension_source, length_rounding]
      properties:
        dimension_source: { $ref: "#/components/schemas/DimensionSource" }
        length_rounding: { $ref: "#/components/schemas/LengthRounding" }
        min_beam_ratio: { oneOf: [{ $ref: "#/components/schemas/Ratio" }, { type: "null" }] }
        split:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SplitRule" }
        rounding:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TotalRounding" }
        deposits:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DepositPolicy" }
        season_window: { oneOf: [{ $ref: "#/components/schemas/DateRange" }, { type: "null" }] }
        primary_items:
          description: Item id of the berth fee per contract type
          type: object
          additionalProperties: { type: string }
        publish_matrix:
          description: Stored for the public transit matrix (M8); unused in M2
          type: boolean

    PricingScope:
      description: Empty or absent list = any value
      type: object
      properties:
        contract_types:
          type: array
          items: { $ref: "#/components/schemas/ContractType" }
        categories:
          type: array
          items: { type: string, maxLength: 32 }
        group_ids:
          type: array
          items: { type: string, maxLength: 36 }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
        customer_categories:
          type: array
          items: { $ref: "#/components/schemas/CustomerCategory" }
        periods:
          description: Rate period codes
          type: array
          items: { type: string, maxLength: 32 }

    PricingConditions:
      type: object
      properties:
        hull_types:
          type: array
          items: { $ref: "#/components/schemas/HullType" }
        overhang_min_cm: { type: integer, format: int64, minimum: 0, maximum: 20000 }
        min_nights: { type: integer, minimum: 1, maximum: 3660 }
        max_nights: { type: integer, minimum: 1, maximum: 3660 }
        lead_min_days: { type: integer, minimum: 0, maximum: 3660 }
        lead_max_days: { type: integer, minimum: 0, maximum: 3660 }

    PricingEffect:
      description: Exactly one of the two
      type: object
      properties:
        percent_bp: { type: integer, format: int64, minimum: -100000, maximum: 100000 }
        amount_cents: { type: integer, format: int64, minimum: -100000000, maximum: 100000000 }

    Inclusion:
      type: object
      required: [item_id, qty_milli]
      properties:
        item_id: { type: string, maxLength: 36 }
        qty_milli: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }

    PriceRule:
      description: >-
        A base rule, modifier or discount (field set by stage, m2-plan §2.2): base rules use item_id, basis, unit,
        amount_cents/unit_cents/amounts and includes; modifiers and discounts use target_item_ids/types,
        conditions and effect; discounts also discount_kind and promo_code. seq is assigned by the server.
      type: object
      required: [stage, name]
      properties:
        id: { type: string }
        key: { $ref: "#/components/schemas/DocKey" }
        seq: { type: integer, format: int64, readOnly: true }
        stage: { $ref: "#/components/schemas/PricingStage" }
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        priority: { type: integer, format: int64, minimum: -1000, maximum: 1000 }
        stackable: { type: boolean }
        item_id: { type: string, maxLength: 36 }
        basis: { $ref: "#/components/schemas/PricingBasis" }
        unit: { $ref: "#/components/schemas/TimeUnit" }
        amount_cents: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
        unit_cents: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
        amounts:
          description: length_band band code → cents; per_berth category → cents
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0, maximum: 100000000 }
        includes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Inclusion" }
        target_item_ids:
          type: array
          items: { type: string, maxLength: 36 }
        target_item_types:
          type: array
          items: { $ref: "#/components/schemas/ItemType" }
        conditions: { $ref: "#/components/schemas/PricingConditions" }
        effect: { $ref: "#/components/schemas/PricingEffect" }
        discount_kind: { $ref: "#/components/schemas/DiscountKind" }
        promo_code: { type: string, maxLength: 32 }
        scope: { $ref: "#/components/schemas/PricingScope" }

    PriceListIssueRef:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [list, settings, period, band, rule, item] }
        id:
          description: Id of the row, or the client key of an unsaved one
          type: string
        field: { type: string }

    PriceListIssue:
      type: object
      required: [code, severity, ref]
      properties:
        code:
          description: pricing.Validate issue code (m2-plan §4.8), e.g. period_overlap
          type: string
        severity: { $ref: "#/components/schemas/MapIssueSeverity" }
        ref: { $ref: "#/components/schemas/PriceListIssueRef" }
        params:
          description: Codes and integers as strings; never personal data
          type: object
          additionalProperties: { type: string }

    PriceListSummary:
      type: object
      required: [id, code, name, status, valid_from, valid_to, contract_types, rule_count, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { $ref: "#/components/schemas/I18nText" }
        status: { $ref: "#/components/schemas/PriceListStatus" }
        valid_from: { $ref: "#/components/schemas/IsoDate" }
        valid_to: { $ref: "#/components/schemas/IsoDate" }
        contract_types:
          type: array
          items: { $ref: "#/components/schemas/ContractType" }
        rule_count: { type: integer }
        version: { type: integer }
        source_price_list_id: { type: [string, "null"] }

    PriceListSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PriceListSummary" }

    PriceListCreate:
      type: object
      required: [code, name, valid_from, valid_to, contract_types]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { $ref: "#/components/schemas/I18nText" }
        valid_from: { $ref: "#/components/schemas/IsoDate" }
        valid_to: { $ref: "#/components/schemas/IsoDate" }
        contract_types:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/ContractType" }

    PriceListSave:
      description: The whole editable document of a draft; periods, bands and rules are replaced by the diff.
      type: object
      required: [code, name, valid_from, valid_to, contract_types, settings, periods, bands, rules]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { $ref: "#/components/schemas/I18nText" }
        valid_from: { $ref: "#/components/schemas/IsoDate" }
        valid_to: { $ref: "#/components/schemas/IsoDate" }
        contract_types:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ContractType" }
        settings: { $ref: "#/components/schemas/PriceListSettings" }
        periods:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/RatePeriod" }
        bands:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/Band" }
        rules:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/PriceRule" }

    PriceListDocument:
      allOf:
        - $ref: "#/components/schemas/PriceListSave"
        - type: object
          required: [id, status, version, issues, updated_at]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/PriceListStatus" }
            source_price_list_id: { type: [string, "null"] }
            content_sha256: { type: [string, "null"] }
            activated_at: { type: [string, "null"], format: date-time }
            archived_at: { type: [string, "null"], format: date-time }
            version: { type: integer }
            issues:
              type: array
              items: { $ref: "#/components/schemas/PriceListIssue" }
            updated_at: { type: string, format: date-time }

    PriceListSaveResult:
      type: object
      required: [document, id_map, issues]
      properties:
        document: { $ref: "#/components/schemas/PriceListDocument" }
        id_map:
          description: Row key of the request → new id
          type: object
          additionalProperties: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/PriceListIssue" }

    PriceListValidation:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/PriceListIssue" }

    PriceListActivate:
      type: object
      properties:
        effective_from: { $ref: "#/components/schemas/IsoDate" }

    PriceListRef:
      type: object
      required: [id, code, valid_from, valid_to]
      properties:
        id: { type: string }
        code: { type: string }
        valid_from: { $ref: "#/components/schemas/IsoDate" }
        valid_to: { $ref: "#/components/schemas/IsoDate" }

    PriceListActivateResult:
      type: object
      required: [document, truncated]
      properties:
        document: { $ref: "#/components/schemas/PriceListDocument" }
        truncated:
          description: Predecessors whose valid_to was shortened (valid_to is the new value)
          type: array
          items: { $ref: "#/components/schemas/PriceListRef" }

    RenewalAdjustment:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [all, item, category] }
        item_id: { type: string, maxLength: 36 }
        category: { type: string, maxLength: 32 }
        percent_bp: { type: integer, format: int64, minimum: -10000, maximum: 100000 }
        amount_cents: { type: integer, format: int64, minimum: -100000000, maximum: 100000000 }

    RenewalMatrixOptions:
      type: object
      properties:
        contract_types:
          type: array
          items: { $ref: "#/components/schemas/ContractType" }
        channel: { $ref: "#/components/schemas/Channel" }
        customer_category: { $ref: "#/components/schemas/CustomerCategory" }

    RenewalRequest:
      type: object
      required: [dry_run, code, name, shift_years, amount_rounding]
      properties:
        dry_run: { type: boolean }
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { $ref: "#/components/schemas/I18nText" }
        shift_years: { type: integer, minimum: 0, maximum: 5 }
        istat_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        adjustments:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RenewalAdjustment" }
        amount_rounding: { $ref: "#/components/schemas/AmountRounding" }
        valid_from: { $ref: "#/components/schemas/IsoDate" }
        valid_to: { $ref: "#/components/schemas/IsoDate" }
        matrix: { $ref: "#/components/schemas/RenewalMatrixOptions" }

    RenewalDiffCell:
      type: object
      required: [row, col]
      properties:
        row: { type: integer }
        col: { type: integer }
        old_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        delta_cents: { type: integer, format: int64 }
        delta_bp: { type: integer, format: int64 }

    RenewalDiff:
      type: object
      required: [contract_type, before, after, cells]
      properties:
        contract_type: { $ref: "#/components/schemas/ContractType" }
        before: { $ref: "#/components/schemas/PriceMatrix" }
        after: { $ref: "#/components/schemas/PriceMatrix" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/RenewalDiffCell" }

    RenewalPreview:
      type: object
      required: [document, diffs, summary]
      properties:
        document: { $ref: "#/components/schemas/PriceListSave" }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/RenewalDiff" }
        summary:
          type: object
          required: [rules, amounts_changed]
          properties:
            rules: { type: integer }
            amounts_changed: { type: integer }

    SimulateVessel:
      type: object
      required: [loa_cm, beam_cm]
      properties:
        loa_cm: { type: integer, format: int64, minimum: 1, maximum: 20000 }
        beam_cm: { type: integer, format: int64, minimum: 1, maximum: 20000 }
        hull_type: { $ref: "#/components/schemas/HullType" }

    SimulateResource:
      type: object
      required: [type, id]
      properties:
        type: { $ref: "#/components/schemas/CategoryTarget" }
        id: { type: string, maxLength: 36 }

    SimulateService:
      type: object
      required: [item_id]
      properties:
        item_id: { type: string, maxLength: 36 }
        qty_milli: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }

    PricingSimulateRequest:
      description: >-
        Stay to price. Nights are [arrival, departure). vessel_id or vessel, resource or category with berth
        dimensions, customer_id or customer_category; explicit fields override the resolved ones. Matrix probes
        use this shape with explicit dimensions, price_list_id and quoted_on.
      type: object
      required: [contract_type, arrival, departure]
      properties:
        price_list_id: { type: string, maxLength: 36 }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        item_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        vessel: { $ref: "#/components/schemas/SimulateVessel" }
        resource: { $ref: "#/components/schemas/SimulateResource" }
        category: { type: string, maxLength: 32 }
        berth_length_cm: { type: integer, format: int64, minimum: 1, maximum: 20000 }
        berth_width_cm: { type: integer, format: int64, minimum: 1, maximum: 20000 }
        group_ids:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 36 }
        customer_id: { type: string, maxLength: 36 }
        customer_category: { $ref: "#/components/schemas/CustomerCategory" }
        channel: { $ref: "#/components/schemas/Channel" }
        promo_code: { type: string, maxLength: 32 }
        quoted_on: { $ref: "#/components/schemas/IsoDate" }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        deposit: { $ref: "#/components/schemas/DepositPolicy" }

    PriceApplied:
      type: object
      required: [rule_id, delta_cents]
      properties:
        rule_id: { type: string }
        delta_cents: { type: integer, format: int64 }

    PriceBlock:
      type: object
      required: [from, to, unit, nights, rule_id, base_cents, modifiers, amount_cents]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to:
          description: Exclusive; may be after the departure (best_combination overshoot)
          allOf: [{ $ref: "#/components/schemas/IsoDate" }]
        unit: { $ref: "#/components/schemas/TimeUnit" }
        nights: { type: integer }
        period: { type: string }
        rule_id: { type: string }
        base_cents: { type: integer, format: int64 }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/PriceApplied" }
        amount_cents: { type: integer, format: int64 }

    PriceLine:
      type: object
      required: [seq, kind, item_id, item_code, item_type, qty_milli, blocks, base_cents, modifier_total_cents, discounts, amount_cents, rounding_share_cents, gross_cents, net_cents, vat_cents, vat_rate_bp, price_includes_vat, service_from, service_to]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [berth, service, included] }
        item_id: { type: string }
        item_code: { type: string }
        item_type: { $ref: "#/components/schemas/ItemType" }
        revenue_class: { type: string }
        external_code: { type: string }
        qty_milli: { type: integer, format: int64 }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/PriceBlock" }
        base_cents: { type: integer, format: int64 }
        modifier_total_cents: { type: integer, format: int64 }
        discounts:
          type: array
          items: { $ref: "#/components/schemas/PriceApplied" }
        amount_cents: { type: integer, format: int64 }
        rounding_share_cents: { type: integer, format: int64 }
        gross_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }
        vat_cents: { type: integer, format: int64 }
        vat_rate_bp: { type: integer, format: int64 }
        vat_nature: { type: string }
        price_includes_vat: { type: boolean }
        service_from: { $ref: "#/components/schemas/IsoDate" }
        service_to:
          description: Last night (inclusive)
          allOf: [{ $ref: "#/components/schemas/IsoDate" }]

    VatBucket:
      type: object
      required: [vat_rate_bp, net_cents, vat_cents, gross_cents]
      properties:
        vat_rate_bp: { type: integer, format: int64 }
        vat_nature: { type: string }
        net_cents: { type: integer, format: int64 }
        vat_cents: { type: integer, format: int64 }
        gross_cents: { type: integer, format: int64 }

    PriceTraceStep:
      type: object
      required: [code, line, block]
      properties:
        code:
          description: Trace code (pricing/trace.go), shown as pricingEnums:trace.<code>
          type: string
        line: { type: integer }
        block: { type: integer }
        rule_id: { type: string }
        params:
          type: object
          additionalProperties: { type: string }

    PriceResolved:
      description: What the simulator used after resolving ids; never names or contact data.
      type: object
      required: [price_list_id, price_list_code, item_id, channel, quoted_on, dimension_origin]
      properties:
        price_list_id: { type: string }
        price_list_code: { type: string }
        item_id: { type: string }
        loa_cm: { type: integer, format: int64 }
        beam_cm: { type: integer, format: int64 }
        hull_type: { $ref: "#/components/schemas/HullType" }
        category: { type: string }
        berth_length_cm: { type: integer, format: int64 }
        berth_width_cm: { type: integer, format: int64 }
        group_ids:
          type: array
          items: { type: string }
        customer_category: { $ref: "#/components/schemas/CustomerCategory" }
        channel: { $ref: "#/components/schemas/Channel" }
        quoted_on: { $ref: "#/components/schemas/IsoDate" }
        dimension_origin: { type: string, enum: [declared, measured, input, none] }

    PriceBreakdown:
      type: object
      required: [engine_version, price_list_id, catalog_hash, contract_type, nights, lines, subtotal_cents, discount_total_cents, rounding_total_cents, total_cents, net_cents, vat_cents, vat_summary, deposit_cents, trace, warnings]
      properties:
        engine_version: { type: integer }
        price_list_id: { type: string }
        catalog_hash: { type: string }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        nights: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PriceLine" }
        subtotal_cents: { type: integer, format: int64 }
        discount_total_cents: { type: integer, format: int64 }
        rounding_total_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }
        vat_cents: { type: integer, format: int64 }
        vat_summary:
          type: array
          items: { $ref: "#/components/schemas/VatBucket" }
        deposit_cents: { type: integer, format: int64 }
        trace:
          type: array
          items: { $ref: "#/components/schemas/PriceTraceStep" }
        warnings:
          type: array
          items: { type: string }
        resolved: { $ref: "#/components/schemas/PriceResolved" }

    PriceMatrixRow:
      type: object
      required: [key, kind, probe_loa_cm, probe_beam_cm]
      properties:
        key: { type: string }
        kind: { type: string, enum: [band, category] }
        probe_loa_cm: { type: integer, format: int64 }
        probe_beam_cm: { type: integer, format: int64 }

    PriceMatrixColumn:
      type: object
      required: [key, arrival, departure]
      properties:
        key:
          description: Rate period code, or year / season
          type: string
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }

    PriceMatrixCell:
      type: object
      required: [row, col, probe]
      properties:
        row: { type: integer }
        col: { type: integer }
        total_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }
        base_cents: { type: integer, format: int64 }
        unit: { $ref: "#/components/schemas/TimeUnit" }
        error:
          description: Error code when the probe has no price, e.g. no_price:no_rule
          type: string
        probe: { $ref: "#/components/schemas/PricingSimulateRequest" }

    PriceMatrix:
      type: object
      required: [price_list_id, contract_type, item_id, quoted_on, rows, columns, cells]
      properties:
        price_list_id: { type: string }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        item_id: { type: string }
        quoted_on: { $ref: "#/components/schemas/IsoDate" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PriceMatrixRow" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/PriceMatrixColumn" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/PriceMatrixCell" }

    PriceCoverageGap:
      type: object
      required: [contract_type, item_id, reason]
      properties:
        contract_type: { $ref: "#/components/schemas/ContractType" }
        category: { type: string }
        band: { type: string }
        period: { type: string }
        item_id: { type: string }
        reason:
          description: NoPriceError reason (no_rule, no_band, no_amount, outside_validity, no_primary_item, unit_missing)
          type: string

    PriceCoverage:
      type: object
      required: [gaps, elements_without_category, unknown_categories, checked]
      properties:
        gaps:
          type: array
          items: { $ref: "#/components/schemas/PriceCoverageGap" }
        elements_without_category:
          type: object
          required: [berths, dynamic_areas, land_resources]
          properties:
            berths: { type: integer }
            dynamic_areas: { type: integer }
            land_resources: { type: integer }
        unknown_categories:
          type: array
          items: { $ref: "#/components/schemas/CodeCount" }
        checked: { type: integer }

    # ---- M3 occupancy, contracts and transits, presences (spec 9, 10, 13 base; m3-plan §7, §8.3). Nights are
    # inclusive YYYY-MM-DD ranges; stays are [arrival/starts_on, departure/ends_on). Lengths cm, money cents,
    # ratios basis points. Customer names only with customers.read. ----

    ResourceType:
      type: string
      enum: [berth, dynamic_area, land_resource]

    ResourceRef:
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string, maxLength: 36 }

    PlacementInput:
      description: A resource and, for dynamic areas, the placement (x along the axis or x/y in grid space, rotation for surfaces)
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string, maxLength: 36 }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }

    SegmentInput:
      description: A placement for the inclusive nights [first_night, last_night]
      allOf:
        - $ref: "#/components/schemas/PlacementInput"
        - type: object
          required: [first_night, last_night]
          properties:
            first_night: { $ref: "#/components/schemas/IsoDate" }
            last_night: { $ref: "#/components/schemas/IsoDate" }

    NightRange:
      description: Inclusive range of nights
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }

    FitIssue:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/FitCode" }
        limit_cm: { $ref: "#/components/schemas/Cm" }
        actual_cm: { $ref: "#/components/schemas/Cm" }

    FitCode:
      type: string
      enum: [loa_exceeds, beam_exceeds, draft_exceeds, air_draft_exceeds, multihull_not_allowed, vessel_invalid,
             fill_below_threshold, depth_near_limit, power_insufficient, insurance_missing, insurance_expires_in_period,
             overhang]

    FitResult:
      type: object
      required: [ok, overridable, fill_bp, blocking, warnings]
      properties:
        ok: { type: boolean }
        overridable: { type: boolean }
        fill_bp: { $ref: "#/components/schemas/BasisPoints" }
        blocking:
          type: array
          items: { $ref: "#/components/schemas/FitIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/FitIssue" }

    FitOverrideInput:
      description: Accept the blocking dimensional fit codes (occupancy.override_fit); the reason is audited
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }

    FitOverride:
      type: object
      required: [user_id, reason, codes]
      properties:
        user_id: { type: string }
        reason: { type: string }
        codes:
          type: array
          items: { type: string }

    PriceSummary:
      type: object
      required: [price_list_id, total_cents, deposit_cents, engine_version]
      properties:
        price_list_id: { type: string }
        total_cents: { $ref: "#/components/schemas/Cents" }
        deposit_cents: { $ref: "#/components/schemas/Cents" }
        engine_version: { type: integer }

    PriceEffect:
      type: object
      required: [old_total_cents, new_total_cents, delta_cents]
      properties:
        old_total_cents: { $ref: "#/components/schemas/Cents" }
        new_total_cents: { $ref: "#/components/schemas/Cents" }
        delta_cents: { $ref: "#/components/schemas/Cents" }
        applied: { type: boolean, description: true when the contract price was replaced (reprice) }

    ConflictDetail:
      description: Details of resource_taken; alternatives come from a search when the service runs one
      type: object
      required: [resource_type, resource_id, from, to, allocation_ids]
      properties:
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        cells:
          type: array
          items: { type: integer }
        allocation_ids:
          type: array
          items: { type: string }
        vessel_id: { type: string }
        alternatives:
          type: array
          items: { $ref: "#/components/schemas/OccupancySolution" }

    VesselBrief:
      description: The vessel embedded in occupancy and contract views (no registration, no owner)
      type: object
      required: [id, name, loa_cm, beam_cm, hull_type]
      properties:
        id: { type: string }
        name: { type: string }
        loa_cm: { $ref: "#/components/schemas/Cm" }
        beam_cm: { $ref: "#/components/schemas/Cm" }
        hull_type: { $ref: "#/components/schemas/HullType" }
        draft_cm: { $ref: "#/components/schemas/Cm" }

    CustomerBrief:
      description: The customer embedded in views; display_name only with customers.read
      type: object
      required: [id]
      properties:
        id: { type: string }
        display_name: { type: string }

    AllocationKind:
      type: string
      enum: [hold, contract, transit, owner, block, maintenance]

    AllocationStatus:
      type: string
      enum: [active, cancelled, expired, superseded]

    ContractKind:
      type: string
      enum: [mooring, transit, storage, charter]

    ContractTerm:
      type: string
      enum: [annual, seasonal, monthly, period]

    ContractStatus:
      description: Mooring statuses (draft..suspended) and transit statuses (held..awaiting_approval)
      type: string
      enum: [draft, awaiting_signature, active, expired, renewed, terminated, cancelled, suspended, held,
             pending_payment, confirmed, arrived, departed, no_show, awaiting_approval]

    ContractBrief:
      type: object
      required: [id, kind, status, code]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ContractKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        code: { type: string, description: "ORM-2026-0001, TRN-2026-0001" }

    Allocation:
      type: object
      required: [id, resource_type, resource_id, map_id, first_night, last_night, kind, status, version, released]
      properties:
        id: { type: string }
        contract_line_id: { type: string }
        contract_id: { type: string }
        vessel_id: { type: string }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        resource_code: { type: string }
        map_id: { type: string }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        first_night: { $ref: "#/components/schemas/IsoDate" }
        last_night: { $ref: "#/components/schemas/IsoDate" }
        kind: { $ref: "#/components/schemas/AllocationKind" }
        status: { $ref: "#/components/schemas/AllocationStatus" }
        expires_at: { type: string, format: date-time }
        fit_override: { $ref: "#/components/schemas/FitOverride" }
        block_reason: { type: string }
        moved_from_id: { type: string }
        released:
          type: array
          items: { $ref: "#/components/schemas/NightRange" }
        version: { type: integer }

    AllocationList:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }

    AllocationDetail:
      allOf:
        - $ref: "#/components/schemas/Allocation"
        - type: object
          required: [releases, moved_from_chain]
          properties:
            contract: { $ref: "#/components/schemas/ContractBrief" }
            vessel: { $ref: "#/components/schemas/VesselBrief" }
            releases:
              type: array
              items: { $ref: "#/components/schemas/Release" }
            moved_from_chain:
              description: Ids of the predecessors, nearest first
              type: array
              items: { type: string }

    CellsRange:
      description: Occupied cells of an area placement; linear areas give first/last, surfaces the indexes
      type: object
      properties:
        first: { type: integer }
        last: { type: integer }
        indexes:
          type: array
          items: { type: integer }

    MapAllocation:
      type: object
      required: [id, resource_type, resource_id, first_night, last_night, kind, status, version, released]
      properties:
        id: { type: string }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        cells: { $ref: "#/components/schemas/CellsRange" }
        first_night: { $ref: "#/components/schemas/IsoDate" }
        last_night: { $ref: "#/components/schemas/IsoDate" }
        kind: { $ref: "#/components/schemas/AllocationKind" }
        status: { $ref: "#/components/schemas/AllocationStatus" }
        expires_at: { type: string, format: date-time }
        version: { type: integer }
        released:
          type: array
          items: { $ref: "#/components/schemas/NightRange" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        contract: { $ref: "#/components/schemas/ContractBrief" }

    MapOccupancy:
      type: object
      required: [from, to, allocations]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/MapAllocation" }

    DayStatus:
      type: string
      enum: [free, hold, contract, transit, block, maintenance, owner, released, closed]

    PresenceState:
      type: string
      enum: [in_port, out, ashore, yard]

    DayPresence:
      type: object
      required: [state, since, away_days]
      properties:
        state: { $ref: "#/components/schemas/PresenceState" }
        since: { type: string, format: date-time }
        expected_return_on: { $ref: "#/components/schemas/IsoDate" }
        away_days: { type: integer }

    DayRelease:
      type: object
      required: [id, from, to, resold]
      properties:
        id: { type: string }
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        resold: { type: boolean }

    DayFit:
      type: object
      required: [fill_bp, override, blocking_codes]
      properties:
        fill_bp: { $ref: "#/components/schemas/BasisPoints" }
        override: { type: boolean }
        blocking_codes:
          type: array
          items: { $ref: "#/components/schemas/FitCode" }

    DeadlineState:
      type: string
      enum: [ok, expiring, expired, missing]

    DayDeadlines:
      type: object
      required: [insurance, documents]
      properties:
        contract_ends_on: { $ref: "#/components/schemas/IsoDate" }
        insurance: { $ref: "#/components/schemas/DeadlineState" }
        documents: { $ref: "#/components/schemas/DeadlineState" }

    DayUtilities:
      type: object
      required: [water]
      properties:
        power_a: { type: integer }
        power_phase: { $ref: "#/components/schemas/PowerPhase" }
        water: { type: boolean }

    AnomalyCode:
      type: string
      enum: [presence_without_allocation, not_arrived, departure_overdue, vessel_exceeds_limits, insurance_expired_active,
             hold_lost_draft]

    DayElement:
      type: object
      required: [resource_type, resource_id, code, status, arrival_today, departure_today, anomalies]
      properties:
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        code: { type: string }
        status: { $ref: "#/components/schemas/DayStatus" }
        allocation_id: { type: string }
        allocation_version: { type: integer }
        kind: { $ref: "#/components/schemas/AllocationKind" }
        hold_expires_at: { type: string, format: date-time }
        contract: { $ref: "#/components/schemas/ContractBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        presence: { $ref: "#/components/schemas/DayPresence" }
        release: { $ref: "#/components/schemas/DayRelease" }
        arrival_today: { type: boolean }
        departure_today: { type: boolean }
        fit: { $ref: "#/components/schemas/DayFit" }
        deadlines: { $ref: "#/components/schemas/DayDeadlines" }
        utilities: { $ref: "#/components/schemas/DayUtilities" }
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/AnomalyCode" }

    AreaPlacement:
      type: object
      required: [area_id, allocation_id, allocation_version, x_cm, cells, status, kind, vessel, anomalies]
      properties:
        area_id: { type: string }
        allocation_id: { type: string }
        allocation_version: { type: integer }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        cells: { $ref: "#/components/schemas/CellsRange" }
        status: { $ref: "#/components/schemas/DayStatus" }
        kind: { $ref: "#/components/schemas/AllocationKind" }
        contract: { $ref: "#/components/schemas/ContractBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        presence: { $ref: "#/components/schemas/DayPresence" }
        fit: { $ref: "#/components/schemas/DayFit" }
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/AnomalyCode" }

    UnplacedVessel:
      type: object
      required: [vessel, presence_id, reason]
      properties:
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        presence_id: { type: string }
        reason: { type: string, enum: [arrived_without_booking] }

    DayView:
      type: object
      required: [map_id, date, map_version, generated_at, elements, area_placements, unplaced, counts]
      properties:
        map_id: { type: string }
        date: { $ref: "#/components/schemas/IsoDate" }
        map_version: { type: integer }
        generated_at: { type: string, format: date-time }
        elements:
          type: array
          items: { $ref: "#/components/schemas/DayElement" }
        area_placements:
          type: array
          items: { $ref: "#/components/schemas/AreaPlacement" }
        unplaced:
          type: array
          items: { $ref: "#/components/schemas/UnplacedVessel" }
        counts:
          type: object
          required: [anomalies]
          properties:
            anomalies: { type: integer }

    ReleasePolicy:
      type: string
      enum: [never, with_consent]

    OccupancySettings:
      type: object
      required: [safety_clearance_cm, waste_threshold_bp, draft_hold_days, desk_hold_hours, quote_validity_days,
                 max_segments, absent_days_threshold, arrival_grace_minutes, default_arrival_time,
                 default_departure_time, reprice_on_move, release_policy, version]
      properties:
        safety_clearance_cm: { type: integer, format: int64, minimum: 0, maximum: 300 }
        waste_threshold_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        draft_hold_days: { type: integer, minimum: 1, maximum: 60 }
        desk_hold_hours: { type: integer, minimum: 1, maximum: 168 }
        quote_validity_days: { type: integer, minimum: 1, maximum: 120 }
        max_segments: { type: integer, minimum: 0, maximum: 2 }
        absent_days_threshold: { type: integer, minimum: 1, maximum: 365 }
        arrival_grace_minutes: { type: integer, minimum: 0, maximum: 1440 }
        default_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        default_departure_time: { $ref: "#/components/schemas/LocalTime" }
        reprice_on_move: { type: boolean }
        release_policy: { $ref: "#/components/schemas/ReleasePolicy" }
        version: { type: integer }

    OccupancySettingsUpdate:
      type: object
      required: [safety_clearance_cm, waste_threshold_bp, draft_hold_days, desk_hold_hours, quote_validity_days,
                 max_segments, absent_days_threshold, arrival_grace_minutes, default_arrival_time,
                 default_departure_time, reprice_on_move, release_policy]
      properties:
        safety_clearance_cm: { type: integer, format: int64, minimum: 0, maximum: 300 }
        waste_threshold_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        draft_hold_days: { type: integer, minimum: 1, maximum: 60 }
        desk_hold_hours: { type: integer, minimum: 1, maximum: 168 }
        quote_validity_days: { type: integer, minimum: 1, maximum: 120 }
        max_segments: { type: integer, minimum: 0, maximum: 2 }
        absent_days_threshold: { type: integer, minimum: 1, maximum: 365 }
        arrival_grace_minutes: { type: integer, minimum: 0, maximum: 1440 }
        default_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        default_departure_time: { $ref: "#/components/schemas/LocalTime" }
        reprice_on_move: { type: boolean }
        release_policy: { $ref: "#/components/schemas/ReleasePolicy" }

    LocalTime:
      description: Local time HH:MM in the marina timezone
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

    SearchPurpose:
      type: string
      enum: [transit, contract]

    SearchVessel:
      type: object
      required: [loa_cm, beam_cm, hull_type]
      properties:
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        air_draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        hull_type: { $ref: "#/components/schemas/HullType" }

    SearchPrefs:
      type: object
      properties:
        group_ids:
          type: array
          maxItems: 50
          items: { type: string }
        structure_ids:
          type: array
          maxItems: 50
          items: { type: string }
        power_a: { type: integer }
        water: { type: boolean }

    OccupancySearchRequest:
      description: vessel_id or vessel; nights are [arrival, departure)
      type: object
      required: [purpose, arrival, departure]
      properties:
        purpose: { $ref: "#/components/schemas/SearchPurpose" }
        vessel_id: { type: string, maxLength: 36 }
        vessel: { $ref: "#/components/schemas/SearchVessel" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        resource_types:
          type: array
          items: { $ref: "#/components/schemas/ResourceType" }
        prefs: { $ref: "#/components/schemas/SearchPrefs" }
        consider_out: { type: boolean }
        max_segments: { type: integer, minimum: 0, maximum: 2 }
        customer_id: { type: string, maxLength: 36 }
        channel: { type: string, enum: [desk, api] }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        limit: { type: integer, minimum: 1, maximum: 50 }

    SolutionSegment:
      type: object
      required: [resource_type, resource_id, code, map_id, first_night, last_night]
      properties:
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        code: { type: string }
        map_id: { type: string }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        first_night: { $ref: "#/components/schemas/IsoDate" }
        last_night: { $ref: "#/components/schemas/IsoDate" }

    OccupancySolution:
      type: object
      required: [key, segments, score, fit]
      properties:
        key: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/SolutionSegment" }
        score: { type: integer, format: int64 }
        fit: { $ref: "#/components/schemas/FitResult" }
        requires_release:
          type: object
          required: [allocation_id, contract_id]
          properties:
            allocation_id: { type: string }
            contract_id: { type: string }
        pricing: { $ref: "#/components/schemas/PriceSummary" }
        pricing_error:
          type: object
          required: [type]
          properties:
            type: { type: string, description: Problem slug (no_price) }
            reason: { type: string }

    OccupancySearchResult:
      type: object
      required: [solutions, considered]
      properties:
        solutions:
          type: array
          items: { $ref: "#/components/schemas/OccupancySolution" }
        considered: { type: integer }

    PlacementCheckRequest:
      description: allocation_id (a move) or vessel_id (a new placement)
      type: object
      required: [target, from_night, to_night]
      properties:
        allocation_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        target: { $ref: "#/components/schemas/PlacementInput" }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        to_night: { $ref: "#/components/schemas/IsoDate" }

    PlacementCheck:
      type: object
      required: [ok, fit, conflicts]
      properties:
        ok: { type: boolean }
        fit: { $ref: "#/components/schemas/FitResult" }
        placement_error: { type: string, description: unsnapped, outside_area, blocked_cell, invalid_vessel, placement_required, placement_not_allowed }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ConflictDetail" }
        closure_id: { type: string }
        price_effect: { $ref: "#/components/schemas/PriceEffect" }

    MoveRequest:
      type: object
      required: [allocation_id, version, target]
      properties:
        allocation_id: { type: string, maxLength: 36 }
        version: { type: integer }
        target: { $ref: "#/components/schemas/PlacementInput" }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        to_night: { $ref: "#/components/schemas/IsoDate" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }
        reprice: { type: boolean }

    VersionedAllocation:
      type: object
      required: [allocation_id, version]
      properties:
        allocation_id: { type: string, maxLength: 36 }
        version: { type: integer }

    SwapRequest:
      type: object
      required: [a, b]
      properties:
        a: { $ref: "#/components/schemas/VersionedAllocation" }
        b: { $ref: "#/components/schemas/VersionedAllocation" }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    MoveResult:
      type: object
      required: [allocations, undo_id, undo_until]
      properties:
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }
        undo_id: { type: string }
        undo_until: { type: string, format: date-time }
        price_effect: { $ref: "#/components/schemas/PriceEffect" }

    LayoutPlacement:
      type: object
      required: [allocation_id, x_cm]
      properties:
        allocation_id: { type: string, maxLength: 36 }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }

    AreaLayoutSave:
      type: object
      required: [date, base, placements]
      properties:
        date: { $ref: "#/components/schemas/IsoDate" }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        base:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/VersionedAllocation" }
        placements:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/LayoutPlacement" }
        fit_overrides:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [allocation_id, reason]
            properties:
              allocation_id: { type: string, maxLength: 36 }
              reason: { type: string, minLength: 1, maxLength: 200 }

    CompactionRequest:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }

    CompactionProposal:
      type: object
      required: [placements, freed_cm, base]
      properties:
        placements:
          type: array
          items:
            type: object
            required: [allocation_id, x_cm]
            properties:
              allocation_id: { type: string }
              x_cm: { $ref: "#/components/schemas/Cm" }
        freed_cm: { $ref: "#/components/schemas/Cm" }
        base:
          type: array
          items: { $ref: "#/components/schemas/VersionedAllocation" }

    BlockCreate:
      description: For dynamic areas loa_cm and beam_cm give the blocked footprint
      type: object
      required: [target, from, to, reason]
      properties:
        target: { $ref: "#/components/schemas/PlacementInput" }
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string, minLength: 1, maxLength: 200 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }

    ReleaseStatus:
      type: string
      enum: [active, revoked]

    ReleaseSource:
      type: string
      enum: [customer_phone, customer_desk, customer_link, dock, office, system]

    Release:
      type: object
      required: [id, allocation_id, contract_id, resource_type, resource_id, from_night, to_night, status, source,
                 resold_nights, credit_cents, created_at, version]
      properties:
        id: { type: string }
        allocation_id: { type: string }
        contract_id: { type: string }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        resource_code: { type: string }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        to_night: { $ref: "#/components/schemas/IsoDate" }
        status: { $ref: "#/components/schemas/ReleaseStatus" }
        source: { $ref: "#/components/schemas/ReleaseSource" }
        resold_allocation_id: { type: string }
        resold_nights: { type: integer }
        credit_cents: { $ref: "#/components/schemas/Cents" }
        notes: { type: string, description: Only with customers.read }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        version: { type: integer }

    ReleasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        next_cursor: { type: [string, "null"] }

    ReleaseCreate:
      type: object
      required: [allocation_id, from_night, to_night, source]
      properties:
        allocation_id: { type: string, maxLength: 36 }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        to_night: { $ref: "#/components/schemas/IsoDate" }
        source: { $ref: "#/components/schemas/ReleaseSource" }
        notes: { type: string, maxLength: 1000 }

    RevokeRequest:
      description: Without from_night/to_night the whole release is revoked
      type: object
      properties:
        from_night: { $ref: "#/components/schemas/IsoDate" }
        to_night: { $ref: "#/components/schemas/IsoDate" }

    RevokeResult:
      type: object
      required: [release, restored_nights]
      properties:
        release: { $ref: "#/components/schemas/Release" }
        restored_nights: { type: integer }
        remaining: { $ref: "#/components/schemas/Release" }

    ClosureScope:
      type: string
      enum: [marina, map, structure, group, resource]

    Closure:
      type: object
      required: [id, scope_type, from_date, to_date, reason, version]
      properties:
        id: { type: string }
        scope_type: { $ref: "#/components/schemas/ClosureScope" }
        scope_id: { type: string }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        from_date: { $ref: "#/components/schemas/IsoDate" }
        to_date: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string }
        version: { type: integer }

    ClosureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Closure" }

    ClosureCreate:
      description: scope_id is required except for scope marina; resource_type is required for scope resource
      type: object
      required: [scope_type, from_date, to_date, reason]
      properties:
        scope_type: { $ref: "#/components/schemas/ClosureScope" }
        scope_id: { type: string, maxLength: 36 }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        from_date: { $ref: "#/components/schemas/IsoDate" }
        to_date: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string, minLength: 1, maxLength: 200 }

    # ---- quotes, contracts, transits, inquiries ----

    QuoteStatus:
      type: string
      enum: [draft, sent, accepted, declined, expired]

    QuoteKind:
      type: string
      enum: [mooring, transit]

    ContractPolicy:
      description: Versioned contract policy (m3-plan §4.7); unknown keys are rejected
      type: object
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1] }
        reprice_on_move: { type: boolean }
        release_policy: { $ref: "#/components/schemas/ReleasePolicy" }
        allow_segments: { type: boolean }

    QuoteOptionInput:
      type: object
      required: [hold, placements]
      properties:
        label: { type: string, maxLength: 120 }
        hold: { type: boolean }
        placements:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/SegmentInput" }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    QuoteInput:
      type: object
      required: [kind, customer_id, vessel_id, starts_on, ends_on, options]
      properties:
        kind: { $ref: "#/components/schemas/QuoteKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        customer_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        valid_until: { $ref: "#/components/schemas/IsoDate" }
        channel: { type: string, enum: [desk, api] }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        notes: { type: string, maxLength: 4000 }
        inquiry_id: { type: string, maxLength: 36 }
        options:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/QuoteOptionInput" }

    QuotePlacement:
      type: object
      required: [seq, resource_type, resource_id, first_night, last_night]
      properties:
        seq: { type: integer }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        resource_code: { type: string }
        map_id: { type: string }
        x_cm: { $ref: "#/components/schemas/Cm" }
        y_cm: { $ref: "#/components/schemas/Cm" }
        rotation_dd: { $ref: "#/components/schemas/RotationDd" }
        first_night: { $ref: "#/components/schemas/IsoDate" }
        last_night: { $ref: "#/components/schemas/IsoDate" }
        allocation_id: { type: string, description: The hold, when the option holds and it is still active }

    QuoteOption:
      type: object
      required: [id, seq, label, hold, placements, total_cents, deposit_cents, engine_version]
      properties:
        id: { type: string }
        seq: { type: integer }
        label: { type: string }
        hold: { type: boolean }
        placements:
          type: array
          items: { $ref: "#/components/schemas/QuotePlacement" }
        price_list_id: { type: string }
        total_cents: { $ref: "#/components/schemas/Cents" }
        deposit_cents: { $ref: "#/components/schemas/Cents" }
        engine_version: { type: integer }
        breakdown: { $ref: "#/components/schemas/PriceBreakdown" }
        fit_override: { $ref: "#/components/schemas/FitOverride" }

    Quote:
      type: object
      required: [id, code, number, year, status, kind, customer, vessel, starts_on, ends_on, valid_until, expires_at,
                 channel, options, created_at, version]
      properties:
        id: { type: string }
        code: { type: string, description: PRV-2026-0001 }
        number: { type: integer, format: int64 }
        year: { type: integer }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        kind: { $ref: "#/components/schemas/QuoteKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        valid_until: { $ref: "#/components/schemas/IsoDate" }
        expires_at: { type: string, format: date-time }
        channel: { $ref: "#/components/schemas/Channel" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        notes: { type: string }
        inquiry_id: { type: string }
        accepted_option_id: { type: string }
        contract_id: { type: string }
        sent_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decline_reason: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuoteOption" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    QuoteSummary:
      type: object
      required: [id, code, status, kind, customer, vessel, starts_on, ends_on, valid_until, options_count, created_at, version]
      properties:
        id: { type: string }
        code: { type: string }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        kind: { $ref: "#/components/schemas/QuoteKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        valid_until: { $ref: "#/components/schemas/IsoDate" }
        options_count: { type: integer }
        min_total_cents: { $ref: "#/components/schemas/Cents" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    QuotePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QuoteSummary" }
        next_cursor: { type: [string, "null"] }

    ManualConfirmation:
      description: Manual driver confirmation (M3); the reference is free text, stored and never logged
      type: object
      properties:
        reference: { type: string, maxLength: 200 }
        pay_at_departure: { type: boolean }

    QuoteAccept:
      type: object
      required: [option_id]
      properties:
        option_id: { type: string, maxLength: 36 }
        activate: { type: boolean, description: Mooring quotes create an active contract instead of a draft }
        confirm: { $ref: "#/components/schemas/ManualConfirmation" }

    QuoteAcceptResult:
      type: object
      required: [quote, contract]
      properties:
        quote: { $ref: "#/components/schemas/Quote" }
        contract: { $ref: "#/components/schemas/Contract" }

    ReasonInput:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    ContractLineKind:
      type: string
      enum: [resource, service]

    ContractLine:
      type: object
      required: [id, seq, line_kind, qty_milli, amount_cents]
      properties:
        id: { type: string }
        seq: { type: integer }
        line_kind: { $ref: "#/components/schemas/ContractLineKind" }
        item_id: { type: string }
        resource_type: { $ref: "#/components/schemas/ResourceType" }
        resource_id: { type: string }
        resource_code: { type: string }
        qty_milli: { $ref: "#/components/schemas/QtyMilli" }
        amount_cents: { $ref: "#/components/schemas/Cents" }

    PresenceEvent:
      type: string
      enum: [arrived, departed, hauled_out, launched]

    PresenceSource:
      type: string
      enum: [staff, sensor, customer]

    Presence:
      type: object
      required: [id, vessel, event, at, night, source, has_photo]
      properties:
        id: { type: string }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        allocation_id: { type: string }
        contract_id: { type: string }
        event: { $ref: "#/components/schemas/PresenceEvent" }
        at: { type: string, format: date-time }
        night: { $ref: "#/components/schemas/IsoDate" }
        source: { $ref: "#/components/schemas/PresenceSource" }
        user_id: { type: string }
        notes: { type: string, description: Only with customers.read }
        has_photo: { type: boolean }

    Contract:
      description: A mooring contract or a transit
      type: object
      required: [id, code, kind, number, year, status, vessel, starts_on, ends_on, channel, total_cents, deposit_cents,
                 engine_version, hold_lost, signed_on_paper, pay_at_departure, lines, allocations, releases, presences,
                 created_at, version]
      properties:
        id: { type: string }
        code: { type: string, description: "ORM-2026-0001, TRN-2026-0001" }
        kind: { $ref: "#/components/schemas/ContractKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        number: { type: integer, format: int64 }
        year: { type: integer }
        status: { $ref: "#/components/schemas/ContractStatus" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        billing_customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        channel: { $ref: "#/components/schemas/Channel" }
        quote_id: { type: string }
        price_list_id: { type: string }
        total_cents: { $ref: "#/components/schemas/Cents" }
        deposit_cents: { $ref: "#/components/schemas/Cents" }
        engine_version: { type: integer }
        breakdown: { $ref: "#/components/schemas/PriceBreakdown" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        expected_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        expected_departure_time: { $ref: "#/components/schemas/LocalTime" }
        notes: { type: string }
        hold_lost: { type: boolean }
        hold_expires_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        signed_on_paper: { type: boolean }
        confirmed_at: { type: string, format: date-time }
        confirmation_source: { type: string, enum: [manual, provider] }
        confirmation_ref: { type: string, description: Only with contracts.write or transits.desk }
        pay_at_departure: { type: boolean }
        cancelled_at: { type: string, format: date-time }
        cancel_reason: { type: string }
        terminated_on: { $ref: "#/components/schemas/IsoDate" }
        terminate_reason: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ContractLine" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        presences:
          type: array
          items: { $ref: "#/components/schemas/Presence" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ContractSummary:
      type: object
      required: [id, code, kind, status, vessel, starts_on, ends_on, total_cents, hold_lost, resources, created_at, version]
      properties:
        id: { type: string }
        code: { type: string }
        kind: { $ref: "#/components/schemas/ContractKind" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        total_cents: { $ref: "#/components/schemas/Cents" }
        hold_lost: { type: boolean }
        hold_expires_at: { type: string, format: date-time }
        resources:
          description: Current resources of the resource lines
          type: array
          items:
            type: object
            required: [resource_type, resource_id, code]
            properties:
              resource_type: { $ref: "#/components/schemas/ResourceType" }
              resource_id: { type: string }
              code: { type: string }
              map_id: { type: string }
        presence_state: { $ref: "#/components/schemas/PresenceState" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ContractPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContractSummary" }
        next_cursor: { type: [string, "null"] }

    ExtraResource:
      type: object
      required: [land_resource_id]
      properties:
        land_resource_id: { type: string, maxLength: 36 }
        item_id: { type: string, maxLength: 36 }

    ContractCreate:
      description: ends_on defaults by term (annual +1 year, seasonal the season end of the active seasonal list, monthly +1 month; period requires it)
      type: object
      required: [term, customer_id, vessel_id, starts_on, placements]
      properties:
        term: { $ref: "#/components/schemas/ContractTerm" }
        customer_id: { type: string, maxLength: 36 }
        billing_customer_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        placements:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SegmentInput" }
        extra_resources:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ExtraResource" }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        notes: { type: string, maxLength: 4000 }
        activate: { type: boolean }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    ContractPatch:
      type: object
      properties:
        notes: { type: string, maxLength: 4000 }
        billing_customer_id: { type: [string, "null"], maxLength: 36 }
        policy: { $ref: "#/components/schemas/ContractPolicy" }

    TerminateInput:
      type: object
      required: [effective_on, reason]
      properties:
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    NewVesselInput:
      description: A vessel created on the spot with declared (estimated) dimensions
      type: object
      required: [name, loa_cm, beam_cm, hull_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        hull_type: { $ref: "#/components/schemas/HullType" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }

    TransitCreate:
      description: vessel_id or new_vessel; placements, or solution_key with the search_request that produced it
      type: object
      required: [arrival, departure]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        new_vessel: { $ref: "#/components/schemas/NewVesselInput" }
        customer_id: { type: string, maxLength: 36 }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        placements:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SegmentInput" }
        solution_key: { type: string, maxLength: 512 }
        search_request: { $ref: "#/components/schemas/OccupancySearchRequest" }
        channel: { type: string, enum: [desk, api] }
        expected_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        notes: { type: string, maxLength: 4000 }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }
        confirm: { $ref: "#/components/schemas/ManualConfirmation" }
        inquiry_id: { type: string, maxLength: 36 }

    StayChange:
      type: object
      properties:
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        extension_target: { $ref: "#/components/schemas/PlacementInput" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    StayChangeResult:
      type: object
      required: [contract, price_effect]
      properties:
        contract: { $ref: "#/components/schemas/Contract" }
        price_effect: { $ref: "#/components/schemas/PriceEffect" }

    TransitPatch:
      type: object
      properties:
        customer_id: { type: [string, "null"], maxLength: 36 }
        notes: { type: string, maxLength: 4000 }
        expected_arrival_time: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        expected_departure_time: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }

    InquiryOutcome:
      type: string
      enum: [open, quoted, booked, declined_no_space, declined_size, declined_other, lost]

    InquirySource:
      type: string
      enum: [phone, email, desk, public, channel]

    Inquiry:
      type: object
      required: [id, channel, source, purpose, loa_cm, beam_cm, arrival, departure, outcome, created_at, version]
      properties:
        id: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        source: { $ref: "#/components/schemas/InquirySource" }
        purpose: { $ref: "#/components/schemas/SearchPurpose" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        loa_cm: { $ref: "#/components/schemas/Cm" }
        beam_cm: { $ref: "#/components/schemas/Cm" }
        draft_cm: { $ref: "#/components/schemas/Cm" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        quote_id: { type: string }
        contract_id: { type: string }
        notes: { type: string, description: Only with customers.read }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    InquiryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Inquiry" }
        next_cursor: { type: [string, "null"] }

    InquiryCreate:
      description: vessel_id or loa_cm and beam_cm
      type: object
      required: [purpose, source, arrival, departure]
      properties:
        purpose: { $ref: "#/components/schemas/SearchPurpose" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        source: { $ref: "#/components/schemas/InquirySource" }
        channel: { $ref: "#/components/schemas/Channel" }
        vessel_id: { type: string, maxLength: 36 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        customer_id: { type: string, maxLength: 36 }
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        notes: { type: string, maxLength: 4000 }

    InquiryPatch:
      type: object
      properties:
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        quote_id: { type: [string, "null"], maxLength: 36 }
        contract_id: { type: [string, "null"], maxLength: 36 }
        notes: { type: string, maxLength: 4000 }

    # ---- presences ----

    PresencePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Presence" }
        next_cursor: { type: [string, "null"] }

    PresenceCreate:
      type: object
      required: [vessel_id, event]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        event: { $ref: "#/components/schemas/PresenceEvent" }
        at: { type: string, format: date-time }
        allocation_id: { type: string, maxLength: 36 }
        notes: { type: string, maxLength: 1000 }
        expected_return_on: { $ref: "#/components/schemas/IsoDate" }

    PresenceResult:
      type: object
      required: [presence]
      properties:
        presence: { $ref: "#/components/schemas/Presence" }
        contract: { $ref: "#/components/schemas/Contract" }

    UnexpectedArrival:
      description: vessel_id or new_vessel; departure defaults to the next day
      type: object
      required: [target]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        new_vessel: { $ref: "#/components/schemas/NewVesselInput" }
        target: { $ref: "#/components/schemas/PlacementInput" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        notes: { type: string, maxLength: 1000 }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    PresencePhoto:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string }

    FileLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }

    MovementResource:
      type: object
      required: [type, id, code]
      properties:
        type: { $ref: "#/components/schemas/ResourceType" }
        id: { type: string }
        code: { type: string }
        map_id: { type: string }

    Movement:
      type: object
      required: [vessel]
      properties:
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        contract: { $ref: "#/components/schemas/ContractBrief" }
        resource: { $ref: "#/components/schemas/MovementResource" }
        expected_time: { $ref: "#/components/schemas/LocalTime" }
        presence_id: { type: string }
        allocation_id: { type: string }

    Movements:
      type: object
      required: [date, arrivals_expected, departures_expected, vessels_out, arrived_without_booking, arrived, departed]
      properties:
        date: { $ref: "#/components/schemas/IsoDate" }
        arrivals_expected:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        departures_expected:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        vessels_out:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        arrived_without_booking:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        arrived:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        departed:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
