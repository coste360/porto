    Document:
      type: object
      required: [id, owner_type, customer_id, vessel_id, type, number, issuer, issued_on, expires_on, has_file, file_name, content_type, size_bytes, notes, version, created_at, updated_at]
      properties:
        id: { type: string }
        owner_type: { $ref: "#/components/schemas/DocumentOwnerType" }
        customer_id: { type: [string, "null"] }
        vessel_id: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/DocumentType" }
        number: { type: [string, "null"], description: Decrypted document number }
        issuer: { type: [string, "null"] }
        issued_on: { type: [string, "null"], format: date, x-go-type: string }
        expires_on: { type: [string, "null"], format: date, x-go-type: string }
        has_file: { type: boolean }
        file_name: { type: [string, "null"] }
        content_type: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"], format: int64 }
        notes: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor: { type: [string, "null"] }

    DocumentInput:
      type: object
      required: [owner_type, type]
      properties:
        owner_type: { $ref: "#/components/schemas/DocumentOwnerType" }
        customer_id: { type: string }
        vessel_id: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        number: { type: string, maxLength: 64 }
        issuer: { type: string, maxLength: 200 }
        issued_on: { type: string, format: date, x-go-type: string }
        expires_on: { type: string, format: date, x-go-type: string }
        notes: { type: string, maxLength: 4000 }

    DocumentPatch:
      description: Partial update; null clears a nullable field (clearing expires_on removes the deadline)
      type: object
      properties:
        type: { $ref: "#/components/schemas/DocumentType" }
        number: { type: [string, "null"], maxLength: 64 }
        issuer: { type: [string, "null"], maxLength: 200 }
        issued_on: { type: [string, "null"], format: date, x-go-type: string }
        expires_on: { type: [string, "null"], format: date, x-go-type: string }
        notes: { type: string, maxLength: 4000 }

    DocumentFileUrl:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }

    DeadlineStatus:
      type: string
      enum: [open, done, dismissed]

    DeadlineUrgency:
      type: string
      enum: [overdue, due_soon, later]

    DeadlineKind:
      description: M1 kinds (from document types); later milestones add more
      type: string
      enum:
        - identity_document
        - boating_licence
        - navigation_licence
        - registration_certificate
        - insurance
        - safety_certificate
        - power_declaration
        - other_document

    DeadlineSourceType:
      type: string
      enum: [document]

    CustomerRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }

    VesselRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Deadline:
      type: object
      required: [id, kind, source_type, source_id, customer, vessel, document_type, due_on, status, urgency, note, version]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/DeadlineKind" }
        source_type: { $ref: "#/components/schemas/DeadlineSourceType" }
        source_id: { type: string }
        customer:
          oneOf:
            - $ref: "#/components/schemas/CustomerRef"
            - type: "null"
        vessel:
          oneOf:
            - $ref: "#/components/schemas/VesselRef"
            - type: "null"
        document_type:
          oneOf:
            - $ref: "#/components/schemas/DocumentType"
            - type: "null"
        due_on: { type: string, format: date, x-go-type: string }
        status: { $ref: "#/components/schemas/DeadlineStatus" }
        urgency: { $ref: "#/components/schemas/DeadlineUrgency" }
        note: { type: string }
        version: { type: integer }

    DeadlinePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        next_cursor: { type: [string, "null"] }

    DeadlinePatch:
      type: object
      properties:
        status: { $ref: "#/components/schemas/DeadlineStatus" }
        note: { type: string, maxLength: 1000 }

    DeadlinePolicy:
      type: object
      required: [kind, lead_days]
      properties:
        kind: { $ref: "#/components/schemas/DeadlineKind" }
        lead_days:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: integer, minimum: 1, maximum: 730 }

    DeadlinePolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DeadlinePolicy" }
