        - { name: channel, in: query, required: false, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: customer_category, in: query, required: false, schema: { $ref: "#/components/schemas/CustomerCategory" } }
        - { name: quoted_on, in: query, required: false, description: Default today in the marina timezone, schema: { type: string, format: date, x-go-type: string } }
      responses:
        "200":
