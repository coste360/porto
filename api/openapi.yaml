      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/device/v1/self:
    get:
      tags: [device]
      operationId: getDeviceSelf
      summary: The calling device, its user, marina and permissions
      security:
        - deviceAuth: []
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSelf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [device]
      operationId: unpairDeviceSelf
      summary: Revoke the calling device's token
      security:
        - deviceAuth: []
      responses:
        "204": { description: Unpaired }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/device/v1/pair-session:
    post:
      tags: [device]
      operationId: pairDeviceSession
      summary: Exchange a pairing code for a browser device session (QR on the local network, M6a)
      description: |
        Same single-use consumption as `pairDevice`. Creates a device with `access: browser` bound to a device
        session (idle 30 days, absolute 180 days) and sets the `porto_session` and `porto_csrf` cookies; no token is
        returned. Rate limited like `pairDevice` (10 per minute per peer). No `Idempotency-Key`: the code is single
        use and the response carries a credential that must never be replayed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairSessionRequest" }
      responses:
        "201":
          description: Paired; session cookies set
          headers:
            Set-Cookie:
              description: porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairSessionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/device/v1/pair-session/totp:
    post:
      tags: [device]
      operationId: verifyDeviceSessionTotp
      summary: Verify the second factor of a browser device session (QR pairing of a user with TOTP, M6a)
      description: |
        A user with a confirmed second factor who pairs a phone with `pairDeviceSession` gets a session that is
        unusable (`totp_required: true` in the result) until a TOTP code (accepted once) or a recovery code is
        entered on the phone. Uses the `porto_session` cookie set by `pairDeviceSession`; 401 `unauthorized` when
        it is not a live device session. The pending session lives 10 minutes only; on success it is replaced by a
        new device session (rotated `porto_session` and `porto_csrf` cookies, the pending token stops working).
        Throttled like a login (5 failures per user in 15 minutes) and rate limited per peer like
        `pairDeviceSession`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSessionTotpRequest" }
      responses:
        "204":
          description: Second factor verified; the device session is replaced by a usable one
          headers:
            Set-Cookie:
              description: rotated porto_session and porto_csrf cookies
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/device/v1/fiscal/claim:
    post:
      tags: [device]
      operationId: claimFiscalDocuments
      summary: Claim pending documents of the bridge fiscal driver for issuing on the desktop's local device (M6b)
      description: |
        Only the device set as `fiscal_bridge_device_id` in the billing settings of its marina (a `kind: desktop`,
        `access: token` device) may claim; any other device is 403. Each returned document carries a `claim_id`
        valid for 60 seconds (`claim_until`); a document is claimed by at most one caller at a time (INV-86). No
        `Idempotency-Key`: every call is a new claim.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiscalClaimRequest" }
      responses:
        "200":
          description: Claimed documents (possibly none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalClaim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/device/v1/fiscal/documents/{documentId}/outcome:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, maxLength: 36 }
    post:
      tags: [device]
      operationId: reportFiscalOutcome
      summary: Report the outcome of a claimed bridge document (issued, failed or deferred) (M6b)
      description: |
        `Idempotency-Key` = `<documentId>:<claim_id>`. A stale or foreign claim is 409 `claim_expired`; `issued`
        follows the immutability of issued documents. `deferred` releases the claim and keeps the document pending.
      security:
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiscalOutcome" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/desktop/v1/status:
    get:
      tags: [desktop]
      operationId: getDesktopStatus
      summary: Desktop edition status for the app window (loopback only, no authentication)
      description: |
        Every `/api/desktop/v1` operation answers only on the desktop loopback listener, from a loopback peer, with
        an allowed `Host`; elsewhere (server edition, local network) it is 404 `not_found` (INV-80).
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/desktop/v1/first-run:
    post:
      tags: [desktop]
      operationId: desktopFirstRun
      summary: Create the first owner and organization from the app window (single-use first-run token)
      description: Sets the `porto_session` and `porto_csrf` cookies. The marina is created afterwards by the panel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopFirstRunRequest" }
      responses:
        "201":
          description: Owner created; session cookies set
          headers:
            Set-Cookie:
              description: porto_session and porto_csrf cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopFirstRunResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/desktop/v1/first-run/restore:
    post:
      tags: [desktop]
      operationId: desktopFirstRunRestore
      summary: Restore a backup instead of creating the owner on the first run (first-run token in a header)
      description: |
        Raw `.tar.gz` body streamed to disk (limit 4 GiB, `x-porto-max-stream-bytes`). Refused (409
        first_run_done) once an owner exists. The first-run token is consumed only when the restore is prepared:
        a corrupt archive (422) leaves it usable. 202: the server restarts on the restored database; everybody
        logs in again.
      security: []
      x-porto-max-stream-bytes: 4294967296
      parameters:
        - $ref: "#/components/parameters/FirstRunToken"
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "202": { description: Restore scheduled; the server restarts }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/desktop/v1/settings:
    get:
      tags: [desktop]
      operationId: getDesktopSettings
      summary: Desktop settings (owner, loopback)
      security: &desktopReadSecurity
        - cookieAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [desktop]
      operationId: updateDesktopSettings
      summary: Change desktop settings (owner, loopback); the local network is switched with PUT /lan
      security: &desktopWriteSecurity
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopSettingsPatch" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/desktop/v1/lan:
    get:
      tags: [desktop]
      operationId: getDesktopLan
      summary: Local-network listener status (owner, loopback)
      security: *desktopReadSecurity
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [desktop]
      operationId: setDesktopLan
      summary: Switch the local network on or off (owner, loopback); the listener exists only while on
      security: *desktopWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanUpdate" }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/desktop/v1/lan/certificate:
    post:
      tags: [desktop]
      operationId: rotateLanCertificate
      summary: Re-issue the local-network certificate (all=true also regenerates the local CA) (owner, loopback)
      security: *desktopWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanCertificateRotate" }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/desktop/v1/backups:
    get:
      tags: [desktop]
      operationId: listDesktopBackups
      summary: Backups in the backup folder and the scheduler status (owner, loopback)
      security: *desktopReadSecurity
      responses:
        "200":
          description: Backups, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopBackupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [desktop]
      operationId: createDesktopBackup
      summary: Take a manual backup now (owner, loopback)
      security: *desktopWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Backup written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopBackupFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/desktop/v1/backups/{backupId}/restore:
    parameters:
      - name: backupId
        in: path
        required: true
        description: File name of the backup (porto-YYYYMMDD-HHMMSS-<kind>.tar.gz)
        schema: { type: string, maxLength: 128 }
    post:
      tags: [desktop]
      operationId: restoreDesktopBackup
      summary: Restore a listed backup after a pre-restore safety backup; the server restarts (owner, loopback)
      security: *desktopWriteSecurity
      responses:
        "202": { description: Restore scheduled; the server restarts }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/desktop/v1/restore-upload:
    post:
      tags: [desktop]
      operationId: uploadDesktopRestore
      summary: Restore an uploaded backup archive (owner, loopback); the server restarts
      description: Raw `.tar.gz` body streamed to disk (limit 4 GiB, `x-porto-max-stream-bytes`).
      security: *desktopWriteSecurity
      x-porto-max-stream-bytes: 4294967296
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "202": { description: Restore scheduled; the server restarts }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/desktop/v1/secret-key/reveal:
    post:
      tags: [desktop]
      operationId: revealDesktopSecretKey
      summary: Show the secret key once, after re-entering the password (owner, loopback; 5 per 15 minutes)
      security: *desktopWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopSecretRevealRequest" }
      responses:
        "200":
          description: The secret key (never logged, never stored by the panel)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopSecretKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/desktop/v1/open:
    post:
      tags: [desktop]
      operationId: openDesktopFolder
      summary: Open a fixed folder (data, backups, logs) with the operating system (owner, loopback)
      security: *desktopWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopOpenRequest" }
      responses:
        "204": { description: Opened }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/desktop/v1/activate:
    post:
      tags: [desktop]
      operationId: activateDesktop
      summary: Bring the running app window to the front (second launch on the same data folder)
      description: Authenticated by the instance token of the running process (header `Porto-Instance-Token`).
      security:
        - instanceToken: []
      responses:
        "204": { description: Activated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/desktop/v1/remote/pair:
    post:
      tags: [desktop]
      operationId: pairDesktopRemote
      summary: Pair this app to an online Porto instance on the first run and restart in remote mode (M6b)
      description: |
        Local mode, first run only (first-run token in the body; 409 `first_run_done` once the local instance has
        users or the app is already paired). The app calls `pairDevice` on the remote instance (`kind: desktop`)
        with the TLS policy of the payload (`fp` = pinned leaf, then its CA; no `fp` = system roots; `http` only
        in development), stores the device token in the OS secret store (never in the page or in desktop.json),
        sets the app PIN and restarts in remote mode (202).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopRemotePairRequest" }
      responses:
        "202": { description: Paired; the app restarts in remote mode }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/desktop/v1/remote:
    delete:
      tags: [desktop]
      operationId: unpairDesktopRemote
      summary: Unpair the app from the online instance and go back to the first run (remote mode, app PIN) (M6b)
      description: |
        Revokes the device on the remote instance (best effort), deletes the token, the shell cache and the remote
        settings. Answered by the remote proxy only (404 on a Porto server).
      security:
        - appPin: []
      responses:
        "202": { description: Unpaired; the app restarts on the first run }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/desktop/v1/peripherals:
    get:
      tags: [desktop]
      operationId: getDesktopPeripherals
      summary: Peripheral settings of this app (local mode owner; remote mode any proxy user) (M6b)
      security:
        - cookieAuth: []
        - remoteCookie: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeripheralSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [desktop]
      operationId: updateDesktopPeripherals
      summary: Change the peripheral settings (local mode owner; remote mode app PIN) (M6b)
      security:
        - cookieAuth: []
          csrfToken: []
        - appPin: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeripheralSettings" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeripheralSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/desktop/v1/kiosk:
    put:
      tags: [desktop]
      operationId: setDesktopKiosk
      summary: Switch kiosk mode for the next launch (local mode owner; remote mode app PIN) (M6b)
      security:
        - cookieAuth: []
          csrfToken: []
        - appPin: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopKioskUpdate" }
      responses:
        "200":
          description: Kiosk setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopKioskUpdate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/desktop/v1/kiosk/exit:
    post:
      tags: [desktop]
      operationId: exitDesktopKiosk
      summary: Leave kiosk mode until the next launch (local mode owner credentials; remote mode app PIN) (M6b)
      description: |
        Local mode: any signed-in user of the window plus the email and password of an owner in the body (the
        front desk user is usually not an owner); remote mode: `Porto-App-Pin`. 5 failures per 15 minutes, then
        429; never logged.
      security:
        - cookieAuth: []
          csrfToken: []
        - appPin: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopKioskExit" }
      responses:
        "204": { description: Kiosk left }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/desktop/v1/dev/remote-offline:
    post:
      tags: [desktop]
      operationId: setDesktopRemoteOffline
      summary: Make the remote proxy behave as if the online instance were unreachable (PORTO_DEV only, e2e) (M6b)
      security:
        - remoteCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopRemoteOffline" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bridge/v1/status:
    get:
      tags: [bridge]
      operationId: getBridgeStatus
      summary: Status of the local peripherals (any authenticated user of the app window) (M6b)
      description: |
        Every `/api/bridge/v1` operation answers only on the desktop loopback listener (local mode, session
        cookie, the user's permissions) or on the remote proxy (remote mode, `porto_remote` cookie, the device
        user's permissions); elsewhere 404 (INV-85).
      security:
        - cookieAuth: []
        - remoteCookie: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bridge/v1/receipts:
    post:
      tags: [bridge]
      operationId: printBridgeReceipt
      summary: Print the courtesy receipt of a payment on the local receipt printer (payments.collect or payments.collect_cash) (M6b)
      security:
        - cookieAuth: []
          csrfToken: []
        - remoteCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BridgeReceiptRequest" }
      responses:
        "202": { description: Sent to the printer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/bridge/v1/test:
    post:
      tags: [bridge]
      operationId: testBridgePeripheral
      summary: Print a test page or check the local fiscal device (local mode owner; remote mode app PIN) (M6b)
      security:
        - cookieAuth: []
          csrfToken: []
        - appPin: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BridgeTestRequest" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/bridge/v1/scanner/next:
    get:
      tags: [bridge]
      operationId: nextBridgeScan
      summary: Wait for the next scan of a local QR reader driver (long poll, at most 25 seconds) (M6b)
      security:
        - cookieAuth: []
        - remoteCookie: []
      parameters:
        - { name: timeout, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 25 } }
      responses:
        "200":
          description: A scan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BridgeScan" }
        "204": { description: No scan before the timeout }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/v1/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, maxLength: 63 }
    get:
      tags: [public]
      operationId: getPublicMarina
      summary: Public information of a marina
      security: []
      responses:
        "200":
          description: Public marina
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMarina" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------------------------------------------
  # M1 harbour (spec 07, 08; m1-plan §4.3). Map writes need harbor.configure, reads map.view.
  # ---------------------------------------------------------------------------------------------------------------
  /api/admin/v1/marinas/{marinaId}/maps:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    get:
      tags: [maps]
      operationId: listMaps
      summary: Maps of the marina, by sort order (map.view)
      security: *readSecurity
      responses:
        "200":
          description: Maps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapSummaryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [maps]
      operationId: createMap
      summary: Create an empty map (harbor.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapCreate" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/admin/v1/marinas/{marinaId}/maps/reorder:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [maps]
      operationId: reorderMaps
      summary: Set the order of the marina's maps; every map id exactly once (harbor.configure)
      security: *writeSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapReorder" }
      responses:
        "204": { description: Reordered }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/maps/import:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
    post:
      tags: [maps]
      operationId: importMap
      summary: Import a map export (porto-map/1) as a new map; ids are remapped (harbor.configure)
      security: *writeSecurity
      x-porto-max-body-bytes: 8388608
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapExport" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/MapInvalid" }

  /api/admin/v1/marinas/{marinaId}/maps/{mapId}:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      operationId: getMap
      summary: The full map document (map.view)
      security: *readSecurity
      responses:
        "200":
          description: Map document
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [maps]
      operationId: saveMap
      summary: >-
        Replace the whole map document (meta and every element) in one transaction; new elements carry a key,
        saved ones their id. Validated with ValidateMap inside the transaction (harbor.configure)
      security: *writeSecurity
      x-porto-max-body-bytes: 8388608
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapSaveRequest" }
      responses:
        "200":
          description: Saved
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapSaveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/MapInvalid" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [maps]
      operationId: deleteMap
      summary: Delete a map without berths, dynamic areas or land resources (harbor.configure)
      security: *writeSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted }
