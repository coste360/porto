      required: [id, number, kind, method, source, amount_cents, allocated_cents, refunded_cents, unallocated_cents, fee_cents, currency, received_on, version]
      properties:
        id: { type: string }
        number: { type: string, description: "P{yyyy}-{n:06}, an internal reference" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        kind: { $ref: "#/components/schemas/PaymentKind" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        source: { $ref: "#/components/schemas/PaymentSource" }
        provider_code: { type: string }
        amount_cents: { $ref: "#/components/schemas/Cents" }
        allocated_cents: { $ref: "#/components/schemas/Cents" }
        refunded_cents: { $ref: "#/components/schemas/Cents" }
        unallocated_cents: { $ref: "#/components/schemas/Cents" }
        fee_cents: { $ref: "#/components/schemas/Cents" }
        currency: { type: string }
        received_on: { $ref: "#/components/schemas/IsoDate" }
        cash_session_id: { type: string }
        has_reference: { type: boolean, description: The staff reference is stored encrypted and never returned in lists }
        notes: { type: string }
        vat_split: { type: array, items: { $ref: "#/components/schemas/VatBucket" } }
        matches: { type: array, items: { $ref: "#/components/schemas/PaymentMatch" } }
        refunds: { type: array, items: { $ref: "#/components/schemas/Refund" } }
        fiscal_documents: { type: array, items: { $ref: "#/components/schemas/FiscalDocument" } }
        created_at: { type: string, format: date-time }
        version: { type: integer }

