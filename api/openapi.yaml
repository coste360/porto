            required: [resource_type, resource_id, code]
            properties:
              resource_type: { $ref: "#/components/schemas/ResourceType" }
              resource_id: { type: string }
              code: { type: string }
              map_id: { type: string }
        presence_state: { $ref: "#/components/schemas/PresenceState" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ContractPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContractSummary" }
        next_cursor: { type: [string, "null"] }

    ExtraResource:
      type: object
      required: [land_resource_id]
      properties:
        land_resource_id: { type: string, maxLength: 36 }
        item_id: { type: string, maxLength: 36 }

    ContractCreate:
      description: ends_on defaults by term (annual +1 year, seasonal the season end of the active seasonal list, monthly +1 month; period requires it)
      type: object
      required: [term, customer_id, vessel_id, starts_on, placements]
      properties:
        term: { $ref: "#/components/schemas/ContractTerm" }
        customer_id: { type: string, maxLength: 36 }
        billing_customer_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        placements:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SegmentInput" }
        extra_resources:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ExtraResource" }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        notes: { type: string, maxLength: 4000 }
        activate: { type: boolean }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    ContractPatch:
      type: object
      properties:
        notes: { type: string, maxLength: 4000 }
        billing_customer_id: { type: [string, "null"], maxLength: 36 }
        policy: { $ref: "#/components/schemas/ContractPolicy" }

    TerminateInput:
      type: object
      required: [effective_on, reason]
      properties:
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    NewVesselInput:
      description: A vessel created on the spot with declared (estimated) dimensions
      type: object
      required: [name, loa_cm, beam_cm, hull_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        hull_type: { $ref: "#/components/schemas/HullType" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }

    TransitCreate:
      description: vessel_id or new_vessel; placements, or solution_key with the search_request that produced it
      type: object
      required: [arrival, departure]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        new_vessel: { $ref: "#/components/schemas/NewVesselInput" }
        customer_id: { type: string, maxLength: 36 }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        placements:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SegmentInput" }
        solution_key: { type: string, maxLength: 512 }
        search_request: { $ref: "#/components/schemas/OccupancySearchRequest" }
        channel: { type: string, enum: [desk, api] }
        expected_arrival_time: { $ref: "#/components/schemas/LocalTime" }
        notes: { type: string, maxLength: 4000 }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }
        confirm: { $ref: "#/components/schemas/ManualConfirmation" }
        inquiry_id: { type: string, maxLength: 36 }

    StayChange:
      type: object
      properties:
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        extension_target: { $ref: "#/components/schemas/PlacementInput" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    StayChangeResult:
      type: object
      required: [contract, price_effect]
      properties:
        contract: { $ref: "#/components/schemas/Contract" }
        price_effect: { $ref: "#/components/schemas/PriceEffect" }

    TransitPatch:
      type: object
      properties:
        customer_id: { type: [string, "null"], maxLength: 36 }
        notes: { type: string, maxLength: 4000 }
        expected_arrival_time: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        expected_departure_time: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }

    InquiryOutcome:
      type: string
      enum: [open, quoted, booked, declined_no_space, declined_size, declined_other, lost]

    InquirySource:
      type: string
      enum: [phone, email, desk, public, channel]

    Inquiry:
      type: object
      required: [id, channel, source, purpose, loa_cm, beam_cm, arrival, departure, outcome, created_at, version]
      properties:
        id: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        source: { $ref: "#/components/schemas/InquirySource" }
        purpose: { $ref: "#/components/schemas/SearchPurpose" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        loa_cm: { $ref: "#/components/schemas/Cm" }
        beam_cm: { $ref: "#/components/schemas/Cm" }
        draft_cm: { $ref: "#/components/schemas/Cm" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        quote_id: { type: string }
        contract_id: { type: string }
        notes: { type: string, description: Only with customers.read }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    InquiryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Inquiry" }
        next_cursor: { type: [string, "null"] }

    InquiryCreate:
      description: vessel_id or loa_cm and beam_cm
      type: object
      required: [purpose, source, arrival, departure]
      properties:
        purpose: { $ref: "#/components/schemas/SearchPurpose" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        source: { $ref: "#/components/schemas/InquirySource" }
        channel: { $ref: "#/components/schemas/Channel" }
        vessel_id: { type: string, maxLength: 36 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        arrival: { $ref: "#/components/schemas/IsoDate" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        customer_id: { type: string, maxLength: 36 }
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        notes: { type: string, maxLength: 4000 }

    InquiryPatch:
      type: object
      properties:
        outcome: { $ref: "#/components/schemas/InquiryOutcome" }
        quote_id: { type: [string, "null"], maxLength: 36 }
        contract_id: { type: [string, "null"], maxLength: 36 }
        notes: { type: string, maxLength: 4000 }

    # ---- presences ----

    PresencePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Presence" }
        next_cursor: { type: [string, "null"] }

    PresenceCreate:
      type: object
      required: [vessel_id, event]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        event: { $ref: "#/components/schemas/PresenceEvent" }
        at: { type: string, format: date-time }
        allocation_id: { type: string, maxLength: 36 }
        expected_resource_id:
          type: string
          maxLength: 36
          description: >-
            The resource the operator saw for the allocation (M6b, with allocation_id): a different current
            resource is 409 allocation_changed.
        notes: { type: string, maxLength: 1000 }
        expected_return_on: { $ref: "#/components/schemas/IsoDate" }

    PresenceResult:
      type: object
      required: [presence]
      properties:
        presence: { $ref: "#/components/schemas/Presence" }
        contract: { $ref: "#/components/schemas/Contract" }

    UnexpectedArrival:
      description: vessel_id or new_vessel; departure defaults to the next day
      type: object
      required: [target]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        new_vessel: { $ref: "#/components/schemas/NewVesselInput" }
        target: { $ref: "#/components/schemas/PlacementInput" }
        departure: { $ref: "#/components/schemas/IsoDate" }
        notes: { type: string, maxLength: 1000 }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    PresencePhoto:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string }

    FileLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }

    MovementResource:
      type: object
      required: [type, id, code]
      properties:
        type: { $ref: "#/components/schemas/ResourceType" }
        id: { type: string }
        code: { type: string }
        map_id: { type: string }

    Movement:
      type: object
      required: [vessel]
      properties:
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        contract: { $ref: "#/components/schemas/ContractBrief" }
        resource: { $ref: "#/components/schemas/MovementResource" }
        expected_time: { $ref: "#/components/schemas/LocalTime" }
        presence_id: { type: string }
        allocation_id: { type: string }

    Movements:
      type: object
      required: [date, arrivals_expected, departures_expected, vessels_out, arrived_without_booking, arrived, departed]
      properties:
        date: { $ref: "#/components/schemas/IsoDate" }
        arrivals_expected:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        departures_expected:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        vessels_out:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        arrived_without_booking:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        arrived:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        departed:
          type: array
          items: { $ref: "#/components/schemas/Movement" }

    # ---- M4 shared ----

    IdList:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, maxLength: 36 }

    ReasonRequired:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    WriteWarning:
      description: Non-blocking warning of a write (insurance_missing, transfer_requirements, ...)
      type: string
      enum: [insurance_missing, transfer_requirements, hold_lost, berth_unavailable]

    CsvText:
      description: CSV text (UTF-8, `;` or `,`), at most 5 000 rows
      type: string
      maxLength: 4194304

    PlanChoice:
      type: string
      enum: [standard, early_payment]

    SignatureDriver:
      type: string
      enum: [paper, otp, provider]

    InsurancePolicy:
      type: string
      enum: [warn, block]

    SettlementMethod:
      type: string
      enum: [bank_transfer, cash, card_pos, cheque, other]

    SettlementSource:
      type: string
      enum: [manual, payment]

    InstallmentKind:
      type: string
      enum: [deposit, installment, single]

    InstallmentStatus:
      type: string
      enum: [scheduled, issued, partially_paid, paid, cancelled]

    InstallmentFilterStatus:
      description: An instalment status, or overdue (issued and due before today)
      type: string
      enum: [scheduled, issued, partially_paid, paid, cancelled, overdue]

    # ---- payment policy (contract policy v2, m4-plan §3.3) ----

    PaymentDeposit:
      description: Deposit at signature, a share (bp, half-even) or a fixed amount (at most the total)
      type: object
      additionalProperties: false
      properties:
        bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        cents: { type: integer, format: int64, minimum: 0 }

    FixedDue:
      type: object
      required: [due_on, bp]
      additionalProperties: false
      properties:
        due_on: { type: string, description: "MM-DD (rolled into the contract period) or YYYY-MM-DD", maxLength: 10 }
        bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }

    PaymentSchedule:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [fixed_dates, interval, single] }
        dates:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/FixedDue" }
        every_months: { type: integer, minimum: 1, maximum: 12 }
        count: { type: integer, minimum: 1, maximum: 24 }
        first_due_offset_months: { type: integer, minimum: 0, maximum: 24 }
        due_offset_days: { type: integer, minimum: 0, maximum: 365 }

    EarlyPayment:
      type: object
      required: [discount_bp, pay_by_offset_days]
      additionalProperties: false
      properties:
        discount_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        pay_by_offset_days: { type: integer, minimum: 0, maximum: 365 }

    PaymentPolicy:
      type: object
      additionalProperties: false
      properties:
        deposit:
          oneOf:
            - $ref: "#/components/schemas/PaymentDeposit"
            - type: "null"
        deposit_due_days: { type: integer, minimum: 0, maximum: 365 }
        schedule: { $ref: "#/components/schemas/PaymentSchedule" }
        issue_days_before_due: { type: integer, minimum: 0, maximum: 365 }
        rounding_unit_cents: { type: integer, format: int64, enum: [1, 100, 1000] }
        early_payment:
          oneOf:
            - $ref: "#/components/schemas/EarlyPayment"
            - type: "null"
        sepa: { type: boolean }

    RenewalPolicy:
      type: object
      additionalProperties: false
      properties:
        tacit: { type: boolean }
        notice_days: { type: integer, minimum: 0, maximum: 365 }

    CancellationPolicy:
      type: object
      additionalProperties: false
      properties:
        notice_days: { type: integer, minimum: 0, maximum: 365 }
        refund: { type: string, enum: [pro_rata, none] }
        penalty_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }

    # ---- contract settings ----

    BankDetails:
      description: Bank details for transfers; masked (IBAN last 4) unless payments.collect
      type: object
      properties:
        iban: { type: string, maxLength: 34 }
        holder: { type: string, maxLength: 140 }
        bank: { type: string, maxLength: 140 }
        bic: { type: string, maxLength: 11 }

    ContractSettings:
      type: object
      required: [default_policy, signature_driver, marina_countersign, require_paper_scan, signature_days,
                 signature_reminder_days, renewal_deadline_days, arrears_days, insurance_policy, required_fields, version]
      properties:
        default_policy: { $ref: "#/components/schemas/ContractPolicy" }
        signature_driver: { $ref: "#/components/schemas/SignatureDriver" }
        provider_code: { type: string }
        marina_countersign: { type: boolean }
        require_paper_scan: { type: boolean }
        signature_days: { type: integer }
        signature_reminder_days: { type: integer }
        renewal_deadline_days: { type: integer }
        arrears_days: { type: integer }
        insurance_policy: { $ref: "#/components/schemas/InsurancePolicy" }
        required_fields:
          type: array
          items: { $ref: "#/components/schemas/RequiredField" }
        bank_details: { $ref: "#/components/schemas/BankDetails" }
        office_email: { type: string, description: Only with customers.read }
        version: { type: integer }

    RequiredField:
      description: Data the customer must provide on the public acceptance page
      type: string
      enum: [address, fiscal_code, birth_date, vessel_registration, insurance_expiry, insurance_document, identity_document]

    ContractSettingsUpdate:
      type: object
      properties:
        default_policy: { $ref: "#/components/schemas/ContractPolicy" }
        signature_driver: { $ref: "#/components/schemas/SignatureDriver" }
        provider_code: { type: [string, "null"], maxLength: 64, description: Needs providers.configure }
        marina_countersign: { type: boolean }
        require_paper_scan: { type: boolean }
        signature_days: { type: integer, minimum: 1, maximum: 90 }
        signature_reminder_days: { type: integer, minimum: 1, maximum: 30 }
        renewal_deadline_days: { type: integer, minimum: 1, maximum: 365 }
        arrears_days: { type: integer, minimum: 0, maximum: 365 }
        insurance_policy: { $ref: "#/components/schemas/InsurancePolicy" }
        required_fields:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RequiredField" }
        bank_details: { $ref: "#/components/schemas/BankDetails" }
        office_email: { type: [string, "null"], maxLength: 254 }

    # ---- quote send / accept, signature request ----

    QuoteSendResult:
      type: object
      required: [quote]
      properties:
        quote: { $ref: "#/components/schemas/Quote" }
        document_id: { type: string }
        message_id: { type: string }

    SignerRole:
      type: string
      enum: [customer, co_holder, outgoing_holder, incoming_holder, legal_representative, marina]

    SignerInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/SignerRole" }
        customer_id: { type: string, maxLength: 36 }
        user_id: { type: string, maxLength: 36 }

    SignatureOrderMode:
      type: string
      enum: [sequential, parallel]

    SignatureRequestInput:
      type: object
      properties:
        driver: { $ref: "#/components/schemas/SignatureDriver" }
        signers:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SignerInput" }
        order_mode: { $ref: "#/components/schemas/SignatureOrderMode" }

    ContractActivate:
      description: Paper signature ("firmato su carta"); the scan is required when require_paper_scan is set
      type: object
      properties:
        paper_scan_file_id: { type: string, maxLength: 36 }

    # ---- instalments ----

    Installment:
      type: object
      required: [id, contract_id, plan_version, seq, kind, issue_on, due_on, amount_cents, status, overdue, version]
      properties:
        id: { type: string }
        contract_id: { type: string }
        contract_code: { type: string }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        plan_version: { type: integer }
        seq: { type: integer }
        kind: { $ref: "#/components/schemas/InstallmentKind" }
        issue_on: { $ref: "#/components/schemas/IsoDate" }
        due_on: { $ref: "#/components/schemas/IsoDate" }
        amount_cents: { $ref: "#/components/schemas/Cents" }
        status: { $ref: "#/components/schemas/InstallmentStatus" }
        overdue: { type: boolean }
        issued_at: { type: string, format: date-time }
        settlement_source: { $ref: "#/components/schemas/SettlementSource" }
        settlement_method: { $ref: "#/components/schemas/SettlementMethod" }
        settlement_reference: { type: string, description: Only with payments.collect }
        settled_on: { $ref: "#/components/schemas/IsoDate" }
        settled_at: { type: string, format: date-time }
        charge_id: { type: string, description: M5 }
        payment_id: { type: string, description: The payment of the settlement (M5) }
        version: { type: integer }

    PlannedInstallment:
      type: object
      required: [seq, kind, issue_on, due_on, amount_cents]
      properties:
        seq: { type: integer }
        kind: { $ref: "#/components/schemas/InstallmentKind" }
        issue_on: { $ref: "#/components/schemas/IsoDate" }
        due_on: { $ref: "#/components/schemas/IsoDate" }
        amount_cents: { $ref: "#/components/schemas/Cents" }

    InstallmentPlan:
      type: object
      required: [contract_id, plan_version, items, total_cents, sum_cents]
      properties:
        contract_id: { type: string }
        plan_version: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Installment" }
        total_cents: { $ref: "#/components/schemas/Cents" }
        sum_cents: { $ref: "#/components/schemas/Cents" }
        alternatives:
          type: object
          properties:
            early_payment:
              type: object
              required: [discount_cents, total_cents, items]
              properties:
                discount_cents: { $ref: "#/components/schemas/Cents" }
                total_cents: { $ref: "#/components/schemas/Cents" }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/PlannedInstallment" }

    ReplanInput:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/PlanChoice" }
        payment: { $ref: "#/components/schemas/PaymentPolicy" }

    InstallmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Installment" }
        next_cursor: { type: [string, "null"] }
        totals:
          type: object
          properties:
            count: { type: integer }
            amount_cents: { $ref: "#/components/schemas/Cents" }

    IssueResult:
      type: object
      required: [issued, skipped]
      properties:
        issued: { type: integer }
        skipped: { type: integer }

    RemindResult:
      type: object
      required: [queued, skipped_no_email]
      properties:
        queued: { type: integer }
        skipped_no_email: { type: integer }

    SettleInput:
      type: object
      required: [method]
      properties:
        method: { $ref: "#/components/schemas/SettlementMethod" }
        reference: { type: string, maxLength: 200, description: Stored encrypted, never logged }
        settled_on: { $ref: "#/components/schemas/IsoDate" }

    VersionedId:
      type: object
      required: [id, version]
      properties:
        id: { type: string, maxLength: 36 }
        version: { type: integer }

    BulkSettleInput:
      type: object
      required: [items, method]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/VersionedId" }
        method: { $ref: "#/components/schemas/SettlementMethod" }
        reference: { type: string, maxLength: 200 }
        settled_on: { $ref: "#/components/schemas/IsoDate" }

    BulkSettleResult:
      type: object
      required: [settled]
      properties:
        settled: { type: integer }

    # ---- renewals ----

    RenewInput:
      type: object
      properties:
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        price_list_id: { type: string, maxLength: 36 }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        send: { type: boolean }

    RenewalCampaignStatus:
      type: string
      enum: [draft, sending, open, closed, discarded]

    RenewalProposalStatus:
      type: string
      enum: [previewed, proposed, sent, accepted, signed, completed, declined, expired, excluded]

    RenewalExclusionReason:
      type: string
      enum: [arrears, insurance_expired, already_renewed, no_price, berth_unavailable, manual]

    RenewalFilter:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 36 }
        structures:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 36 }
        terms:
          type: array
          items: { $ref: "#/components/schemas/ContractTerm" }
        ends_from: { $ref: "#/components/schemas/IsoDate" }
        ends_to: { $ref: "#/components/schemas/IsoDate" }
        customer_categories:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        contract_ids:
          type: array
          maxItems: 5000
          items: { type: string, maxLength: 36 }

    RenewalCounts:
      type: object
      additionalProperties: { type: integer }
      description: Proposals per status and exclusions per reason (excluded_<reason>)

    RenewalCampaign:
      type: object
      required: [id, name, filter, target_starts_rule, deadline_on, status, message, counts, created_at, version]
      properties:
        id: { type: string }
        name: { type: string }
        filter: { $ref: "#/components/schemas/RenewalFilter" }
        price_list_id: { type: string }
        target_starts_rule: { type: string, enum: [next_term, fixed] }
        target_starts_on: { $ref: "#/components/schemas/IsoDate" }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        status: { $ref: "#/components/schemas/RenewalCampaignStatus" }
        message: { type: string }
        counts: { $ref: "#/components/schemas/RenewalCounts" }
        launched_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    RenewalCampaignPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RenewalCampaign" }
        next_cursor: { type: [string, "null"] }

    RenewalCampaignInput:
      type: object
      required: [name, filter, deadline_on]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filter: { $ref: "#/components/schemas/RenewalFilter" }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        price_list_id: { type: string, maxLength: 36 }
        target_starts_rule: { type: string, enum: [next_term, fixed] }
        target_starts_on: { $ref: "#/components/schemas/IsoDate" }
        message: { type: string, maxLength: 4000 }

    RenewalCampaignPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filter: { $ref: "#/components/schemas/RenewalFilter" }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        price_list_id: { type: [string, "null"], maxLength: 36 }
        message: { type: string, maxLength: 4000 }

    RenewalProposal:
      type: object
      required: [id, source_contract, status, old_total_cents, deadline_on, sent_count, created_at, version]
      properties:
        id: { type: string }
        campaign_id: { type: string }
        source_contract: { $ref: "#/components/schemas/ContractBrief" }
        new_contract: { $ref: "#/components/schemas/ContractBrief" }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/ResourceRef" }
        status: { $ref: "#/components/schemas/RenewalProposalStatus" }
        exclusion_reason: { $ref: "#/components/schemas/RenewalExclusionReason" }
        included_reason: { type: string }
        old_total_cents: { $ref: "#/components/schemas/Cents" }
        new_total_cents: { $ref: "#/components/schemas/Cents" }
        new_starts_on: { $ref: "#/components/schemas/IsoDate" }
        new_ends_on: { $ref: "#/components/schemas/IsoDate" }
        deadline_on: { $ref: "#/components/schemas/IsoDate" }
        hold_expires_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        sent_count: { type: integer }
        accepted_at: { type: string, format: date-time }
        accepted_via: { type: string, enum: [panel, link] }
        accepted_plan: { $ref: "#/components/schemas/PlanChoice" }
        decided_at: { type: string, format: date-time }
        decline_reason: { type: string }
        signature_request_id: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    RenewalProposalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RenewalProposal" }
        next_cursor: { type: [string, "null"] }

    RenewalCampaignPreview:
      type: object
      required: [campaign, counts, proposals]
      properties:
        campaign: { $ref: "#/components/schemas/RenewalCampaign" }
        counts: { $ref: "#/components/schemas/RenewalCounts" }
        old_total_cents: { $ref: "#/components/schemas/Cents" }
        new_total_cents: { $ref: "#/components/schemas/Cents" }
        proposals: { $ref: "#/components/schemas/RenewalProposalPage" }

    RenewalAccept:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/PlanChoice" }

    # ---- charter ----

    CharterFleetVessel:
      type: object
      required: [vessel, active]
      properties:
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        active: { type: boolean }

    CharterFleet:
      type: object
      required: [id, customer, name, vessels, created_at, version]
      properties:
        id: { type: string }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        name: { type: string }
        vessels:
          type: array
          items: { $ref: "#/components/schemas/CharterFleetVessel" }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    CharterFleetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CharterFleet" }

    CharterFleetInput:
      type: object
      required: [customer_id, name, vessel_ids]
      properties:
        customer_id: { type: string, maxLength: 36 }
        name: { type: string, minLength: 1, maxLength: 120 }
        vessel_ids:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 36 }

    CharterFleetPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        vessel_ids:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 36 }

    CharterPricingMode:
      type: string
      enum: [per_berth, per_vessel, flat]

    OutNights:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/IsoDate" }
        to: { $ref: "#/components/schemas/IsoDate" }
        berth_id: { type: string, maxLength: 36 }

    CharterPlacement:
      type: object
      required: [target, vessel_id]
      properties:
        target: { $ref: "#/components/schemas/PlacementInput" }
        vessel_id: { type: string, maxLength: 36 }

    CharterCreate:
      type: object
      required: [fleet_id, starts_on, ends_on, placements, pricing_mode, changeover_weekday]
      properties:
        fleet_id: { type: string, maxLength: 36 }
        starts_on: { $ref: "#/components/schemas/IsoDate" }
        ends_on: { $ref: "#/components/schemas/IsoDate" }
        placements:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CharterPlacement" }
        pricing_mode: { $ref: "#/components/schemas/CharterPricingMode" }
        flat_cents: { $ref: "#/components/schemas/Cents" }
        flat_reason: { type: string, maxLength: 500 }
        changeover_weekday: { type: integer, minimum: 1, maximum: 7 }
        out_nights:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OutNights" }
        services:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SimulateService" }
        policy: { $ref: "#/components/schemas/ContractPolicy" }
        activate: { type: boolean }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    CharterAssignment:
      type: object
      required: [line_id, vessel_id]
      properties:
        line_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }

    CharterRotate:
      type: object
      required: [from_night, assignments]
      properties:
        from_night: { $ref: "#/components/schemas/IsoDate" }
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CharterAssignment" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    CharterInfo:
      type: object
      required: [fleet_id, changeover_weekday, pricing_mode, out_nights]
      properties:
        fleet_id: { type: string }
        fleet_name: { type: string }
        changeover_weekday: { type: integer }
        pricing_mode: { $ref: "#/components/schemas/CharterPricingMode" }
        out_nights:
          type: array
          items: { $ref: "#/components/schemas/OutNights" }

    # ---- addenda ----

    AddendumKind:
      type: string
      enum: [service_add, service_remove, parking, billing_customer, price_change, vessel_change]

    AddendumStatus:
      type: string
      enum: [draft, awaiting_signature, active, cancelled]

    AddendumPayload:
      description: >-
        Kind-specific data: service_add {item_id, qty_milli}; service_remove {line_id}; parking
        {land_resource_id, item_id?}; billing_customer {customer_id}; price_change {new_total_cents, reason};
        vessel_change {vessel_id}
      type: object
      additionalProperties: false
      properties:
        item_id: { type: string, maxLength: 36 }
        qty_milli: { $ref: "#/components/schemas/QtyMilli" }
        line_id: { type: string, maxLength: 36 }
        land_resource_id: { type: string, maxLength: 36 }
        customer_id: { type: string, maxLength: 36 }
        new_total_cents: { $ref: "#/components/schemas/Cents" }
        reason: { type: string, maxLength: 500 }
        vessel_id: { type: string, maxLength: 36 }

    AddendumInput:
      type: object
      required: [kind, effective_on, payload]
      properties:
        kind: { $ref: "#/components/schemas/AddendumKind" }
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        payload: { $ref: "#/components/schemas/AddendumPayload" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    Addendum:
      type: object
      required: [id, contract_id, seq, kind, effective_on, payload, amount_delta_cents, status, created_at, version]
      properties:
        id: { type: string }
        contract_id: { type: string }
        seq: { type: integer }
        kind: { $ref: "#/components/schemas/AddendumKind" }
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        payload: { $ref: "#/components/schemas/AddendumPayload" }
        amount_delta_cents: { $ref: "#/components/schemas/Cents" }
        price_effect:
          type: object
          properties:
            old_remaining_cents: { $ref: "#/components/schemas/Cents" }
            new_remaining_cents: { $ref: "#/components/schemas/Cents" }
            replanned_installments: { type: integer }
        status: { $ref: "#/components/schemas/AddendumStatus" }
        document_id: { type: string }
        signature_request_id: { type: string }
        activated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    AddendumList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Addendum" }

    # ---- waiting list ----

    WaitlistStatus:
      type: string
      enum: [waiting, offered, converted, withdrawn]

    WaitlistEntry:
      type: object
      required: [id, customer, loa_cm, beam_cm, term, group_ids, requested_from, priority, status, notes, created_at, version]
      properties:
        id: { type: string }
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        loa_cm: { $ref: "#/components/schemas/Cm" }
        beam_cm: { $ref: "#/components/schemas/Cm" }
        draft_cm: { $ref: "#/components/schemas/Cm" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        group_ids:
          type: array
          items: { type: string }
        requested_from: { $ref: "#/components/schemas/IsoDate" }
        priority: { type: integer }
        status: { $ref: "#/components/schemas/WaitlistStatus" }
        offered_quote_id: { type: string }
        offered_at: { type: string, format: date-time }
        notes: { type: string, description: Only with customers.read }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    WaitlistPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WaitlistEntry" }
        next_cursor: { type: [string, "null"] }

    WaitlistInput:
      type: object
      required: [customer_id, term, requested_from]
      properties:
        customer_id: { type: string, maxLength: 36 }
        vessel_id: { type: string, maxLength: 36 }
        loa_cm: { $ref: "#/components/schemas/PositiveCm" }
        beam_cm: { $ref: "#/components/schemas/PositiveCm" }
        draft_cm: { $ref: "#/components/schemas/PositiveCm" }
        term: { $ref: "#/components/schemas/ContractTerm" }
        group_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 36 }
        requested_from: { $ref: "#/components/schemas/IsoDate" }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        notes: { type: string, maxLength: 4000 }

    WaitlistPatch:
      type: object
      properties:
        status: { type: string, enum: [waiting, withdrawn] }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        group_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 36 }
        notes: { type: string, maxLength: 4000 }

    # ---- rights ----

    RightKind:
      type: string
      enum: [ownership_share, long_term_use, membership]

    RightStatus:
      type: string
      enum: [active, transferred, ended, cancelled]

    RightTitle:
      type: object
      additionalProperties: false
      properties:
        deed: { type: string, maxLength: 200 }
        number: { type: string, maxLength: 64 }
        notary: { type: string, maxLength: 200 }
        date: { $ref: "#/components/schemas/IsoDate" }

    HolderShare:
      type: object
      required: [customer_id, share_millis]
      properties:
        customer_id: { type: string, maxLength: 36 }
        share_millis: { type: integer, format: int64, minimum: 1, maximum: 1000 }

    RightHolder:
      type: object
      required: [customer, share_millis]
      properties:
        customer: { $ref: "#/components/schemas/CustomerBrief" }
        share_millis: { type: integer, format: int64 }

    RightVesselInput:
      type: object
      required: [vessel_id, primary]
      properties:
        vessel_id: { type: string, maxLength: 36 }
        primary: { type: boolean }

    RightVessel:
      type: object
      required: [vessel, primary]
      properties:
        vessel: { $ref: "#/components/schemas/VesselBrief" }
        primary: { type: boolean }
        fit: { $ref: "#/components/schemas/FitResult" }
        fit_override: { $ref: "#/components/schemas/FitOverride" }

    Right:
      type: object
      required: [id, berth, kind, from_on, to_on, title, status, holders, vessels, created_at, version]
      properties:
        id: { type: string }
        berth: { $ref: "#/components/schemas/ResourceRef" }
        berth_code: { type: string, description: Code of the berth of the right }
        kind: { $ref: "#/components/schemas/RightKind" }
        from_on: { $ref: "#/components/schemas/IsoDate" }
        to_on: { $ref: "#/components/schemas/IsoDate" }
        title: { $ref: "#/components/schemas/RightTitle" }
        status: { $ref: "#/components/schemas/RightStatus" }
        end_reason: { type: string }
        holders:
          type: array
          items: { $ref: "#/components/schemas/RightHolder" }
        vessels:
          type: array
          items: { $ref: "#/components/schemas/RightVessel" }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }
        active_mandate_id: { type: string }
        unpaid_fees: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    RightPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Right" }
        next_cursor: { type: [string, "null"] }

    RightInput:
      type: object
      required: [berth_id, kind, from_on, title, holders]
      properties:
        berth_id: { type: string, maxLength: 36 }
        kind: { $ref: "#/components/schemas/RightKind" }
        from_on: { $ref: "#/components/schemas/IsoDate" }
        to_on: { $ref: "#/components/schemas/IsoDate" }
        title: { $ref: "#/components/schemas/RightTitle" }
        holders:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/HolderShare" }
        vessels:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RightVesselInput" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    RightPatch:
      type: object
      properties:
        title: { $ref: "#/components/schemas/RightTitle" }
        holders:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/HolderShare" }

    RightEndInput:
      type: object
      required: [on, reason]
      properties:
        on: { $ref: "#/components/schemas/IsoDate" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    RightVesselsInput:
      type: object
      required: [vessels]
      properties:
        vessels:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/RightVesselInput" }
        from_night: { $ref: "#/components/schemas/IsoDate" }
        fit_override: { $ref: "#/components/schemas/FitOverrideInput" }

    RightHistoryEntry:
      type: object
      required: [right_id, kind, from_on, to_on, status, holders]
      properties:
        right_id: { type: string }
        kind: { $ref: "#/components/schemas/RightKind" }
        from_on: { $ref: "#/components/schemas/IsoDate" }
        to_on: { $ref: "#/components/schemas/IsoDate" }
        status: { $ref: "#/components/schemas/RightStatus" }
        transfer_id: { type: string }
        holders:
          type: array
          items: { $ref: "#/components/schemas/RightHolder" }

    RightHistory:
      type: object
      required: [berth, items]
      properties:
        berth: { $ref: "#/components/schemas/ResourceRef" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RightHistoryEntry" }

    MapRightStatus:
      type: string
      enum: [marina, holder, mandate]

    MapRights:
      type: object
      required: [map_id, date, items]
      properties:
        map_id: { type: string }
        date: { $ref: "#/components/schemas/IsoDate" }
        items:
          type: array
          items:
            type: object
            required: [berth_id, status, unpaid_fees]
            properties:
              berth_id: { type: string }
              right_id: { type: string }
              mandate_id: { type: string }
              status: { $ref: "#/components/schemas/MapRightStatus" }
              unpaid_fees: { type: boolean }

    # ---- transfers ----

    TransferStatus:
      type: string
      enum: [draft, awaiting_signature, completed, cancelled]

    TransferRequirementIssue:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [unsettled_fees, unsettled_common_charges] }
        customer_id: { type: string }
        holder_installment_ids:
          type: array
          items: { type: string }
        amount_cents: { $ref: "#/components/schemas/Cents" }

    RightTransfer:
      type: object
      required: [id, right_id, effective_on, to_holders, takeover_fee_cents, requirement_policy, requirement_issues,
                 fees_policy, status, created_at, version]
      properties:
        id: { type: string }
        right_id: { type: string }
        berth: { $ref: "#/components/schemas/ResourceRef" }
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        from_holders:
          type: array
          items: { $ref: "#/components/schemas/RightHolder" }
        to_holders:
          type: array
          items: { $ref: "#/components/schemas/RightHolder" }
        declared_price_cents: { $ref: "#/components/schemas/Cents" }
        takeover_item_id: { type: string }
        takeover_fee_cents: { $ref: "#/components/schemas/Cents" }
        requirement_policy: { type: string, enum: [block, warn] }
        requirement_issues:
          type: array
          items: { $ref: "#/components/schemas/TransferRequirementIssue" }
        fees_policy: { type: string, enum: [reassign, prorata] }
        status: { $ref: "#/components/schemas/TransferStatus" }
        new_right_id: { type: string }
        document_id: { type: string }
        signature_request_id: { type: string }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    RightTransferPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RightTransfer" }
        next_cursor: { type: [string, "null"] }

    RightTransferInput:
      type: object
      required: [right_id, effective_on, to_holders, fees_policy]
      properties:
        right_id: { type: string, maxLength: 36 }
        effective_on: { $ref: "#/components/schemas/IsoDate" }
        to_holders:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/HolderShare" }
        declared_price_cents: { $ref: "#/components/schemas/Cents" }
        takeover_item_id: { type: string, maxLength: 36 }
        fees_policy: { type: string, enum: [reassign, prorata] }

    PaperConfirmInput:
      type: object
      properties:
        signer_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 36 }
        paper_scan_file_id: { type: string, maxLength: 36 }

    # ---- mandates ----

    MandateStatus:
      type: string
      enum: [active, ended, cancelled]

    MandateChannel:
      type: string
      enum: [transit, period]

    Mandate:
      type: object
      required: [id, right_id, from_on, to_on, owner_share_bp, min_guaranteed_cents, channels, settlement, status, created_at, version]
      properties:
        id: { type: string }
        right_id: { type: string }
        berth: { $ref: "#/components/schemas/ResourceRef" }
        from_on: { $ref: "#/components/schemas/IsoDate" }
        to_on: { $ref: "#/components/schemas/IsoDate" }
        owner_share_bp: { $ref: "#/components/schemas/BasisPoints" }
        min_guaranteed_cents: { $ref: "#/components/schemas/Cents" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/MandateChannel" }
        settlement: { type: string, enum: [credit, transfer] }
        status: { $ref: "#/components/schemas/MandateStatus" }
        ended_on: { $ref: "#/components/schemas/IsoDate" }
        revenue_cents: { $ref: "#/components/schemas/Cents" }
        owner_share_cents: { $ref: "#/components/schemas/Cents" }
        sold_nights_kept:
          description: After end/cancel, nights already sold that stay sold (not given back to the owner)
          type: integer
        created_at: { type: string, format: date-time }
        version: { type: integer }

    MandatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Mandate" }
        next_cursor: { type: [string, "null"] }

    MandateInput:
      type: object
      required: [right_id, from_on, to_on, owner_share_bp, channels, settlement]
      properties:
        right_id: { type: string, maxLength: 36 }
        from_on: { $ref: "#/components/schemas/IsoDate" }
        to_on: { $ref: "#/components/schemas/IsoDate" }
        owner_share_bp: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        min_guaranteed_cents: { $ref: "#/components/schemas/Cents" }
        channels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MandateChannel" }
        settlement: { type: string, enum: [credit, transfer] }

