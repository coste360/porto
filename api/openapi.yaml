      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/v1/marinas/{marinaId}/webhook-endpoints/{endpointId}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/MarinaId"
      - $ref: "#/components/parameters/EndpointId"
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret; the previous one stays valid for 24 hours (users.manage)
      security: *writeSecurity
      responses:
        "200":
          description: New secret
          content:
            application/json:
