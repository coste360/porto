  /api/admin/v1/stream:
    get:
      tags: [realtime]
      operationId: stream
      summary: Server-sent events of a marina (marina.read)
      description: |
        `text/event-stream`. Each message has `id`, `event` (topic, e.g. `team.changed`) and `data`
        (`{"topic","type","marina_id","entity_ids":[…]}`, ids only). Heartbeat `: ping` every 25 s.
        Resume with `Last-Event-ID`. At most 5 concurrent streams per principal.
      security: *readSecurity
      parameters:
        - { name: marina_id, in: query, required: true, schema: { type: string } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

