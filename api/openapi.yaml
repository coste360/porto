      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QuoteSummary" }
        next_cursor: { type: [string, "null"] }

    ManualConfirmation:
      description: Manual driver confirmation (M3); the reference is free text, stored and never logged
