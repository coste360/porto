      properties:
        document_id: { type: string }
        claim_id: { type: string }
        claim_until: { type: string, format: date-time }
        number: { type: string }
        business_date: { $ref: "#/components/schemas/IsoDate" }
        refund: { type: boolean, description: A refund document (reso) }
        total_cents: { $ref: "#/components/schemas/Cents" }
        lines: { type: array, items: { $ref: "#/components/schemas/ReceiptDataLine" } }
        vat: { type: array, items: { $ref: "#/components/schemas/ReceiptDataVat" } }
        method: { type: string }

