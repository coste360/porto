# golangci-lint v2 configuration for Porto. Run it through `make lint` (installed by `make setup` into ./bin).
# The depguard rules encode the package dependency rules of docs/m0-plan.md §1.1 and invariant INV-21.
version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - misspell
    - bodyclose
    - noctx
    - errorlint
    - depguard
    - forbidigo
    - sloglint
    - gocritic
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readable struct layout wins over a few bytes
        - shadow # `err` shadowing is idiomatic
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck
        - G115 # integer conversions: int64 cents/cm/milli are range-checked in their packages
        - G304 # file paths come from operator configuration (data dir, backup path)
      config:
        G306: "0640"
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        - name: early-return
        - name: use-any
    misspell:
      # Both US and UK spellings are accepted ("enrolment" is a stable API slug). Italian appears in comments
      # that quote the specification.
      ignore-rules:
        - porto
        - marina
        - transito
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - commentFormatting
    sloglint:
      kv-only: true
      key-naming-case: snake
      args-on-sep-lines: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: inject a clock.Clock (internal/clock); time.Now is allowed only in internal/clock, cmd/ and tests
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use log/slog (or write to an io.Writer); fmt.Print* is allowed only in cmd/
    depguard:
      rules:
        # Shared primitives: standard library only.
        primitives:
          list-mode: lax
          files:
            - "**/internal/clock/**"
            - "**/internal/money/**"
            - "**/internal/calendar/**"
            - "**/internal/reqctx/**"
            - "**/internal/geo/**"
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: primitives depend on the standard library only (m0-plan §1.1)
            - pkg: github.com/uptrace/bun
              desc: primitives must not depend on the database layer
            - pkg: net/http
              desc: primitives must not depend on HTTP
        # qty may use money (MulCents) and nothing else of Porto.
        qty:
          list-mode: lax
          files:
            - "**/internal/qty/**"
          allow:
            - github.com/coste360/porto/internal/money
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: qty may import internal/money only (m0-plan §1.1)
            - pkg: github.com/uptrace/bun
              desc: qty must not depend on the database layer
            - pkg: net/http
              desc: qty must not depend on HTTP
        crypto:
          list-mode: lax
          files:
            - "**/internal/crypto/**"
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: internal/crypto depends on the standard library only
        problem:
          list-mode: lax
          files:
            - "**/internal/http/problem/**"
          deny:
            - pkg: github.com/coste360/porto/internal/http/api
              desc: problem must not depend on generated code
            - pkg: github.com/coste360/porto/internal/domain
              desc: domain errors are mapped in internal/http (errmap.go), not here
            - pkg: github.com/coste360/porto/internal/store
              desc: problem must not depend on the store
        # Domain services: no HTTP (except the webhook egress client, the SMTP transport and the payment drivers,
        # which implement ext.PaymentProvider over the egress client, M5), no SQL drivers.
        domain:
          list-mode: lax
          files:
            - "**/internal/domain/**"
            - "!**/internal/domain/event/**"
            - "!**/internal/domain/notify/**"
            - "!**/internal/domain/paydriver/**"
            - "!**/internal/domain/channel/fakechannel/**"
          deny:
            - pkg: net/http
              desc: domain services are transport independent
            - pkg: github.com/coste360/porto/internal/http
              desc: domain must not depend on the HTTP layer
            - pkg: modernc.org/sqlite
              desc: SQL drivers belong to internal/store
            - pkg: github.com/uptrace/bun/driver
              desc: SQL drivers belong to internal/store
            - pkg: github.com/uptrace/bun/dialect
              desc: SQL dialects belong to internal/store
        domain-io:
          list-mode: lax
          files:
            - "**/internal/domain/event/**"
            - "**/internal/domain/notify/**"
            - "**/internal/domain/paydriver/**"
            - "**/internal/domain/channel/fakechannel/**"
          deny:
            - pkg: github.com/coste360/porto/internal/http
              desc: domain must not depend on the HTTP layer
            - pkg: modernc.org/sqlite
              desc: SQL drivers belong to internal/store
            - pkg: github.com/uptrace/bun/driver
              desc: SQL drivers belong to internal/store
        # Payment drivers (M5, m5-plan §2): pkg/ext and the egress client only, never the store. The registry
        # (internal/domain/paydriver itself) reads the marina settings.
        paydriver:
          list-mode: lax
          files:
            - "**/internal/domain/paydriver/manual/**"
            - "**/internal/domain/paydriver/stripe/**"
          deny:
            - pkg: github.com/coste360/porto/internal/store
              desc: payment drivers talk to providers, the store belongs to the domain services
            - pkg: github.com/uptrace/bun
              desc: payment drivers never touch the database
        # HTTP layer: talks to domain services, never to the store.
        http:
          list-mode: lax
          files:
            - "**/internal/http/**"
            - "!**/internal/http/problem/**"
            - "!**/internal/http/middleware/idempotency.go"
            - "!**/internal/http/api/api.gen.go"
          deny:
            - pkg: github.com/coste360/porto/internal/store
              desc: handlers call domain services; SQL lives in internal/store
            - pkg: database/sql
              desc: no raw SQL in the HTTP layer
        store:
          list-mode: lax
          files:
            - "**/internal/store/**"
          deny:
            - pkg: github.com/coste360/porto/internal/domain
              desc: the store does not depend on domain services
            - pkg: github.com/coste360/porto/internal/http
              desc: the store does not depend on the HTTP layer
        ext:
          list-mode: lax
          files:
            - "**/pkg/ext/**"
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: public extension interfaces must not leak internal packages
        # Desktop edition (M6a, m6a-plan §6): the webview binding (CGO) only in cmd/porto-desktop.
        webview:
          list-mode: lax
          files:
            - "$all"
            - "!**/cmd/porto-desktop/**"
          deny:
            - pkg: github.com/webview/webview_go
              desc: only cmd/porto-desktop may import the webview binding (CGO stays out of every other package)
        # desktopport is the frozen M6a/M6b contract: standard library, internal/domain/auth and pkg/ext only.
        desktopport:
          list-mode: lax
          files:
            - "**/internal/desktopport/**"
          allow:
            - github.com/coste360/porto/internal/domain/auth
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: desktopport imports the standard library, internal/domain/auth and pkg/ext only (m6a-plan §2.1)
            - pkg: github.com/uptrace/bun
              desc: desktopport carries no logic
            - pkg: net/http
              desc: desktopport is transport independent
        # Peripheral drivers (M6b, m6b-plan §9.3): pure Go, standard library, desktopport and pkg/ext only.
        peripheral:
          list-mode: lax
          files:
            - "**/internal/peripheral/**"
          allow:
            - github.com/coste360/porto/internal/desktopport
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: peripheral drivers import the standard library, internal/desktopport and pkg/ext only (m6b-plan §9.3)
            - pkg: github.com/uptrace/bun
              desc: peripheral drivers never touch the database
        # The remote-mode proxy (M6b) runs without a database or an app.App.
        desktop-remote:
          list-mode: lax
          files:
            - "**/internal/desktop/remote/**"
          deny:
            - pkg: github.com/coste360/porto/internal/app
              desc: remote mode runs no local Porto server (m6b-plan §7.1)
            - pkg: github.com/coste360/porto/internal/store
              desc: remote mode has no database (m6b-plan §7.1)
        # The launcher and the local-network server go through app, backup and the services, never the store.
        desktop-lan:
          list-mode: lax
          files:
            - "**/internal/desktop/**"
            - "**/internal/lan/**"
          deny:
            - pkg: github.com/coste360/porto/internal/store
              desc: internal/desktop and internal/lan reach the database through app, backup or the services
            - pkg: github.com/uptrace/bun
              desc: internal/desktop and internal/lan do not touch the database directly
        # Pure engines (AGENTS.md, INV-21): no database, no clock, no randomness, no I/O. The optimizer takes
        # an explicit seed for its own PRNG (M9: math/rand is denied there too, see pure-engines-no-rand).
        pure-engines:
          list-mode: lax
          files:
            - "**/internal/domain/layout/**"
            - "**/internal/domain/fit/**"
            - "**/internal/domain/occupancy/engine/**"
            - "**/internal/domain/pricing/**"
            - "**/internal/domain/accrual/**"
            - "**/internal/domain/formula/**"
            - "**/internal/domain/optimizer/**"
            # M4 (m4-plan §0.7)
            - "**/internal/domain/schedule/**"
            - "**/internal/domain/allot/**"
            - "**/internal/domain/docs/tmpl/**"
            - "**/internal/domain/docs/markdown/**"
            - "**/internal/domain/docs/layout/**"
            # M5 (m5-plan §0.7)
            - "**/internal/domain/chargeplan/**"
            - "**/internal/domain/cash/summary/**"
            - "**/internal/domain/collect/levels/**"
            - "**/internal/xlsx/**"
            # M7 (m7-plan §0.4)
            - "**/internal/domain/report/calc/**"
            - "**/internal/domain/report/align/**"
            - "**/internal/domain/report/swap/**"
            - "**/internal/domain/report/export/**"
            # M8 (m8-plan §0.6)
            - "**/internal/domain/booking/policy/**"
            # M9 (m9-plan §0.4); the optimizer is listed above
            - "**/internal/domain/maintenance/due/**"
            - "**/internal/domain/utility/consume/**"
            # M10 (m10-plan §0.4); formula is listed above
            - "**/internal/domain/yardquote/price/**"
            - "**/internal/domain/workorder/account/**"
            - "**/internal/domain/workorder/states.go"
            - "**/internal/domain/yardplan/load/**"
            - "**/internal/domain/yardplan/auto/**"
            - "**/internal/domain/lifting/slots/**"
            # M11 (m11-plan §0.4); pricing is listed above
            - "**/internal/domain/rental/price/**"
            - "**/internal/domain/rental/slots/**"
            - "**/internal/domain/rental/states/**"
          deny:
            - pkg: github.com/coste360/porto/internal/store
              desc: pure engines must not touch the database (INV-21)
            - pkg: github.com/coste360/porto/internal/clock
              desc: pure engines receive dates/instants as arguments (INV-21)
            - pkg: github.com/uptrace/bun
              desc: pure engines must not touch the database (INV-21)
            - pkg: database/sql
              desc: pure engines must not touch the database (INV-21)
            - pkg: net/http
              desc: pure engines do no I/O
            - pkg: crypto/rand
              desc: pure engines are deterministic
            - pkg: os
              desc: pure engines do no I/O
        # M8 online booking (m8-plan §2): booking/policy imports only calendar, money and geo; booking never imports
        # the packages that call it (portal, channel); the fake channel is a driver (pkg/ext only, no store).
        # M9 optimizer (m9-plan §2): imports only layout, fit, geo, calendar and the standard library; its
        # randomness is its own seeded PRNG (rng.go), never math/rand.
        optimizer:
          list-mode: lax
          files:
            - "**/internal/domain/optimizer/**"
          allow:
            - github.com/coste360/porto/internal/domain/layout
            - github.com/coste360/porto/internal/domain/fit
            - github.com/coste360/porto/internal/geo
            - github.com/coste360/porto/internal/calendar
            - github.com/coste360/porto/internal/domain/optimizer
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: the optimizer imports only layout, fit, geo and calendar (m9-plan §2)
            - pkg: github.com/coste360/porto/pkg
              desc: the optimizer imports only layout, fit, geo and calendar (m9-plan §2)
        booking-policy:
          list-mode: lax
          files:
            - "**/internal/domain/booking/policy/**"
          allow:
            - github.com/coste360/porto/internal/calendar
            - github.com/coste360/porto/internal/money
            - github.com/coste360/porto/internal/geo
          deny:
            - pkg: github.com/coste360/porto/internal
              desc: booking/policy imports only calendar, money and geo (m8-plan §2)
        booking:
          list-mode: lax
          files:
            - "**/internal/domain/booking/**"
          deny:
            - pkg: github.com/coste360/porto/internal/domain/portal
              desc: portal calls booking, never the reverse (m8-plan §2)
            - pkg: github.com/coste360/porto/internal/domain/channel
              desc: channel calls booking, never the reverse (m8-plan §2)
        fakechannel:
          list-mode: lax
          files:
            - "**/internal/domain/channel/fakechannel/**"
          deny:
            - pkg: github.com/coste360/porto/internal/store
              desc: channel drivers talk to channels, the store belongs to the domain services
            - pkg: github.com/uptrace/bun
              desc: channel drivers never touch the database
        # Reports are read-only (INV-61, m7-plan §0.2): no audit row, no outbox event; the pure report packages
        # never import the report service either (calc/align/swap/export → report is a cycle in spirit).
        report-readonly:
          list-mode: lax
          files:
            - "**/internal/domain/report/**"
          deny:
            - pkg: github.com/coste360/porto/internal/domain/event
              desc: reports are read-only and write no outbox event (INV-61)
            - pkg: github.com/coste360/porto/internal/domain/audit
              desc: reports are read-only and write no audit row (INV-61)
            - pkg: github.com/coste360/porto/internal/domain/auditlog
              desc: reports are read-only and write no audit row (INV-61)
        report-pure:
          list-mode: lax
          files:
            - "**/internal/domain/report/calc/**"
            - "**/internal/domain/report/align/**"
            - "**/internal/domain/report/swap/**"
            - "**/internal/domain/report/export/**"
          deny:
            - pkg: github.com/coste360/porto/internal/domain/report$
              desc: the pure report packages do not depend on the report service (m7-plan §2)
        # The engines take no randomness from math/rand at all (INV-21); the optimizer has its own seeded PRNG
        # (M9, m9-plan §6.3).
        pure-engines-no-rand:
          list-mode: lax
          files:
            - "**/internal/domain/layout/**"
            - "**/internal/domain/fit/**"
            - "**/internal/domain/occupancy/engine/**"
            - "**/internal/domain/pricing/**"
            - "**/internal/domain/accrual/**"
            - "**/internal/domain/formula/**"
            - "**/internal/domain/schedule/**"
            - "**/internal/domain/allot/**"
            - "**/internal/domain/docs/tmpl/**"
            - "**/internal/domain/docs/markdown/**"
            - "**/internal/domain/docs/layout/**"
            - "**/internal/domain/chargeplan/**"
            - "**/internal/domain/cash/summary/**"
            - "**/internal/domain/collect/levels/**"
            - "**/internal/xlsx/**"
            - "**/internal/domain/report/calc/**"
            - "**/internal/domain/report/align/**"
            - "**/internal/domain/report/swap/**"
            - "**/internal/domain/report/export/**"
            # M9 (m9-plan §0.4): the optimizer uses its own seeded PRNG, never math/rand.
            - "**/internal/domain/optimizer/**"
            - "**/internal/domain/maintenance/due/**"
            - "**/internal/domain/utility/consume/**"
            # M10 (m10-plan §0.4); formula is listed above
            - "**/internal/domain/yardquote/price/**"
            - "**/internal/domain/workorder/account/**"
            - "**/internal/domain/workorder/states.go"
            - "**/internal/domain/yardplan/load/**"
            - "**/internal/domain/yardplan/auto/**"
            - "**/internal/domain/lifting/slots/**"
            # M11 (m11-plan §0.4)
            - "**/internal/domain/rental/price/**"
            - "**/internal/domain/rental/slots/**"
            - "**/internal/domain/rental/states/**"
            # Seeded generators of the layout and fit parity vectors (test data, not the engines).
            - "!**/internal/domain/layout/internal/vectors/**"
            - "!**/internal/domain/fit/internal/genvectors/**"
          deny:
            - pkg: math/rand
              desc: pure engines are deterministic; only the optimizer takes an explicit seed (INV-21)
            - pkg: math/rand/v2
              desc: pure engines are deterministic; only the optimizer takes an explicit seed (INV-21)
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - internal/http/api/api.gen.go
      - _gen\.go$
      - web/
      - e2e/
      - node_modules/
    rules:
      # The clock itself, the CLI and tests may read the wall clock.
      - path: (^|/)(internal/clock/|cmd/)
        linters: [forbidigo]
        text: time\.Now
      - path: _test\.go$
        linters: [forbidigo]
        text: time\.Now
      # The CLI prints to the terminal.
      - path: (^|/)cmd/
        linters: [forbidigo]
        text: fmt\.Print
      # Code generators are developer tools.
      - path: (^|/)internal/.*/internal/gen[a-z]+/
        linters: [forbidigo, gosec]
      - path: _test\.go$
        linters: [gosec, errcheck, bodyclose, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/coste360/porto
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/coste360/porto
  exclusions:
    generated: lax
    paths:
      - internal/http/api/api.gen.go
      - _gen\.go$
