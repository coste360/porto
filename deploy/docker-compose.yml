# Porto: production deployment on SQLite (spec 31.1). The database is /data/porto.db in the porto-data volume.
#
#   cp .env.example deploy/.env          # then set PORTO_BASE_URL and PORTO_SECRET_KEY (openssl rand -base64 32)
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec porto /porto admin create --email ... --name ... --org ...
#
# Upgrade: set PORTO_VERSION (or keep "latest"), then "docker compose -f deploy/docker-compose.yml pull && ... up -d".
# Migrations run on start unless PORTO_AUTO_MIGRATE=false. Back up first:
#   docker compose -f deploy/docker-compose.yml exec porto /porto backup --out /data/before-upgrade.porto-backup
#
# Put a TLS reverse proxy in front of port 8080, or set PORTO_TLS_AUTOCERT_DOMAINS and publish 80 and 443 instead.
# The image has no shell: health is checked from outside with GET /healthz (liveness) and /readyz (readiness).
# For PostgreSQL use deploy/docker-compose.postgres.yml.

name: porto

services:
  porto:
    image: ghcr.io/coste360/porto:${PORTO_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORTO_PUBLISH_PORT:-8080}:8080"
    volumes:
      - porto-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  porto-data:
